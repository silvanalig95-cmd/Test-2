<script>
/* ============ AI realms ============ */
function landPath(from, targets, realmId){
  /* BFS over land adjacency; armies may only cross their own, hostile, or occupied ground */
  const passable = p => pv(p).r===realmId || hostile(pv(p).r, realmId) || pv(p).occ===realmId;
  const tset = new Set(targets);
  if(tset.has(from)) return null;
  const prev = {[from]:null};
  const q = [from];
  while(q.length){
    const cur = q.shift();
    for(const nx of (PROVDATA[cur].adj||[])){
      if(prev[nx]!==undefined || !passable(nx)) continue;
      prev[nx] = cur;
      if(tset.has(nx)){
        let step = nx;
        while(prev[step]!==from) step = prev[step];
        return step;
      }
      q.push(nx);
    }
  }
  return undefined; /* unreachable by land */
}
function aiTurn(rid){
  const R_ = rl(rid);
  if(R_.dead || isPlayer(rid)) return;
  const rul = ruler(rid);
  if(!rul) return;
  const wars = atWar(rid);
  const amb = rul.tr.includes('ambitious'), brave = rul.tr.includes('brave'),
    craven = rul.tr.includes('craven'), content = rul.tr.includes('content'),
    greedy = rul.tr.includes('greedy'), pious = rul.tr.includes('pious');

  /* --- economy --- */
  if(!wars.length && R_.gold > 75 && chance(.5)){
    const slot = realmProvs(rid).filter(p=>!pv(p).bld).sort((a,b)=>pv(b).dev-pv(a).dev)[0];
    if(slot){
      const b = pious&&chance(.4) ? 'cathedral' : greedy||chance(.5) ? 'market' : 'castle';
      R_.gold -= BUILDINGS[b].cost; pv(slot).bld = b;
    }
  }
  /* --- marriages (AI–AI) --- */
  if(chance(.15)){
    const mine = marriageCandidates(rid);
    if(mine.length){
      const partners = Object.values(G.realms).filter(r=>!r.dead&&r.id!==rid&&!isPlayer(r.id)&&!allianceBetween(r.id,rid)&&marriageCandidates(r.id).length);
      if(partners.length){
        const pr = pick(partners);
        const a = pick(mine);
        const b = marriageCandidates(pr.id).find(c=>c.sex!==a.sex);
        if(b && opinion(ruler(pr.id), rul) > -20) doMarriage(a,b);
      }
    }
  }
  /* --- declare war --- */
  if(!wars.length && (G.season<=1) && !G.regencyOf?.(rid)){
    if(age(rul)>=16){
      const claimants = [rul, ...Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&c.claims.length&&c.id!==rul.id)];
      let best=null;
      const viable = tgt => { const T=rl(tgt);
        return T && !T.dead && tgt!==rid && !truceBetween(rid,tgt) && !warBetween(rid,tgt) && !allianceBetween(rid,tgt); };
      for(const cl of claimants){
        for(const tgt of cl.claims){
          if(!viable(tgt)) continue;
          const ratio = realmStrength(rid) / Math.max(1, realmStrength(tgt));
          let need = 1.3;
          if(amb) need -= .3; if(brave) need -= .15;
          if(content) need += .5; if(craven) need += .4;
          /* 1066: the great gamble — history holds its breath */
          const scripted = G.year<=1067 && tgt==='england' && (rid==='normandy'||rid==='norway');
          if(scripted) need = .45;
          if(ratio >= need && chance(scripted? .85 : amb? .6 : .3)){
            best = {cl, tgt, cb:{type:'throne', target:tgt}}; break;
          }
        }
        if(best) break;
      }
      /* a province claim is a smaller, safer war */
      if(!best && rul.pclaims && rul.pclaims.length){
        for(const prov of rul.pclaims){
          const tgt = pv(prov).r;
          if(!tgt || tgt===rid || !viable(tgt)) continue;
          const ratio = realmStrength(rid) / Math.max(1, realmStrength(tgt));
          let need = 1.0;
          if(amb) need -= .2; if(content) need += .4; if(craven) need += .3;
          if(ratio >= need && chance(amb? .5 : .25)){
            best = {cl:rul, tgt, cb:{type:'province', target:prov}}; break;
          }
        }
      }
      if(best){
        declareWar(rid, best.tgt, best.cb, best.cl.id);
      }
    }
  }
  /* --- wage war --- */
  if(atWar(rid).length){
    const myArmies = G.armies.filter(a=>a.realm===rid);
    const fielded = myArmies.reduce((s,a)=>s+armySize(a),0);
    if(fielded < realmStrength(rid)*.5 && G.season<=1 && !myArmies.length){
      raiseArmy(rid, R_.cap);
    }
    const foes = new Set();
    for(const w of atWar(rid)){
      const mySideA = w.sides.a.includes(rid);
      for(const f of (mySideA? w.sides.b : w.sides.a)) foes.add(f);
    }
    for(const a of G.armies.filter(x=>x.realm===rid && !x.moved)){
      /* defend home sieges first, then unoccupied enemy ground, then contested ground */
      let targets = Object.keys(G.provinces).filter(p=>pv(p).r===rid && enemiesIn(p, rid).length);
      if(!targets.length) targets = Object.keys(G.provinces).filter(p=>foes.has(pv(p).r) && !pv(p).occ);
      if(!targets.length) targets = Object.keys(G.provinces).filter(p=>foes.has(pv(p).r) && pv(p).occ!==rid && !hostile(pv(p).occ, pv(p).r));
      if(!targets.length) continue;
      const step = landPath(a.prov, targets, rid);
      if(step === null) continue; /* already there */
      if(step === undefined){
        /* cross the sea: land where the defence is thinnest, capital first among equals */
        if(PROVDATA[a.prov].coast && R_.gold>=15){
          const coastal = targets.filter(p=>PROVDATA[p].coast)
            .sort((x,y)=> ((y===rl(pv(y).r)?.cap?1:0) - (x===rl(pv(x).r)?.cap?1:0)));
          const dest = coastal.find(p=>enemiesIn(p, rid).reduce((s,f)=>s+armySize(f),0) < armySize(a)*1.1);
          if(dest) moveArmy(a, dest, true);
        }
      } else {
        const foeArmies = enemiesIn(step, rid);
        const foeStr = foeArmies.reduce((s,f)=>s+armySize(f),0);
        if(foeStr === 0 || foeStr < armySize(a)*(brave?1.25:1.0)) moveArmy(a, step, false);
      }
    }
  } else {
    /* peace: send the levies home */
    for(const a of G.armies.filter(x=>x.realm===rid)) disbandArmy(a);
  }
  /* --- courtesies --- */
  if(chance(.1)){
    const others = Object.values(G.realms).filter(r=>!r.dead&&r.id!==rid);
    if(others.length){
      const o = pick(others);
      addOp(ruler(o.id), rul.id, 4);
    }
  }
  aiFillCouncil(rid);
}
</script>
<script>
/* ============ UI ============ */
const UI = {
  tabSel:'dyn',
  tab(t){ this.tabSel = t; this.renderLeft();
    for(const x of ['Dyn','Court','Council','Wars']) document.getElementById('tab'+x).classList.toggle('on', x.toLowerCase()===t);
  },
  centroid(pts){
    let x=0,y=0; for(const p of pts){x+=p[0];y+=p[1];} return [x/pts.length, y/pts.length];
  },
  medallion(c, big){
    const col = c.realm && rl(c.realm) ? rl(c.realm).col : '#777';
    const dead = c.dead ? 'opacity:.45;' : '';
    return `<svg class="medal${big?' big':''}" style="${dead}" viewBox="0 0 34 38">
      <path d="M3 3 h28 v18 q0 8 -14 14 q-14 -6 -14 -14 z" fill="${col}" stroke="#3a2c18" stroke-width="1.5"/>
      <text x="17" y="21" text-anchor="middle" font-size="${big?15:13}" fill="#f3e9cf" font-family="Georgia" font-weight="bold">${esc(c.nm[0])}</text>
      ${c.sex==='f'?'<circle cx="28" cy="7" r="3.4" fill="#f3e9cf" opacity=".8"/>':''}
      ${c.prison?'<text x="6" y="12" font-size="10">⛓</text>':''}
    </svg>`;
  },
  charRow(c, sub){
    return `<div class="charRow" onclick="UI.selChar('${c.id}')">${this.medallion(c)}
      <div class="nm"><div>${esc(fullName(c))}${c.dead?' †':''}</div>
      <div class="sub">${esc(sub!==undefined?sub:(age(c)+', '+c.tr.map(cap).join(', ')))}</div></div></div>`;
  },
  selChar(id){ G.sel={t:'char',id}; this.renderRight(); },
  selProv(id){
    if(G.moveMode){ Game.tryMove(id); return; }
    G.sel={t:'prov',id}; this.renderRight(); this.renderMap();
  },
  selArmy(id){
    const a = G.armies.find(x=>x.id===id);
    if(a && G.moveMode && a.id!==G.moveMode) { /* clicking another army during move: treat as prov click */ Game.tryMove(a.prov); return; }
    G.sel={t:'army',id}; G.moveMode=null; this.renderRight(); this.renderMap();
  },

  renderAll(){ this.renderTop(); this.renderMap(); this.renderLeft(); this.renderRight(); this.renderLog(); this.processQueue(); },
  renderTop(){
    document.getElementById('dateBox').textContent = `${SEASONS[G.season]}, Anno Domini ${G.year}`;
    const R_ = PRL();
    document.getElementById('realmBox').innerHTML = `<b style="color:#d9b95c">${esc(R_.n)}</b> — ${esc(fullName(PR()))}${G.regency?' <i>(regency)</i>':''}`;
    document.getElementById('goldBox').textContent = `🪙 ${Math.floor(R_.gold)}`;
    document.getElementById('prsBox').textContent = `☀ ${Math.floor(R_.prs)} prestige`;
    document.getElementById('legBox').textContent = `✠ ${Math.floor(R_.leg)} legitimacy`;
    document.getElementById('apBox').innerHTML = `Actions: <b>${G.ap}</b>`;
    document.getElementById('endBtn').disabled = !!G.over;
  },
  renderMap(){
    const svg = document.getElementById('mapSvg');
    let h = `<defs>
      <filter id="rough"><feTurbulence type="fractalNoise" baseFrequency="0.012" numOctaves="3" seed="7" result="n"/>
        <feDisplacementMap in="SourceGraphic" in2="n" scale="7"/></filter>
      <filter id="parchtex"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>
        <feColorMatrix in="n" type="matrix" values="0 0 0 0 0.42 0 0 0 0 0.33 0 0 0 0 0.18 0 0 0 0.06 0"/>
        <feComposite in2="SourceGraphic" operator="over"/></filter>
    </defs>`;
    /* striped pattern per occupier */
    const occCols = new Set();
    for(const p of Object.keys(G.provinces)) if(pv(p).occ) occCols.add(pv(p).occ);
    for(const o of occCols){
      h += `<pattern id="occ_${o}" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse">
        <rect width="9" height="9" fill="${rl(o).col}"/><rect width="9" height="4" fill="rgba(20,12,4,.35)"/></pattern>`;
    }
    h += `<g filter="url(#rough)">`;
    const selProv = G.sel && G.sel.t==='prov' ? G.sel.id : null;
    const moveTargets = G.moveMode ? Game.moveTargets() : {land:[],sea:[]};
    for(const [pid, pd] of Object.entries(PROVDATA)){
      const st = pv(pid);
      const fill = st.occ ? `url(#occ_${st.occ})` : (st.r && rl(st.r) ? rl(st.r).col : '#888');
      const cls = 'provPath' + (selProv===pid?' sel':'') + (moveTargets.land.includes(pid)||moveTargets.sea.includes(pid)?' moveTarget':'');
      h += `<polygon class="${cls}" points="${pd.pts.map(p=>p.join(',')).join(' ')}" fill="${fill}" onclick="UI.selProv('${pid}')"><title>${esc(pd.n)}</title></polygon>`;
    }
    h += `</g>`;
    for(const [pid, pd] of Object.entries(PROVDATA)){
      const [cx, cy] = this.centroid(pd.pts);
      h += `<text class="provName" x="${cx}" y="${cy+3}">${esc(pd.n)}</text>`;
      if(rl(pv(pid).r) && rl(pv(pid).r).cap===pid && !rl(pv(pid).r).dead)
        h += `<text class="capStar" x="${cx}" y="${cy-9}" text-anchor="middle" font-size="10" fill="#ffe9a0">★</text>`;
      if(G.armies.some(a=>a.prov===pid && a.siege>0))
        h += `<text class="capStar" x="${cx+22}" y="${cy-8}" font-size="13">🔥</text>`;
    }
    /* army tokens */
    const byProv = {};
    for(const a of G.armies){ (byProv[a.prov]=byProv[a.prov]||[]).push(a); }
    for(const [pid, list] of Object.entries(byProv)){
      const [cx, cy] = this.centroid(PROVDATA[pid].pts);
      list.forEach((a,i)=>{
        const x = cx - 14 + i*20, y = cy + 16;
        const seld = G.sel && G.sel.t==='army' && G.sel.id===a.id;
        h += `<g class="armyTok" onclick="UI.selArmy('${a.id}')">
          <circle cx="${x}" cy="${y}" r="11" fill="${rl(a.realm).col}" stroke="${seld?'#fff8d0':'#241a0c'}" stroke-width="${seld?3:1.6}"/>
          <text x="${x}" y="${y+3.5}">${(armySize(a)/1000).toFixed(1)}</text></g>`;
      });
    }
    svg.innerHTML = h;
  },
  renderLog(){
    const el = document.getElementById('log');
    el.innerHTML = G.log.slice(-60).map(e=>
      `<div class="entry ${e.cls}"><span class="stamp">${SEASONS[e.s].slice(0,3)} ${e.y}</span>${e.txt}</div>`).join('');
    el.scrollTop = el.scrollHeight;
  },
  renderLeft(){
    const el = document.getElementById('leftBody');
    const t = this.tabSel;
    if(t==='dyn'){
      const r = PR();
      let h = `<h3>House ${esc(r.dyn||'?')}</h3>`;
      h += this.charRow(r, `${title(r)}, ${age(r)} — your ruler`);
      if(r.sp && ch(r.sp)) h += this.charRow(ch(r.sp), `Consort, ${age(ch(r.sp))}`);
      const kids = Object.values(G.chars).filter(c=>c.fa===r.id||c.mo===r.id).sort((a,b)=>a.by-b.by);
      if(kids.length){ h += `<h3 style="margin-top:8px">Children</h3>`; for(const k of kids) h += this.charRow(k, k.dead?`died ${k.dead}`:undefined); }
      const heir = heirOf(G.player);
      h += `<div class="hint">Heir: ${heir? esc(fullName(heir))+' ('+age(heir)+')' : '<b>NONE — the line hangs by a thread</b>'}</div>`;
      const others = Object.values(G.chars).filter(c=>alive(c)&&c.dyn===r.dyn&&c.id!==r.id&&c.sp!==r.id&&!kids.includes(c)).slice(0,10);
      if(others.length){ h += `<h3 style="margin-top:8px">Kin</h3>`; for(const k of others) h += this.charRow(k); }
      el.innerHTML = h;
    }
    if(t==='court'){
      const court = myCourt().filter(c=>c.id!==PR().id).sort((a,b)=>opinion(b,PR())-opinion(a,PR()));
      el.innerHTML = `<h3>The Court</h3>` + court.map(c=>{
        const o = opinion(c, PR());
        return this.charRow(c, `${age(c)} · opinion <span class="${o>=0?'pos':'neg'}">${o>0?'+':''}${o}</span>${c.seat?' · '+cap(c.seat):''}${c.prison?' · imprisoned':''}`);
      }).join('') || 'An empty hall.';
    }
    if(t==='council'){
      const R_ = PRL();
      let h = `<h3>The Council</h3>`;
      const seatInfo = {marshal:['Marshal','mar','levies & sieges'], steward:['Steward','ste','tax income'],
        spymaster:['Spymaster','int','catches plots'], chaplain:['Chaplain','dip','yearly legitimacy']};
      for(const [seat,[nm,sk,duty]] of Object.entries(seatInfo)){
        const cid = R_.council[seat];
        const c = cid?ch(cid):null;
        h += `<div class="card"><b>${nm}</b> <span class="hint" style="margin:0">(${duty})</span><br>`;
        h += c&&alive(c) ? `${esc(fullName(c))} — skill ${skill(c,sk)}` : '<i>vacant</i>';
        h += ` <button class="small" onclick="Game.pickCouncil('${seat}')">Appoint</button></div>`;
      }
      h += `<div class="hint">Powerful kin expect seats. Competence pleases the treasury; snubs breed daggers.</div>`;
      el.innerHTML = h;
    }
    if(t==='wars'){
      const ws = atWar(G.player);
      let h = `<h3>Wars</h3>`;
      if(!ws.length) h += `<div class="hint">The realm is at peace. Someone, somewhere, considers that a problem to fix.</div>`;
      for(const w of ws){
        const s = warScore(w) * (w.sides.a.includes(G.player)?1:-1);
        h += `<div class="warRow"><b>${esc(rl(w.att).n)} vs ${esc(rl(w.def).n)}</b><br>
          <span class="hint">${w.cb.type==='throne'?'For the throne of '+esc(rl(w.cb.target).n):'For '+esc(PROVDATA[w.cb.target]?.n||'')}, claimant ${esc(ch(w.claimant)?fullName(ch(w.claimant)):'?')}</span><br>
          War score: <b class="${s>=0?'pos':'neg'}">${s>0?'+':''}${s}</b>
          <div class="actBtns">
            <button class="small" onclick="Game.offerPeace('${w.id}')">Negotiate peace</button>
          </div></div>`;
      }
      const myPlots = G.plots.filter(p=>ch(p.plotter)&&ch(p.plotter).realm===G.player&&Object.values(G.chars).some(c=>c.id===p.plotter));
      const mine = G.plots.filter(p=>p.plotter && ch(p.plotter) && (p.mine||ch(p.plotter).id===PR().id||ch(p.plotter).realm===G.player&&p.mine));
      const playerPlots = G.plots.filter(p=>p.mine);
      if(playerPlots.length){
        h += `<h3 style="margin-top:10px">Your Schemes</h3>`;
        for(const p of playerPlots){
          h += `<div class="plotRow">${cap(p.type)} — ${esc(plotTargetName(p))}<br><span class="hint">progress ${Math.min(99,Math.round(p.progress))}%, ${p.backers.length} backers</span>
            <button class="small" onclick="Game.abandonPlot('${p.id}')">Abandon</button></div>`;
        }
      }
      const known = G.plots.filter(p=>p.exposed);
      if(known.length){
        h += `<h3 style="margin-top:10px">Known Plots</h3>`;
        for(const p of known) h += `<div class="plotRow">${esc(fullName(ch(p.plotter)))} plots ${p.type} against ${esc(plotTargetName(p))}</div>`;
      }
      el.innerHTML = h;
    }
  },
  renderRight(){
    const el = document.getElementById('rightBody');
    if(!G.sel){ el.innerHTML = this.overviewHtml(); return; }
    if(G.sel.t==='prov') el.innerHTML = this.provHtml(G.sel.id);
    if(G.sel.t==='char'){ const c = ch(G.sel.id); el.innerHTML = c? this.charHtml(c) : this.overviewHtml(); }
    if(G.sel.t==='army'){
      const a = G.armies.find(x=>x.id===G.sel.id);
      el.innerHTML = a? this.armyHtml(a) : this.overviewHtml();
    }
  },
  overviewHtml(){
    const R_ = PRL();
    const provs = realmProvs(G.player);
    const income = provs.reduce((s,p)=>pv(p).occ?s:s+taxOf(p),0);
    let h = `<h3>${esc(R_.n)}</h3>
      <div class="kv"><span>Provinces</span><b>${provs.length}</b></div>
      <div class="kv"><span>Season income</span><b>${income} gold</b></div>
      <div class="kv"><span>Total levy pool</span><b>${fmtN(realmStrength(G.player))}</b></div>
      <div class="kv"><span>Standing retinue</span><b>${R_.retinue}</b></div>
      <div class="kv"><span>Steward bonus</span><b>+${Math.round(councilBonus(G.player,'steward')*4)}%</b></div>`;
    h += `<div class="kv"><span>Succession law</span><b>${R_.law==='elective'?'Elective':'Primogeniture'}</b></div>`;
    if(R_.excomm) h += `<div class="kv"><span>Standing with Rome</span><b class="neg">EXCOMMUNICATE</b></div>`;
    h += `<div class="actBtns">
      <button onclick="Game.act('feast')" ${G.ap<1||R_.gold<10?'disabled':''}>Host a feast (1 ⚡, 10🪙)</button>
      <button onclick="Game.act('retinue')" ${G.ap<1||R_.gold<12?'disabled':''}>Recruit retinue +100 (1 ⚡, 12🪙)</button>
      <button onclick="Game.act('court')" ${G.ap<1?'disabled':''}>Convene court (1 ⚡)</button>
      ${R_.excomm
        ? `<button onclick="Game.act('rome')" ${G.ap<1||R_.gold<40?'disabled':''} title="Barefoot in the snow if need be">☩ Reconcile with Rome (1⚡ 40🪙)</button>`
        : `<button onclick="Game.act('rome')" ${G.ap<1||R_.gold<15||G.flags['rome'+G.year]?'disabled':''} title="Once a year; +8 legitimacy">☩ Petition Rome (1⚡ 15🪙)</button>`}
      <button onclick="Game.act('law')" ${G.ap<1||R_.prs<50||G.flags['law'+PR().id]?'disabled':''} title="Once per ruler. Elective: magnates crown the ablest adult of the blood — no child regencies, but your sons may be passed over. Costs 50 ☀ and 10 ✠.">⚖ Adopt ${R_.law==='elective'?'primogeniture':'elective succession'} (1⚡ 50☀)</button>
    </div>`;
    if(provs.length>=G.impThresh && !G.over){
      h += `<div class="card" style="margin-top:9px"><b>An Empire Beckons.</b> You hold ${provs.length} provinces. For 200 prestige the bishops will anoint you Emperor — and the game is won.
      <div class="actBtns"><button class="primary" ${R_.prs<200?'disabled':''} onclick="Game.coronation()">Imperial Coronation (200 ☀)</button></div></div>`;
    } else if(!G.over){
      h += `<div class="hint">Empire at ${G.impThresh} provinces · survive to ${G.endYear} · or 2500 ☀ prestige.</div>`;
    }
    h += `<div class="hint">Select a province, character, or army to act. ⚡ = action points; you get ${G.regency?2:3} a season.</div>`;
    return h;
  },
  provHtml(pid){
    const pd = PROVDATA[pid], st = pv(pid);
    const mine = st.r===G.player;
    const R_ = st.r?rl(st.r):null;
    let h = `<h3>${esc(pd.n)}</h3>
      <div class="kv"><span>Realm</span><b>${R_?esc(R_.n):'—'}</b></div>
      ${st.occ?`<div class="kv"><span>Occupied by</span><b class="neg">${esc(rl(st.occ).n)}</b></div>`:''}
      <div class="kv"><span>Terrain</span><b>${TERRAIN[pd.t].n}</b></div>
      <div class="kv"><span>Development</span><b>${st.dev} / 5</b></div>
      <div class="kv"><span>Building</span><b>${st.bld?BUILDINGS[st.bld].n:'—'}</b></div>
      <div class="kv"><span>Levies</span><b>${fmtN(levyOf(pid))}</b></div>
      <div class="kv"><span>Tax / season</span><b>${taxOf(pid)}</b></div>`;
    if(mine){
      h += `<div class="actBtns">`;
      if(!st.bld) for(const [bid,b] of Object.entries(BUILDINGS))
        h += `<button class="small" ${G.ap<1||PRL().gold<b.cost?'disabled':''} onclick="Game.act('build','${pid}','${bid}')" title="${b.desc}">${b.n} (1⚡ ${b.cost}🪙)</button>`;
      if(st.dev<5) h += `<button class="small" ${G.ap<1||PRL().gold<30+st.dev*12?'disabled':''} onclick="Game.act('develop','${pid}')">Develop (1⚡ ${30+st.dev*12}🪙)</button>`;
      h += `<button class="small" ${G.ap<1?'disabled':''} onclick="Game.act('muster','${pid}')" title="Raise all realm levies here">Muster levies (1⚡)</button>`;
      h += `</div>`;
    } else if(R_ && !R_.dead){
      if(!PR().pclaims.includes(pid) && !warBetween(st.r, G.player))
        h += `<div class="actBtns"><button class="small" ${G.ap<1||PRL().gold<20?'disabled':''} onclick="Game.act('fabricate','${pid}')" title="Set the monks forging. Takes seasons; discovery costs prestige.">📜 Fabricate claim (1⚡ 20🪙)</button></div>`;
      h += this.diploHtml(st.r);
    }
    return h;
  },
  diploHtml(rid){
    const R_ = rl(rid), rul = ruler(rid);
    const myR = PR();
    const al = allianceBetween(rid, G.player);
    const w = warBetween(rid, G.player);
    const tr = truceBetween(rid, G.player);
    let h = `<h3 style="margin-top:10px">${esc(R_.n)}</h3>`;
    if(rul){
      const o = opinion(rul, myR);
      h += `<div class="charRow" onclick="UI.selChar('${rul.id}')">${this.medallion(rul)}<div class="nm"><div>${esc(fullName(rul))}</div>
        <div class="sub">${esc(title(rul))}, ${age(rul)} · thinks of you: <span class="${o>=0?'pos':'neg'}">${o>0?'+':''}${o}</span></div></div></div>`;
    }
    h += `<div class="kv"><span>Strength</span><b>~${fmtN(realmStrength(rid))}</b></div>`;
    if(al) h += `<div class="kv"><span>Alliance</span><b class="pos">sworn</b></div>`;
    if(tr) h += `<div class="kv"><span>Truce</span><b>until ${tr.until}</b></div>`;
    if(w){
      h += `<div class="actBtns"><button onclick="Game.offerPeace('${w.id}')">Negotiate peace</button></div>`;
      return h;
    }
    const claimants = [PR(), ...myCourt()].filter(c=>alive(c)&&c.claims.includes(rid));
    h += `<div class="actBtns">
      <button class="small" ${G.ap<1?'disabled':''} onclick="Game.act('envoy','${rid}')">Send envoy (1⚡)</button>
      <button class="small" ${G.ap<1||PRL().gold<10?'disabled':''} onclick="Game.act('gift','${rid}')">Send gift (1⚡ 10🪙)</button>
      <button class="small" ${G.ap<1?'disabled':''} onclick="Game.marryMenu('${rid}')">Arrange marriage (1⚡)</button>`;
    for(const cl of claimants){
      h += `<button class="small" ${G.ap<1||tr||G.regency?'disabled':''} onclick="Game.act('war','${rid}','${cl.id}')" title="${G.regency?'A regency cannot declare war':''}">⚔ Press ${esc(cl.nm)}’s claim (1⚡)</button>`;
    }
    let anyP = false;
    for(const cl of [PR(), ...myCourt()]){
      if(!alive(cl) || !cl.pclaims) continue;
      for(const p of cl.pclaims.filter(p=>pv(p).r===rid)){
        anyP = true;
        h += `<button class="small" ${G.ap<1||tr||G.regency?'disabled':''} onclick="Game.act('pwar','${rid}','${cl.id}|${p}')">⚔ Press claim on ${esc(PROVDATA[p].n)} (1⚡)</button>`;
      }
    }
    if(!claimants.length && !anyP) h += `<span class="hint">No claim on this realm — war without cause costs dearly. A patient ruler fabricates one (select one of their provinces).</span>
      <button class="small" ${G.ap<1||G.regency?'disabled':''} onclick="Game.act('war','${rid}',null)">⚔ War without cause (1⚡, -20 ✠)</button>`;
    h += `</div>`;
    if(R_.excomm) h += `<div class="hint">☩ This ruler is excommunicate — shunned by all Christendom.</div>`;
    return h;
  },
  charHtml(c){
    const mine = c.realm===G.player;
    const o1 = opinion(c, PR()), rulerOf = Object.values(G.realms).find(r=>!r.dead&&r.ruler===c.id);
    let h = `<div style="display:flex;gap:10px;align-items:center">${this.medallion(c,true)}
      <div><h3 style="margin:0">${esc(fullName(c))}${c.dead?' †':''}</h3>
      <div class="hint" style="margin:0">${esc(title(c))} · ${c.dead?('died '+c.dead+' aged '+(c.dead-c.by)):('age '+age(c))} · ${c.sex==='m'?'♂':'♀'} ${esc(c.dyn?('House '+c.dyn):'lowborn')}</div></div></div>`;
    h += `<div style="margin:7px 0">` + c.tr.map(t=>`<span class="trait ${TRAITS[t].opn<0?'bad':''}" title="${esc(TRAITS[t].d)}">${cap(t)}</span>`).join('') + `</div>`;
    h += `<div class="card"><span class="skl">Diplomacy <b>${skill(c,'dip')}</b></span><span class="skl">Martial <b>${skill(c,'mar')}</b></span>
      <span class="skl">Intrigue <b>${skill(c,'int')}</b></span><span class="skl">Stewardship <b>${skill(c,'ste')}</b></span></div>`;
    if(!c.dead && c.id!==PR().id){
      h += `<div class="kv"><span>Opinion of you</span><b class="${o1>=0?'pos':'neg'}">${o1>0?'+':''}${o1}</b></div>`;
      if(c.sp&&ch(c.sp)) h += `<div class="kv"><span>Spouse</span><b>${esc(fullName(ch(c.sp)))}</b></div>`;
      if(c.claims.length) h += `<div class="kv"><span>Claims</span><b>${c.claims.map(r=>rl(r)?rl(r).n:r).join(', ')}</b></div>`;
      if(c.pclaims && c.pclaims.length) h += `<div class="kv"><span>Province claims</span><b>${c.pclaims.map(p=>PROVDATA[p].n).join(', ')}</b></div>`;
      h += `<div class="actBtns">`;
      if(mine){
        if(c.prison){
          h += `<button class="small" onclick="Game.act('release','${c.id}')">Release (0⚡)</button>
            <button class="small" ${G.ap<1?'disabled':''} onclick="Game.act('execute','${c.id}')">Execute (1⚡, -✠)</button>`;
        } else {
          h += `<button class="small" ${G.ap<1||PRL().gold<8?'disabled':''} onclick="Game.act('cgift','${c.id}')">Gift (1⚡ 8🪙)</button>`;
          if(!c.sp&&age(c)>=16) h += `<button class="small" ${G.ap<1?'disabled':''} onclick="Game.marryMenuChar('${c.id}')">Arrange marriage (1⚡)</button>`;
          h += `<button class="small" ${G.ap<1?'disabled':''} onclick="Game.act('imprison','${c.id}')">Imprison (1⚡, -opinion)</button>`;
        }
      }
      if(c.id!==PR().id && !c.dead){
        h += `<button class="small" ${G.ap<1?'disabled':''} onclick="Game.act('plotMurder','${c.id}')" title="A season or three of quiet work">🗡 Plot murder (1⚡)</button>
          <button class="small" ${G.ap<1?'disabled':''} onclick="Game.act('plotSlander','${c.id}')">🐍 Spread slander (1⚡)</button>`;
      }
      h += `</div>`;
      if(rulerOf && rulerOf.id!==G.player) h += `<div class="hint">Rules ${esc(rulerOf.n)}. Click their lands for diplomacy.</div>`;
    }
    return h;
  },
  armyHtml(a){
    const mine = a.realm===G.player;
    const cm = ch(a.cmdr);
    let h = `<h3>${esc(rl(a.realm).n)} host</h3>
      <div class="kv"><span>At</span><b>${esc(PROVDATA[a.prov].n)}</b></div>
      <div class="kv"><span>Levies</span><b>${fmtN(a.levies)}</b></div>
      <div class="kv"><span>Retinue</span><b>${fmtN(a.retinue)}</b></div>
      <div class="kv"><span>Mercenaries</span><b>${fmtN(a.mercs)}</b></div>
      <div class="kv"><span>Commander</span><b>${cm?esc(fullName(cm))+' (Martial '+skill(cm,'mar')+')':'—'}</b></div>
      ${a.siege?`<div class="kv"><span>Siege progress</span><b>${Math.min(99,Math.round(a.siege))}%</b></div>`:''}`;
    if(mine){
      h += `<div class="actBtns">
        <button ${a.moved?'disabled':''} onclick="Game.startMove('${a.id}')">${a.moved?'Already moved':'March / Sail'}</button>
        <button class="small" onclick="Game.pickCommander('${a.id}')">Change commander</button>
        <button class="small" onclick="Game.act('disband','${a.id}')">Disband</button>
      </div>`;
      if(G.moveMode) h += `<div class="hint">Click a highlighted province. Dashed = by sea (15🪙, storm risk). Marching into an enemy host gives battle at once.</div>`;
      h += `<div class="hint">Armies move once a season. Autumn and winter kill the unhoused — bring them home or press hard.</div>`;
    }
    return h;
  },
  /* ---- modal queue ---- */
  processQueue(){
    const host = document.getElementById('modalHost');
    if(!G.eventQueue.length){ host.innerHTML=''; return; }
    const ev = G.eventQueue[0];
    host.innerHTML = `<div class="modalBack"><div class="modal">
      <h2>${ev.title}</h2><div class="body">${ev.text}</div>
      <div class="choices">${ev.choices.map((c,i)=>`<button onclick="UI.choose(${i})">${c.t}</button>`).join('')}</div>
    </div></div>`;
  },
  choose(i){
    const ev = G.eventQueue.shift();
    try{ ev.choices[i].fx(); }catch(err){ console.error(err); }
    this.renderAll();
  },
  modal(title, html, choices){
    queueEvent({title, text:html, choices});
    this.processQueue();
  },
  help(){
    this.modal('How to Rule',
    `<b>You are a dynasty, not a nation.</b> Keep the bloodline alive and the realm grows around it; lose your last province or your last dynast and the chronicle closes.<br><br>
    <b>Each season</b> you get 2–3 action points (⚡) — marriages, buildings, plots, wars all compete for them. Armies move once a season for free.<br><br>
    <b>Seasons matter:</b> muster in spring, fight in summer, go home (or gamble) in autumn — winter in the field maims armies.<br><br>
    <b>Marriage</b> = alliance. <b>Claims</b> = lawful war. <b>Legitimacy</b> keeps your own nobles from ideas. <b>Opinion</b> decides who joins whose plot — and plots are always running, including against you. Your spymaster is your shield.<br><br>
    <b>Victory:</b> grow the realm until the bishops crown you Emperor, keep the dynasty alive for a hundred years, or amass 2500 prestige. Save often; die well.<br><br>
    <b>No claim, no war?</b> Select an enemy province and set the monks to <i>fabricating</i> one. Rome can be petitioned for legitimacy — and will excommunicate failing or godless kings. Succession law can be changed once per ruler: elective crowns the ablest adult of the blood instead of the firstborn child.`,
    [{t:'To the throne room.', fx:()=>{}}]);
  },
};
</script>
<script>
/* ============ Actions, turn loop, boot ============ */
const Game = {
  spend(n){ if(G.ap<n) return false; G.ap-=n; return true; },
  act(type, a, b){
    const R_ = PRL();
    switch(type){
      case 'feast': if(!this.spend(1)) return; R_.gold-=10; R_.prs+=10;
        for(const c of myCourt()) addOp(c, PR().id, 6);
        logIt('court','You feast the court; grudges soften under grease and mead.'); break;
      case 'retinue': if(!this.spend(1)) return; R_.gold-=12; R_.retinue=Math.min(600,R_.retinue+100);
        logIt('war','A hundred sworn swords join your standing retinue.'); break;
      case 'court': if(!this.spend(1)) return; R_.leg=clamp(R_.leg+4,0,100);
        const c0 = pick(myCourt()); if(c0) addOp(c0, PR().id, 10);
        logIt('court','You hold open court; justice is seen to be done, mostly.'); break;
      case 'build': if(R_.gold<BUILDINGS[b].cost||!this.spend(1)) return;
        R_.gold-=BUILDINGS[b].cost; pv(a).bld=b;
        logIt('court',`A ${BUILDINGS[b].n.toLowerCase()} rises at ${PROVDATA[a].n}.`); break;
      case 'develop': { const cost=30+pv(a).dev*12; if(R_.gold<cost||!this.spend(1)) return;
        R_.gold-=cost; pv(a).dev++; logIt('court',`${PROVDATA[a].n} grows: roads, mills, and men.`); break; }
      case 'muster': if(!this.spend(1)) return; raiseArmy(G.player, a); break;
      case 'envoy': if(!this.spend(1)) return;
        addOp(ruler(a), PR().id, 10+skill(PR(),'dip'));
        logIt('court',`Your envoy flatters the court of ${rl(a).n}.`); break;
      case 'gift': if(R_.gold<10||!this.spend(1)) return; R_.gold-=10;
        addOp(ruler(a), PR().id, 20);
        logIt('court',`Gold and falcons for ${rl(a).n}; their ruler smiles.`); break;
      case 'cgift': if(R_.gold<8||!this.spend(1)) return; R_.gold-=8;
        addOp(ch(a), PR().id, 18); logIt('court',`A gift finds ${fullName(ch(a))}.`); break;
      case 'war': { if(G.regency||!this.spend(1)) return;
        const claimant = b? ch(b) : null;
        if(claimant) declareWar(G.player, a, {type:'throne', target:a}, claimant.id);
        else { declareWar(G.player, a, {type:'none', target:a}); R_.leg=clamp(R_.leg-20,0,100); }
        break; }
      case 'pwar': { if(G.regency||!this.spend(1)) return;
        const [cid, prov] = b.split('|');
        declareWar(G.player, a, {type:'province', target:prov}, cid);
        break; }
      case 'fabricate': { if(R_.gold<20||!this.spend(1)) return;
        R_.gold -= 20;
        const p = startPlot(PR().id, 'fabricate', a, G.player); p.mine = true;
        logIt('plot', `In a quiet scriptorium, work begins on a very old charter concerning ${PROVDATA[a].n}.`);
        break; }
      case 'rome': {
        if(R_.excomm){ if(R_.gold<40||!this.spend(1)) return;
          R_.gold -= 40; R_.excomm = false; R_.leg = clamp(R_.leg+10,0,100);
          logIt('court','Barefoot, penitent, and considerably poorer, you are received back into the Church.');
          chron(`In this year the ${PR().sex==='m'?'king':'queen'} was reconciled with Holy Church, having discovered that Hell holds no vassals.`);
        } else { if(R_.gold<15||G.flags['rome'+G.year]||!this.spend(1)) return;
          R_.gold -= 15; G.flags['rome'+G.year]=1; R_.leg = clamp(R_.leg+8,0,100);
          logIt('court','Gold flows to Rome; blessings flow back. The exchange rate is stable.');
        }
        break; }
      case 'law': { if(R_.prs<50||G.flags['law'+PR().id]||!this.spend(1)) return;
        R_.prs -= 50; R_.leg = clamp(R_.leg-10,0,100); G.flags['law'+PR().id]=1;
        R_.law = R_.law==='elective' ? 'primo' : 'elective';
        const heirNow = heirOf(G.player);
        logIt('court', `The magnates assent: the crown of ${R_.n} now passes by ${R_.law==='elective'?'election of the wise — or at least the loud':'right of the firstborn'}.` );
        chron(`In this year the law of succession was changed, which pleased those it favored and taught patience to the rest.`);
        /* passed-over sons notice immediately */
        for(const k of myKids()){
          if(k.sex==='m' && age(k)>=16 && heirNow && k.id!==heirNow.id){ addOp(k, PR().id, -25); }
        }
        break; }
      case 'imprison': if(!this.spend(1)) return; imprison(ch(a));
        for(const c of myCourt()) addOp(c, PR().id, -4); break;
      case 'release': { const c=ch(a); c.prison=false; addOp(c,PR().id,25);
        logIt('court',`${fullName(c)} walks free, blinking.`); break; }
      case 'execute': if(!this.spend(1)) return;
        killChar(ch(a),'was put to death at the ruler’s command');
        R_.leg=clamp(R_.leg-8,0,100);
        for(const c of myCourt()) addOp(c, PR().id, -8); break;
      case 'plotMurder': { const t=ch(a); if(t.realm===G.player&&t.dyn===PR().dyn){ UI.modal('Kinslaying','Even your spymaster refuses to put this in writing. Plotting the murder of your own dynasty is a step the game of thrones forgives — but this game does not require.',[{t:'Withdraw the thought.',fx:()=>{}}]); return; }
        if(!this.spend(1)) return;
        const p=startPlot(PR().id,'murder',a); p.mine=true;
        logIt('plot',`Quiet men begin quiet work regarding ${fullName(t)}.`); break; }
      case 'plotSlander': { if(!this.spend(1)) return;
        const p=startPlot(PR().id,'slander',a); p.mine=true;
        logIt('plot',`Coin changes hands; poets sharpen quills against ${fullName(ch(a))}.`); break; }
      case 'disband': { const ar=G.armies.find(x=>x.id===a); if(ar) disbandArmy(ar);
        G.sel=null; break; }
    }
    UI.renderAll();
  },
  abandonPlot(pid){ G.plots = G.plots.filter(p=>p.id!==pid); UI.renderAll(); },
  marryMenu(rid){
    const mine = marriageCandidates(G.player), theirs = marriageCandidates(rid);
    const combos = [];
    for(const m of mine) for(const t of theirs) if(m.sex!==t.sex && combos.length<8) combos.push([m,t]);
    if(!combos.length){ UI.modal('No Match Possible','Between the two courts there is no marriageable pair — wrong ages, wrong sexes, or rings already worn.',[{t:'A pity.',fx:()=>{}}]); return; }
    UI.modal('A Marriage with '+rl(rid).n,
      'Choose the match. A wedding binds the realms in alliance — while both spouses draw breath.',
      combos.map(([m,t])=>({t:`${fullName(m)} (${age(m)}) ↔ ${fullName(t)} (${age(t)}, ${t.tr.map(cap).join(', ')})`,
        fx:()=>{ if(!this.spend(1)) return;
          if(proposeMarriage(m,t)) UI.modal('The Banns Are Read', `${rl(rid).n} accepts. The houses are joined, the alliance sworn.`, [{t:'Excellent.',fx:()=>{}}]);
          else UI.modal('Rebuffed', `${rl(rid).n} declines the match, with courtesy as thin as March ice. <em>(They think too little of you — improve relations or raise your prestige.)</em>`, [{t:'Their loss.',fx:()=>{}}]);
        }})).concat([{t:'— Never mind —', fx:()=>{}}]));
  },
  marryMenuChar(cid){
    const m = ch(cid);
    const options = [];
    for(const r of Object.values(G.realms)){
      if(r.dead||r.id===G.player) continue;
      for(const t of marriageCandidates(r.id)) if(t.sex!==m.sex && options.length<10) options.push(t);
    }
    if(!options.length){ UI.modal('No Match Found','No foreign court offers a marriageable partner this season.',[{t:'Wait, then.',fx:()=>{}}]); return; }
    UI.modal('A Match for '+fullName(m), 'Whose hand shall be sought?',
      options.map(t=>({t:`${fullName(t)} of ${rl(t.realm).n} (${age(t)}, ${t.tr.map(cap).join(', ')})`,
        fx:()=>{ if(!this.spend(1)) return;
          if(proposeMarriage(m,t)) UI.modal('The Banns Are Read', `${rl(t.realm).n} accepts the match.`, [{t:'Good.',fx:()=>{}}]);
          else UI.modal('Rebuffed', `${rl(t.realm).n} declines. Their opinion of you is too low, or their ambitions too high.`, [{t:'So be it.',fx:()=>{}}]);
        }})).concat([{t:'— Never mind —', fx:()=>{}}]));
  },
  pickCouncil(seat){
    const skmap = {marshal:'mar',steward:'ste',spymaster:'int',chaplain:'dip'};
    const cands = myCourt().filter(c=>c.id!==PR().id&&!c.prison&&age(c)>=16)
      .sort((a,b)=>skill(b,skmap[seat])-skill(a,skmap[seat])).slice(0,8);
    UI.modal('Appoint '+cap(seat),'Competence serves the realm; blood expects the honor anyway.',
      cands.map(c=>({t:`${fullName(c)} — skill ${skill(c,skmap[seat])}, opinion ${opinion(c,PR())}${c.seat?' (currently '+cap(c.seat)+')':''}`,
        fx:()=>{ const R_=PRL(); const old=R_.council[seat];
          if(old&&ch(old)&&old!==c.id){ ch(old).seat=null; addOp(ch(old),PR().id,-15); }
          if(c.seat) R_.council[c.seat]=null;
          c.seat=seat; R_.council[seat]=c.id; addOp(c,PR().id,20);
          logIt('court',`${fullName(c)} is named ${cap(seat)}.`);
        }})).concat([{t:'— Leave it —', fx:()=>{}}]));
  },
  pickCommander(aid){
    const a = G.armies.find(x=>x.id===aid); if(!a) return;
    const cands = myCourt().filter(c=>age(c)>=16&&!c.prison).sort((x,y)=>skill(y,'mar')-skill(x,'mar')).slice(0,6);
    UI.modal('Who Commands?','A good commander is worth a thousand levies. A brave one is worth two thousand, briefly.',
      cands.map(c=>({t:`${fullName(c)} — Martial ${skill(c,'mar')}${c.id===PR().id?' (your ruler — glory and risk)':''}`,
        fx:()=>{ a.cmdr=c.id; }})).concat([{t:'— Keep current —',fx:()=>{}}]));
  },
  startMove(aid){ G.moveMode = aid; UI.renderMap(); UI.renderRight(); },
  moveTargets(){
    const a = G.armies.find(x=>x.id===G.moveMode);
    if(!a) return {land:[],sea:[]};
    const ok = p => { const st=pv(p); return st.r===a.realm || hostile(st.r, a.realm) || st.occ===a.realm; };
    const land = (PROVDATA[a.prov].adj||[]).filter(ok);
    let sea = [];
    if(PROVDATA[a.prov].coast && PRL().gold>=15)
      sea = Object.keys(PROVDATA).filter(p=>p!==a.prov && PROVDATA[p].coast && ok(p) && !land.includes(p));
    return {land, sea};
  },
  tryMove(pid){
    const a = G.armies.find(x=>x.id===G.moveMode);
    const t = this.moveTargets();
    G.moveMode = null;
    if(a && !a.moved){
      if(t.land.includes(pid)) moveArmy(a, pid, false);
      else if(t.sea.includes(pid)) moveArmy(a, pid, true);
    }
    UI.renderAll();
  },
  offerPeace(wid){
    const w = G.wars.find(x=>x.id===wid); if(!w) return;
    const iAmA = w.sides.a.includes(G.player);
    const s = warScore(w) * (iAmA?1:-1);
    const foe = iAmA ? w.def : w.att;
    const ch_ = [];
    if(s>=55) ch_.push({t: iAmA&&w.cb.type==='throne' ? '👑 Demand the crown itself — full conquest.' :
        iAmA&&w.cb.type==='province' ? 'Demand '+PROVDATA[w.cb.target].n+' be ceded.' : 'Demand tribute and submission.',
      fx:()=>enforceDemands(w, iAmA?'a':'b')});
    ch_.push({t:'Offer white peace — everyone goes home.', fx:()=>{
      if(s >= 0 || G.year - w.started >= 4) endWar(w,'white','Both crowns keep what they had.');
      else UI.modal('Refused', `${rl(foe).n} smells victory and will not sheathe the sword for nothing.`, [{t:'Then we fight on.',fx:()=>{}}]);
    }});
    ch_.push({t:'Surrender on their terms. End it.', fx:()=>enforceDemands(w, iAmA?'b':'a')});
    ch_.push({t:'— Break off talks —', fx:()=>{}});
    UI.modal('Terms of Peace',
      `War score: <b class="${s>=0?'pos':'neg'}">${s>0?'+':''}${s}</b>. Demands need +55; white peace needs the upper hand or a long, tired war. Surrender is always on the menu — it is the prices that vary.`, ch_);
  },
  coronation(){
    const R_ = PRL();
    if(R_.prs<200 || realmProvs(G.player).length<G.impThresh) return;
    R_.prs -= 200;
    chron(`In this year, before God and such magnates as valued their lands, ${fullName(PR())} was crowned EMPEROR, lord of ${realmProvs(G.player).length} provinces from sea to sea. The chronicler was given a new scriptorium and finds his conscience untroubled.`);
    this.gameOver(true, `The bishops anoint you. The crowds roar. ${fullName(PR())}, Emperor. Your dynasty has climbed as high as crowns go.`);
  },
  /* ---------- turn loop ---------- */
  fastForward(){
    if(!G || G.over || G.eventQueue.length) return;
    for(let i=0; i<8; i++){
      this.endSeason();
      if(!G || G.over || G.eventQueue.length) break;
      if(atWar(G.player).length) break;
      if(G.armies.some(a=>a.realm===G.player)) break;
      if(Object.keys(G.provinces).some(p=>enemiesIn(p, G.player).length && pv(p).r===G.player)) break;
    }
  },
  endSeason(){
    if(!G || G.over || G.eventQueue.length) return;
    warUpkeep();
    siegeTick();
    for(const rid of Object.keys(G.realms)) aiTurn(rid);
    checkWarEnds();
    plotTick();
    aiPlots();
    tryBirths();
    seasonDeaths();
    if(G.over){ UI.renderAll(); return; }
    G.season++;
    if(G.season>3){ G.season=0; G.year++; this.yearly(); }
    if(G.plague){
      G.plague--;
      const p = pick(Object.keys(G.provinces));
      if(pv(p).dev>1 && chance(.5)){ pv(p).dev--; logIt('court', `The pestilence empties ${PROVDATA[p].n}; fields go back to briar.`); }
      if(!G.plague){
        logIt('court','The Great Mortality burns itself out at last. The living inherit a quieter world.');
        chron(`In this year the great pestilence ended. The chronicler, who buried three fellow monks and one abbot, records it without comment. The comment is implied.`);
      }
    }
    this.income();
    for(const a of G.armies) a.moved=false;
    G.regency = age(PR())<16;
    G.ap = G.regency?2:3;
    fireEvents();
    this.victoryCheck();
    UI.renderAll();
  },
  income(){
    for(const R_ of Object.values(G.realms)){
      if(R_.dead) continue;
      let inc = 0;
      for(const p of realmProvs(R_.id)) if(!pv(p).occ) inc += taxOf(p);
      inc *= 1 + councilBonus(R_.id,'steward')*.04;
      if(G.season===2) inc *= 2; /* harvest */
      if(G.plague) inc *= .65; /* dead men pay no geld */
      R_.gold += inc - (R_.retinue/200);
      R_.gold = Math.max(0, Math.round(R_.gold*10)/10);
      R_.prs += R_.rank==='kingdom'?2:1;
    }
  },
  yearly(){
    for(const R_ of Object.values(G.realms)){
      if(R_.dead) continue;
      let d = (50 - R_.leg)*.06 + councilBonus(R_.id,'chaplain')*.4;
      d += realmProvs(R_.id).filter(p=>pv(p).bld==='cathedral').length;
      if(R_.excomm) d -= 4;
      R_.leg = clamp(R_.leg + d, 0, 100);
      /* Rome watches: godless or failing kings invite the anathema */
      const rul = ruler(R_.id);
      if(rul && !R_.excomm && (R_.leg<30 || (rul.tr.includes('cruel')&&rul.tr.includes('cynical'))) && chance(.15)){
        R_.excomm = true;
        logIt('court', `☩ Rome pronounces anathema: ${fullName(rul)} of ${R_.n} is EXCOMMUNICATED.`);
        if(isPlayer(R_.id)){
          chron(`In this year the Holy Father cast the ${rul.sex==='m'?'king':'queen'} out of the communion of the faithful, and the candles were snuffed, and every ambitious neighbor heard them go out.`);
          queueEvent({ title:'Anathema',
            text:`<span class="dropcap">Bell, book, and candle. Rome has cut you off from the Church — your oaths are void in the eyes of God, your vassals' loyalty is now a sin, and every rival suddenly remembers how devout they are. <em>(-25 opinion with everyone, legitimacy bleeds each year. Reconciling will cost gold and pride.)</em></span>`,
            choices:[{t:'God and I will discuss this privately.', fx:()=>{}}]});
        }
      }
      /* a crusading ruler comes home — or doesn't */
      if(isPlayer(R_.id) && G.flags.crusadeReturn && G.year >= G.flags.crusadeReturn){
        G.flags.crusadeReturn = 0;
        if(chance(.2)){
          queueEvent({ title:'News from the Holy Land', text:`The ships return without the ${PR().sex==='m'?'king':'queen'}. A fever outside Acre. The body travels home in salt and cedar; the crown travels faster.`,
            choices:[{t:'God takes His own.', fx:()=>killChar(PR(),'died on crusade, within sight of the walls of Acre')}]});
        } else {
          R_.prs += 60; R_.leg = clamp(R_.leg+15,0,100); R_.gold += 20;
          queueEvent({ title:'The Crusader Returns', text:`Scarred, sun-blackened, and trailing legend, you return from the East with relics, ransoms, and a name that will outlive the deeds. <em>(+60 prestige, +15 legitimacy, +20 gold)</em>`,
            choices:[{t:'Deus vult.', fx:()=>{ chron(`In this year the ${PR().sex==='m'?'king':'queen'} returned from the Holy Land in glory, and the tales grew with each mile from the sea.`); }}]});
        }
      }
    }
    if(G.flags.spyBoost) G.flags.spyBoost = Math.max(0, G.flags.spyBoost-1);
  },
  victoryCheck(){
    if(G.over) return;
    if(G.year>=G.endYear) this.gameOver(true, `One hundred years. Through fevers, knives, storms, and stupidity, the house of ${PR().dyn} still reigns in ${PRL().n}. Most dynasties of ${G.endYear-100} are dust and cautionary tales; yours is a hundred years old and arguing about breakfast. This is victory.`);
    else if(PRL().prs>=2500) this.gameOver(true, `Your name is spoken in courts you have never seen. ${fmtN(Math.floor(PRL().prs))} prestige: minstrels, chroniclers, and terrified neighbours agree — this is the greatest house of the age.`);
  },
  gameOver(won, msg){
    if(G.over) return;
    G.over = won?'won':'lost';
    chron(won? `And here the chronicler lays down a happy pen.` : `And here the chronicle of this house ends. Pray for its souls; borrow nothing from its example.`);
    queueEvent({ title: won? '🏆 The Chronicle Ends in Glory' : '⚰ The Chronicle Ends',
      text:`<span class="dropcap">${msg}</span>`,
      choices:[{t:'Read the chronicle of the house.', fx:()=>this.showChronicle()}]});
    UI.processQueue();
  },
  showChronicle(){
    const r = PR();
    const ep = r.tr.includes('cruel')?'the Cruel':r.tr.includes('genius')?'the Wise':r.tr.includes('brave')?'the Bold'
      :r.tr.includes('kind')?'the Good':r.tr.includes('pious')?'the Pious':r.tr.includes('lustful')?'the Amorous'
      :r.tr.includes('greedy')?'the Grasping':G.over==='won'?'the Great':'the Unlucky';
    const host = document.getElementById('modalHost');
    host.innerHTML = `<div class="modalBack" id="chronicleModal"><div class="modal">
      <h2>The Chronicle of House ${esc(r.dyn||'?')}</h2>
      <div class="hint" style="margin-bottom:10px">…as set down by the monks, ending in the reign of ${esc(fullName(r))} “${ep}”, ${SEASONS[G.season]} ${G.year}. ${G.over==='won'?'A triumphant house.':G.over==='lost'?'A fallen house.':''}</div>
      <div style="max-height:52vh;overflow-y:auto;padding-right:6px">` +
      G.chron.map(e=>`<div class="chronEntry"><span class="yr">A.D. ${e.y}</span>${e.txt}</div>`).join('') +
      `</div><div class="choices" style="margin-top:12px">
        ${G.over?'<button class="primary" onclick="location.reload()">Begin a new chronicle</button>':'<button onclick="UI.renderAll()">Return to the realm</button>'}
      </div></div></div>`;
  },
  /* ---------- persistence ---------- */
  save(){
    if(!G){ return; }
    if(G.eventQueue.length){ UI.modal('Not Now','Settle the matter before you (the open event) before the scribes can copy the ledgers.',[{t:'Very well.',fx:()=>{}}]); return; }
    try{
      const s = JSON.stringify(Object.assign({}, G, {eventQueue:[], sel:null, moveMode:null, _cid}));
      localStorage.setItem('crownRealmSave', s);
      logIt('court','The scribes copy the ledgers. (Game saved.)');
      UI.renderLog();
    }catch(e){ alert('Save failed: '+e); }
  },
  load(){
    const s = localStorage.getItem('crownRealmSave');
    if(!s){ alert('No saved chronicle found.'); return; }
    try{
      G = JSON.parse(s);
      G.eventQueue = []; G.sel=null; G.moveMode=null;
      _cid = G._cid||900;
      srand((G.seed + G.year*4 + G.season)>>>0);
      document.getElementById('setup').style.display='none';
      UI.tab('dyn'); UI.renderAll();
      logIt('court','The chronicle resumes. (Game loaded.)'); UI.renderLog();
    }catch(e){ alert('Load failed: '+e); }
  },
  start(scenId, rid){
    newGame(rid, (Date.now() ^ (Math.random()*1e9))>>>0, scenId);
    document.getElementById('setup').style.display='none';
    fireEvents();
    UI.tab('dyn');
    UI.renderAll();
  },
};

/* ---------- setup screen ---------- */
function renderSetup(scenId){
  const S = SCENARIOS[scenId];
  document.getElementById('scenTabs').innerHTML = Object.entries(SCENARIOS).map(([sid,s])=>
    `<button class="scenBtn${sid===scenId?' on':''}" onclick="renderSetup('${sid}')">${s.n}</button>`).join('');
  document.getElementById('setupSub').textContent = S.sub;
  document.getElementById('realmCards').innerHTML = Object.entries(S.cards).map(([rid,card])=>{
    const r = REALMDATA[rid];
    return `
    <div class="realmCard" onclick="Game.start('${scenId}','${rid}')">
      <svg class="shield" viewBox="0 0 34 38"><path d="M3 3 h28 v18 q0 8 -14 14 q-14 -6 -14 -14 z" fill="${r.col}" stroke="#3a2c18" stroke-width="1.5"/>
      <text x="17" y="21" text-anchor="middle" font-size="13" fill="#f3e9cf" font-family="Georgia" font-weight="bold">${r.n[0]}</text></svg>
      <h2>${r.n}</h2><div class="diff">${card.diff}</div><p>${card.blurb}</p>
    </div>`;}).join('');
}
renderSetup('y1066');
</script>
