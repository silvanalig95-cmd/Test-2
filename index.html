<script>
/* ============ War ============ */
function warBetween(a,b){ return G.wars.find(w=>w.sides && ((w.sides.a.includes(a)&&w.sides.b.includes(b))||(w.sides.a.includes(b)&&w.sides.b.includes(a)))); }
function hostile(a,b){ return a!==b && !!warBetween(a,b); }
function atWar(rid){ return G.wars.filter(w=>w.sides.a.includes(rid)||w.sides.b.includes(rid)); }
function warAge(w){ const st = (w.startTurn!=null) ? w.startTurn : (w.started||G.year)*4; return (G.year*4+G.season) - st; } /* age in seasons */
function truceBetween(a,b){ return G.truces.find(t=>((t.a===a&&t.b===b)||(t.a===b&&t.b===a)) && t.until > G.year + G.season/4); }

function declareWar(att, def, cb, claimantId){
  const w = { id:'w'+(++G.wid), att, def, sides:{a:[att], b:[def]}, cb, claimant:claimantId||rl(att).ruler,
    bp:0, started:G.year, startTurn:G.year*4+G.season };
  G.wars.push(w);
  rl(att).leg = clamp(rl(att).leg + (cb.type==='none' ? -20 : 0), 0, 100);
  addOp(ruler(def), ruler(att).id, -50);
  const cbTxt = cb.type==='throne' ? `pressing the claim of ${fullName(ch(w.claimant))} to the throne of ${rl(cb.target).n}` :
    cb.type==='province' ? `claiming the province of ${PROVDATA[cb.target].n}` : 'without just cause, God forgive them';
  logIt('war', `⚔ ${rl(att).n} declares war on ${rl(def).n}, ${cbTxt}.`);
  chron(`In this year ${title(ruler(att))} ${fullName(ruler(att))} raised his banners against ${rl(def).n}, ${cbTxt}.`);
  /* the defender must be told, plainly and at once, when the war is against them */
  if(def===G.player && att!==G.player){
    const holy = cb.holy ? ' It is proclaimed a <b>holy war</b>.' : '';
    queueEvent({ who: ruler(att) ? ruler(att).id : null, title:'⚔ War Is Declared Upon You',
      text:`<span class="dropcap">${fullName(ruler(att))} of ${rl(att).n} has declared war upon you, ${cbTxt}.${holy}</span><br><br>Their strength: about <b>${fmtN(realmStrength(att))}</b> against your <b>${fmtN(realmStrength(G.player))}</b>. Muster in spring, strike in summer — autumn and winter maul armies left in the field.`,
      choices:[{t:'To arms!', fx:()=>{}}, {t:'Open the war council.', fx:()=>{ UI.tab('wars'); }}] });
    toast(`⚔ <b class="neg">${esc(rl(att).n)} declares war on you!</b>`);
  }
  /* call allies */
  for(const [rid, side] of [[att,'a'],[def,'b']]){
    for(const al of G.alliances){
      if(al.a!==rid && al.b!==rid) continue;
      const other = al.a===rid ? al.b : al.a;
      if(w.sides.a.includes(other)||w.sides.b.includes(other)) continue;
      const or = ruler(other);
      if(isPlayer(other)){
        queueEvent({ title:'A Call to Arms',
          text:`${fullName(ruler(rid))} of ${rl(rid).n} calls on your alliance: war has come between ${rl(att).n} and ${rl(def).n}, and your banners are asked for the ${side==='a'?'attack':'defence'}.`,
          choices:[
            {t:'Honor the alliance — we march.', fx:()=>{ w.sides[side].push(other); logIt('war',`${rl(other).n} joins the war.`); }},
            {t:'Refuse. (The alliance breaks; your word is cheapened)', fx:()=>{ breakAlliance(al.a,al.b); rl(other).prs-=25; addOp(or? ruler(rid):null, or?rl(other).ruler:null, 0); addOp(ruler(rid), rl(other).ruler, -40); }},
          ]});
      } else if(or && (opinion(or, ruler(rid)) > -10 || side==='b')){
        w.sides[side].push(other);
        logIt('war', `${rl(other).n} honors its alliance and joins the war.`);
      } else {
        breakAlliance(al.a, al.b);
        logIt('court', `${rl(other).n} finds reasons to stay home; the alliance lapses.`);
      }
    }
  }
  /* the Empire rallies to its Emperor's wars */
  if(G.empire && (isEmperor(att)||isEmperor(def))){
    const emp = isEmperor(att)?att:def, side = isEmperor(att)?'a':'b', foe = side==='a'?def:att;
    for(const m of G.empire.members){
      if(m===emp || !rl(m) || rl(m).dead || m===foe) continue;
      if(w.sides.a.includes(m)||w.sides.b.includes(m)) continue;
      if(truceBetween(m, foe)) continue;
      const mr = ruler(m); if(!mr) continue;
      if(isPlayer(m)){
        queueEvent({ title:'⚜ The Emperor Summons the Empire',
          text:`The Emperor calls the princes of the Empire to war against ${rl(foe).n}. As a member of the Empire, your banners are summoned to the ${side==='a'?'attack':'defence'}.`,
          choices:[
            {t:'Answer the summons — we march for the Empire.', fx:()=>{ w.sides[side].push(m); logIt('war',`${rl(m).n} answers the Imperial summons.`); }},
            {t:'Defy the Emperor. (−10 legitimacy; the Emperor’s wrath)', fx:()=>{ rl(m).leg=clamp(rl(m).leg-10,0,100); if(ruler(emp)) addOp(ruler(emp), rl(m).ruler, -30); }},
          ]});
      } else if(chance(.7)){ w.sides[side].push(m); logIt('war',`${rl(m).n} answers the Imperial summons.`); }
    }
  }
}
function raiseArmy(rid, provId){
  const own = realmProvs(rid).filter(p=>!pv(p).occ);
  let levies = 0;
  for(const p of own) levies += levyOf(p);
  levies = Math.floor(levies * (0.85 + councilBonus(rid,'marshal')*0.02));
  /* men already in the field cannot be raised twice */
  const fielded = G.armies.filter(a=>a.realm===rid).reduce((s,a)=>s+a.levies, 0);
  levies = Math.max(0, levies - fielded);
  if(levies < 50){
    if(isPlayer(rid)) toast('⚔ The levies are already in the field — the villages hold only greybeards and boys.');
    return false;
  }
  const existing = G.armies.find(a=>a.realm===rid && a.prov===provId);
  if(existing){ existing.levies += levies; existing.retinue += rl(rid).retinue; }
  else G.armies.push({ id:'a'+(++G.aid), realm:rid, prov:provId, levies, retinue:rl(rid).retinue,
    mercs:0, cmdr:bestCommander(rid), siege:0, moved:true });
  rl(rid).retinue = 0;
  logIt('war', `${rl(rid).n} musters ${fmtN(levies)} levies at ${PROVDATA[provId].n}.`);
  if(isPlayer(rid)) toast(`⚔ <b>${fmtN(levies)} levies</b> muster at ${esc(PROVDATA[provId].n)}`);
  return true;
}
function bestCommander(rid){
  const R_ = rl(rid);
  let best = R_.ruler, bv = skill(ruler(rid),'mar');
  const m = R_.council.marshal;
  if(m && alive(ch(m)) && skill(ch(m),'mar')>bv){ best = m; bv = skill(ch(m),'mar'); }
  return best;
}
function armySize(a){ return a.levies + a.retinue + a.mercs; }
function secondCommander(rid, excludeId){
  const cands = Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&!c.prison&&age(c)>=16&&c.id!==excludeId)
    .sort((a,b)=>skill(b,'mar')-skill(a,'mar'));
  return cands.length ? cands[0].id : excludeId;
}
function disbandArmy(a){

    const playerWon = wnA.realm===G.player || (w && w.sides[atkWins?'a':'b'].includes(G.player));
    const sideHtml = (army) => { const cm2 = ch(army.cmdr);
      return `<div class="side">${UI.medallion(cm2||ruler(army.realm), true)}
        <div class="btRealm">${esc(rl(army.realm).n)}</div>
        <div class="btCmdr">${cm2?esc(fullName(cm2)):'—'}</div></div>`; };
    const btHtml =
      `<div class="btShields">${sideHtml(atk)}<div class="btVs">⚔</div>${sideHtml(def)}</div>` +
      `<div class="btrow"><span>${fmtN(A.n)}</span><em>Men</em><span>${fmtN(D.n)}</span></div>` +
      `<div class="btrow"><span>+${A.cm*6}%</span><em>Commander</em><span>+${D.cm*6}%</span></div>` +
      `<div class="btrow"><span>${STANCES[stanceOf(atk)].ico} ${STANCES[stanceOf(atk)].n}</span><em>Stance</em><span>${STANCES[stanceOf(def)].ico} ${STANCES[stanceOf(def)].n}</span></div>` +
      `<div class="btrow"><span>×${A.tm}</span><em>${TERRAIN[PROVDATA[provId].t].n}</em><span>×${D.tm}</span></div>` +
      `<div class="btrow"><span>×${A.r.toFixed(2)}</span><em>Fortune</em><span>×${D.r.toFixed(2)}</span></div>` +
      `<div class="btrow strength"><span>${Math.round(A.str)}</span><em>Strength</em><span>${Math.round(D.str)}</span></div>` +
      `<div class="btOutcome ${playerWon?'win':'lose'}">${esc(rl(wnA.realm).n)} holds the field</div>` +

function warScore(w){

    const pr = pv(p);
    if(pr.occ && w.sides.b.includes(pr.r) && hostile(pr.occ, pr.r)) s += (p===rl(w.def).cap? 25:10);
    if(pr.occ && w.sides.a.includes(pr.r) && hostile(pr.occ, pr.r)) s -= (p===rl(w.att).cap? 25:10);
  }
  const defP = realmProvs(w.def), attP = realmProvs(w.att);
  if(defP.length && defP.every(p=>pv(p).occ && hostile(pv(p).occ, w.def))) return 100;
  if(attP.length && attP.every(p=>pv(p).occ && hostile(pv(p).occ, w.att))) return -100;

function endWar(w, result, msg){

  }

  if(w.sides.a.includes(G.player)||w.sides.b.includes(G.player))

function peaceAccept(w, giverSide, t){

  const sGiver = warScore(w) * (giverSide==='a'?1:-1);   /* the giver's own war score: + = winning */
  let acc = -sGiver;                                      /* the worse they are losing, the more they will concede */

  acc += Math.min(30, warAge(w)*2);                       /* both sides weary of a long war */

  const occ = gp.filter(p=>pv(p).occ && hostile(pv(p).occ, giver)).length;
  acc += occ*6 + (rl(giver).cap && pv(rl(giver).cap) && pv(rl(giver).cap).occ && hostile(pv(rl(giver).cap).occ, giver) ? 20 : 0);
  if(rl(giver).gold < 5) acc += 8;

function acceptLabel(m){

function termText(w, t){

function peaceTerms(w, takerSide){
  /* the terms `takerSide` could impose on the other primary belligerent */
  const taker = takerSide==='a'?w.att:w.def;
  const giver = takerSide==='a'?w.def:w.att;
  const giverArr = takerSide==='a'?w.sides.b:w.sides.a;
  const s = warScore(w) * (takerSide==='a'?1:-1);
  const out = [];
  out.push({kind:'tribute', gold:clamp(Math.round(15 + Math.max(0,s)*0.35), 8, 60), to:taker, from:giver});

function strongestAcceptable(w, takerSide){

  for(const t of peaceTerms(w, takerSide)){

function settleWar(w, t){

function realmFalls(rid, toRealm){

function warUpkeep(){

      const des = Math.floor(a.levies*.15);

function siegeTick(){

    if(enemiesIn(a.prov, a.realm).length) continue;
    if(pr.occ && !hostile(a.realm, pr.r)) continue;
    const castle = pr.bld==='castle' ? 1 : 0;
    a.siege += 30 + skill(ch(a.cmdr)||ruler(a.realm),'mar')*2 + ri(0,15) - castle*22 + focusSiege(a.realm);
    if(a.siege >= 100){
      pr.occ = a.realm; a.siege = 0;
      rl(a.realm).gold += Math.floor(pr.dev*1.5);
      logIt('war', `🔥 ${PROVDATA[a.prov].n} falls to ${rl(a.realm).n} after siege.`);

          text:`Every castle is taken, every shire under the enemy's law. Whatever you say in your hall, the realm itself has surrendered — the magnates treat with the invader over your head.`,
          choices:[{t:'So falls the house.', fx:()=>{}}]});
        enforceDemands(w, aiSide);
        continue;
      }
    } else w.doom = 0;
    /* the AI is losing — it offers you the most it will concede */
    if((playerA ? s>=45 : s<=-45) && !w.offered){
      w.offered = true;
      const t = strongestAcceptable(w, playerSide) || {kind:'white'};
      queueEvent({ title:'They Sue for Peace',
        text:`Envoys arrive from ${rl(aiRealm).n} under a white banner. The war goes against them, and they know it. They offer: <b>${termText(w,t)}</b>.`,
        choices:[
          {t:`Accept — ${termText(w,t)}.`, fx:()=>settleWar(w, t)},
          {t:'No. Grind them down. (the war goes on)', fx:()=>{ rl(G.player).leg=clamp(rl(G.player).leg-4,0,100); if(ruler(aiRealm)) addOp(ruler(aiRealm), rl(G.player).ruler, -15); }},
        ]});
    }
    /* the AI is winning — it demands the most you would rationally grant */
    if((playerA ? s<=-45 : s>=45) && !w.demanded){
      w.demanded = true;
      const t = strongestAcceptable(w, aiSide) || {kind:'tribute', gold:20, to:aiRealm, from:G.player};
      queueEvent({ title:'Terms, or the Sword',
        text:`Envoys from ${rl(aiRealm).n} bring hard words: yield <b>${termText(w,t)}</b> now, or they will take it over your corpse.`,
        choices:[
          {t:`Yield — ${termText(w,t)}.`, fx:()=>settleWar(w, t)},
          {t:'Never. We fight on.', fx:()=>{}},
        ]});
    }
  }
}

<script>
/* ============ Intrigue ============ */
function startPlot(plotterId, type, targetId, benefRealm){
  const p = { id:'p'+(++G.pid), plotter:plotterId, type, target:targetId, benef:benefRealm||ch(plotterId).realm,
    progress:0, backers:[], exposed:false };
  G.plots.push(p);
  return p;
}
function plotPower(p){
  const pl = ch(p.plotter);
  if(!alive(pl)) return 0;
  let pow = 10 + skill(pl,'int')*8;
  for(const b of p.backers){ const c=ch(b); if(alive(c)) pow += skill(c,'int')*4; }
  pow *= focusPlot(pl.realm);
  if(p.mine){ const vr=(p.type==='defection'||p.type==='fabricate')?(pv(p.target)?pv(p.target).r:null):(ch(p.target)?ch(p.target).realm:null);
    if(vr && vr===watchedRealm()) pow *= 1.3; }   /* your spymaster's eyes speed your own schemes there */
  return pow;
}
function plotTargetName(p){
  return (p.type==='defection'||p.type==='fabricate') ? PROVDATA[p.target].n : (ch(p.target)?fullName(ch(p.target)):'?');
}
function plotTick(){
  for(const p of [...G.plots]){
    const pl = ch(p.plotter);
    if(!alive(pl) || (p.type!=='defection' && p.type!=='fabricate' && !alive(ch(p.target)))){ G.plots = G.plots.filter(x=>x!==p); continue; }
    /* recruit backers */
    if(p.backers.length<3 && p.type!=='slander' && p.type!=='fabricate'){
      const tRealm = (p.type==='defection'||p.type==='fabricate') ? pv(p.target).r : ch(p.target).realm;
      const pool = Object.values(G.chars).filter(c=>alive(c)&&c.realm===tRealm&&c.id!==p.plotter&&!p.backers.includes(c.id)
        && (p.type==='defection' || opinion(c, ch(p.target)) < -15)
        && (c.tr.includes('ambitious')||c.tr.includes('deceitful')||c.tr.includes('greedy')));
      if(pool.length && chance(.35)) p.backers.push(pick(pool).id);
    }
    p.progress += plotPower(p)/8 + ri(0,6);
    /* discovery */
    const victimRealm = (p.type==='defection'||p.type==='fabricate') ? pv(p.target).r : ch(p.target).realm;
    if(victimRealm && rl(victimRealm) && !rl(victimRealm).dead){
      let spy = councilBonus(victimRealm,'spymaster') + focusGuard(victimRealm);
      if(victimRealm===G.player && pl.realm===watchedRealm()) spy += 10;   /* your planted eyes lay their schemes bare */
      const discP = .04 + spy*.022 - skill(pl,'int')*.012 + p.backers.length*.02;
      if(chance(Math.max(.02, discP))){
        plotDiscovered(p, victimRealm);
        continue;
      }
    }
    if(p.progress >= 100) resolvePlot(p);
  }
}
function plotDiscovered(p, victimRealm){
  G.plots = G.plots.filter(x=>x!==p);
  const pl = ch(p.plotter);
  if(p.mine && victimRealm!==G.player){
    /* player's own plot busted */
    rl(G.player).prs = Math.max(0, rl(G.player).prs-30);
    rl(G.player).leg = clamp(rl(G.player).leg-10,0,100);
    addOp(ruler(victimRealm), rl(G.player).ruler, -40);
    queueEvent({ title:'The Plot Is Blown',
      text:`Your scheme against ${plotTargetName(p)} has been dragged into daylight. ${rl(victimRealm).n} knows, the courts of Europe whisper, and your name is spat in two languages. <em>(-30 prestige, -10 legitimacy)</em>`,
      choices:[{t:'Deny everything.', fx:()=>{}}]});
    return;
  }
  if(isPlayer(victimRealm)){
    const inRealm = pl.realm===G.player;
    queueEvent({ who:pl.id, title:'A Plot Uncovered',
      text:`Your spymaster comes at a late hour. <b>${fullName(pl)}</b> has been plotting <b>${p.type==='murder'?'the murder of':'against'} ${plotTargetName(p)}</b>${p.backers.length?`, with ${p.backers.length} backer${p.backers.length>1?'s':''} in the shadows`:''}. The proofs are good.`,
      choices:[
        inRealm ? {t:'Arrest and imprison the wretch.', fx:()=>{ imprison(pl); }} : null,
        inRealm ? {t:'Execute them. Let the head speak to the others. (-legitimacy, fear)', fx:()=>{
            killChar(pl,'was beheaded for treason'); rl(G.player).leg=clamp(rl(G.player).leg-8,0,100);
            for(const c of Object.values(G.chars)) if(alive(c)&&c.realm===G.player) addOp(c, rl(G.player).ruler, -8);
            chron(`In this year ${fullName(pl)} was put to death for treason, and the court learned silence.`);
          }} : null,
        {t:'Confront them privately. (they stop — and hate you)', fx:()=>{ addOp(pl, rl(G.player).ruler, -25); }},
        {t:'Watch, and say nothing. (the plot continues, but you know its shape)', fx:()=>{ p.exposed=true; G.plots.push(p); }},
      ].filter(Boolean)});
    return;
  }
  /* AI victim reacts */
  if(pl.realm===victimRealm && chance(.6)){ killChar(pl,'was executed for treason'); }
  else { addOp(ruler(victimRealm), pl.id, -60); logIt('plot', `A plot by ${fullName(pl)} against ${plotTargetName(p)} is uncovered in ${rl(victimRealm).n}.`); }
}
function imprison(c){
  c.prison = true; c.seat = null; c.mandate = null;
  const R_ = rl(c.realm);
  for(const s of Object.keys(R_.council)) if(R_.council[s]===c.id) R_.council[s]=null;
  logIt('plot', `${fullName(c)} is thrown in the dungeon.`);
}
function resolvePlot(p){
  G.plots = G.plots.filter(x=>x!==p);
  const pl = ch(p.plotter);
  if(p.type==='murder'){
    const t = ch(p.target);
    const guard = t.realm && rl(t.realm) ? councilBonus(t.realm,'spymaster') + focusGuard(t.realm) : 3;
    if(ri(0,100) < 55 + skill(pl,'int')*4 - guard*4){
      const cause = pick(['died suddenly at table — poison, the cooks swear it was not','was found dead at the foot of a stair','died in the night without mark or wound, and men crossed themselves','was set upon by "robbers" who took nothing']);
      logIt('plot', `† ${fullName(t)} ${cause}.`);
      if(p.mine && Object.values(G.realms).some(r=>!r.dead && r.ruler===t.id)) ach('kingslayer');
      if(isPlayer(pl.realm)) chron(`In this year ${fullName(t)} died most conveniently. The chronicler makes no accusation. The chronicler merely notes the convenience.`);
      killChar(t, cause);
      if(isPlayer(pl.realm)) rl(G.player).prs += 10;
    } else {
      logIt('plot', `An attempt on ${fullName(t)}'s life fails; the knife-man dies silent.`);
      if(isPlayer(t.realm)) queueEvent({ title:'A Knife in the Dark',
        text:`A killer was taken last night inside the walls, steel in hand, ${fullName(t)}'s chamber a corridor away. He died under question without naming his master. Someone paid well for your family's blood.`,
        choices:[{t:'Double the guard. Trust no one.', fx:()=>{}}]});
    }
  }
  if(p.type==='slander'){
    const t = ch(p.target);
    const R_ = rl(t.realm);
    if(R_){ R_.leg = clamp(R_.leg-12,0,100); R_.prs = Math.max(0, R_.prs-25); }
    for(const c of Object.values(G.chars)) if(alive(c)&&chance(.4)) addOp(c, t.id, -12);
    logIt('plot', `Vile songs about ${fullName(t)} are sung in three ports. Mud sticks.`);
    if(isPlayer(t.realm)) queueEvent({ title:'Poison in Every Ear',
      text:`A slander runs through the courts of Europe faster than any ship: verses about ${fullName(t)} — obscene, specific, and well-rhymed. Half of it is invented. The other half is worse. <em>(-12 legitimacy, -25 prestige)</em>`,
      choices:[{t:'Find me the poet.', fx:()=>{}}]});
  }
  if(p.type==='fabricate'){
    const owner = pv(p.target).r;
    if(owner === p.benef) return;
    const claimant = ruler(p.benef);
    if(claimant && !claimant.pclaims.includes(p.target)){
      claimant.pclaims.push(p.target);
      if(isPlayer(p.benef)) ach('forger');
      logIt('plot', `Monks of flexible conscience "discover" a charter: ${PROVDATA[p.target].n} rightfully belongs to ${rl(p.benef).n}.`);
      if(isPlayer(p.benef)) chron(`In this year came to light an old charter proving our right to ${PROVDATA[p.target].n}. The ink was old. The ink was very old. No further questions were taken.`);
    }
    return;
  }
  if(p.type==='defection'){
    const prov = pv(p.target);
    const from = prov.r;
    if(from===p.benef || !rl(p.benef) || rl(p.benef).dead) return;
    transferProv(p.target, p.benef);
    logIt('plot', `${PROVDATA[p.target].n} renounces ${rl(from).n} and gives its castles to ${rl(p.benef).n}.`);
    if(isPlayer(from)) queueEvent({ title:'Betrayal at '+PROVDATA[p.target].n,
      text:`The garrison commander of ${PROVDATA[p.target].n} has opened his gates to ${rl(p.benef).n} — bought, flattered, and promised. The province is lost without a blow struck. <em>Reclaiming it will take a war.</em>`,
      choices:[{t:'His name goes in the book.', fx:()=>{}}]});
    if(isPlayer(p.benef)) chron(`In this year ${PROVDATA[p.target].n} came over to us by quiet arrangement, which is the cheapest kind of conquest and the least sung.`);
  }
  if(p.type==='depose'){
    const t = ch(p.target);
    const R_ = Object.values(G.realms).find(r=>!r.dead&&r.ruler===t.id);
    if(!R_) return;
    const pow = plotPower(p), hold = R_.leg + skill(t,'mar')*3 + councilBonus(R_.id,'marshal')*2;
    if(isPlayer(R_.id)){
      queueEvent({ title:'The Realm Rises',
        text:`It breaks all at once: ${fullName(pl)} and ${p.backers.length} great men declare you unfit to rule and call the realm to arms. Steel decides now.<div class="btMath">Their power: ${pow}\nYour hold on the realm: ${Math.round(hold)} (legitimacy ${R_.leg} + martial + marshal)</div>`,
        choices:[
          {t:'Crush them.', fx:()=>{
            if(hold + ri(0,40) > pow + ri(0,40)){
              killChar(pl, 'was cut down in open rebellion');
              R_.leg = clamp(R_.leg+10,0,100); R_.prs += 20;
              ach('unshaken');
              queueEvent({title:'The Rising Fails', text:'The rebels are broken at the gates and their leader dies badly. Men remember, now, why your family rules. <em>(+10 legitimacy, +20 prestige)</em>', choices:[{t:'Let it be written.', fx:()=>{}}]});
              chron(`In this year certain great men rose against the crown and were destroyed, and their lands taught their heirs humility.`);
            } else {
              const t2 = ch(R_.ruler);
              R_.leg = clamp(R_.leg-20,0,100);
              const h = heirOf(R_.id);
              if(h){ killChar(t2, 'was deposed and died soon after — of shame, they said'); }
              else gameOver(false, 'The rebels drag you from the hall. There is no heir to continue the line.');
            }
          }},
          {t:'Buy them off — gold, seats, pardons. (-40 gold, -15 legitimacy)', fx:()=>{
            R_.gold = Math.max(0,R_.gold-40); R_.leg = clamp(R_.leg-15,0,100); addOp(pl, R_.ruler, 20);
          }},
        ]});
    } else {
      if(pow > hold + ri(-20,20)){
        logIt('plot', `${fullName(t)} of ${R_.n} is deposed by ${fullName(pl)}'s faction.`);
        const h = heirOf(R_.id);
        killChar(t, 'was deposed and quietly strangled');
      } else {
        killChar(pl, 'rose in rebellion and was destroyed');
      }
    }
  }
}
/* AI plot seeding — the same rules for everyone, from turn one */
function aiPlots(){
  for(const c of Object.values(G.chars)){
    if(!alive(c) || c.prison || age(c)<16) continue;
    if(G.plots.some(p=>p.plotter===c.id)) continue;
    if(!(c.tr.includes('ambitious')||c.tr.includes('deceitful')||c.tr.includes('cruel'))) continue;
    if(!chance(.03 + skill(c,'int')*.004)) continue;
    const R_ = rl(c.realm); if(!R_ || R_.dead) continue;
    const rul = ruler(c.realm);
    /* claimants scheme for thrones; the spurned scheme for blood */
    if(c.claims.length && chance(.5)){
      const tgt = rl(c.claims[0]);
      if(tgt && !tgt.dead && ruler(tgt.id)){
        if(c.realm===tgt.id){ startPlot(c.id,'depose', tgt.ruler); logIt('plot', isPlayer(tgt.id)?'(Something stirs in the shadows of your court…)':''); }
        else if(chance(.5)) startPlot(c.id,'murder', tgt.ruler);
        continue;
      }
    }
    if(rul && c.id!==rul.id && opinion(c, rul) < -30){
      startPlot(c.id, chance(.6)?'murder':'slander', rul.id);
      continue;
    }
    /* border lords tempt neighbours */
    if(skill(c,'int')>=6 && chance(.3)){
      const targets = Object.keys(G.provinces).filter(p=>{
        const owner = pv(p).r;
        return owner && owner!==c.realm && !rl(owner).dead &&
          (PROVDATA[p].adj||[]).some(q=>pv(q).r===c.realm);
      });
      if(targets.length) startPlot(c.id, 'defection', pick(targets), c.realm);
    }
  }
}

{id:'brotherseat', w:6, cond:()=>{
    const sibs = Object.values(G.chars).filter(c=>alive(c)&&c.realm===G.player&&c.fa&&c.fa===PR().fa&&c.id!==PR().id&&c.sex==='m'&&age(c)>=16&&!c.seat);
    return sibs.length>0;
  }, run:()=>{
  const sib = pick(Object.values(G.chars).filter(c=>alive(c)&&c.realm===G.player&&c.fa&&c.fa===PR().fa&&c.id!==PR().id&&c.sex==='m'&&age(c)>=16&&!c.seat));
  return { who:sib.id, title:'Blood Asks Its Due',
  text:`Your brother ${fullName(sib)} requests — in the way family requests things, with teeth behind the smile — a seat on your council. His qualifications are: being your brother.`,
  choices:[
    {t:'Give him the Marshal’s seat.', fx:()=>{ const R_=PRL(); const old=R_.council.marshal; if(old&&ch(old)) { ch(old).seat=null; addOp(ch(old),PR().id,-20);} sib.seat='marshal'; R_.council.marshal=sib.id; addOp(sib,PR().id,35); }},
    {t:'Refuse. Merit rules here. (he will remember)', fx:()=>{ addOp(sib,PR().id,-30); }},
    {t:'Promise it "soon." (a smaller insult, repeated later)', fx:()=>{ addOp(sib,PR().id,-10); }},
  ]};}},
{id:'comeofage', w:99, cond:()=>myKids().some(k=>age(k)===16&&!k.educated), run:()=>{
  const k = myKids().find(x=>age(x)===16&&!x.educated);
  k.educated = 1;
  return { who:k.id, title:fullName(k)+' Comes of Age',
  text:`Sixteen years old, and done with tutors. What was drilled into ${k.sex==='m'?'him':'her'} hardest?`,
  choices:[
    {t:'The sword and the saddle. (+2 Martial)', fx:()=>{ k.sk.mar+=2; }},
    {t:'Letters, law, and charm. (+2 Diplomacy)', fx:()=>{ k.sk.dip+=2; }},
    {t:'Accounts and granaries. (+2 Stewardship)', fx:()=>{ k.sk.ste+=2; }},
    {t:'Locks, letters, and listening at doors. (+2 Intrigue)', fx:()=>{ k.sk.int+=2; }},
  ]};}},
{id:'hunt', w:5, cond:()=>G.season!==3, run:()=>({
  title:'The Great Hunt',
  text:`The forest is thick with boar and the nobles thick with boredom. A royal hunt would please them. Boars, however, have opinions.`,
  choices:[
    {t:'Ride to the kill yourself. (+10 prestige, nobles pleased, small risk)', fx:()=>{
      for(const c of myCourt()) addOp(c,PR().id,5);
      if(chance(.06)){ queueEvent({title:'The Boar Wins', text:'The beast turned at bay and opened your leg to the bone before the spears found it. The wound festers.', choices:[{t:'Endure.', fx:()=>{ if(chance(.35)) killChar(PR(),'died of a wound taken hunting'); }}]}); }
      else PRL().prs+=10; }},
    {t:'Stay home with the ledgers. (+4 gold, nobles sneer)', fx:()=>{ PRL().gold+=4; for(const c of myCourt()) addOp(c,PR().id,-3); }},
  ]})},
{id:'revolt', w:12, cond:()=>PRL().leg<40, run:()=>{
  const p = pick(realmProvs(G.player));
  return { title:'The Commons Rise at '+PROVDATA[p].n,
  text:`Taxes, hunger, and a preacher with strong lungs: ${PROVDATA[p].n} is in open revolt. They have pitchforks and, worryingly, a few real soldiers who remember being unpaid. <em>(Low legitimacy breeds this.)</em>`,
  choices:[
    {t:'Put it down in blood. (+order, -legitimacy, province damaged)', fx:()=>{ pv(p).dev=Math.max(1,pv(p).dev-1); PRL().leg=clamp(PRL().leg-5,0,100); chron(`In this year the commons of ${PROVDATA[p].n} rose and were cut down, and the field where they stood is called the Red Furlong.`); }},
    {t:'Hear their grievances and hang only the preacher. (-10 gold, +8 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-10); PRL().leg=clamp(PRL().leg+8,0,100); }},
  ]};}},
{id:'aioffer', w:6, trig:['envoy','gift'], cond:()=>{
    return marriageCandidates(G.player).length>0 &&
      Object.values(G.realms).some(r=>!r.dead&&r.id!==G.player&&marriageCandidates(r.id).length&&!allianceBetween(r.id,G.player));
  }, run:()=>{
  const suitors = Object.values(G.realms).filter(r=>!r.dead&&r.id!==G.player&&r.rel===PRL().rel&&marriageCandidates(r.id).length&&!allianceBetween(r.id,G.player));
  const R_ = pick(suitors);
  const theirs = pick(marriageCandidates(R_.id));
  const mine = pick(marriageCandidates(G.player).filter(c=>c.sex!==theirs.sex)) || null;
  if(!mine) return { title:'An Envoy, Wasted', text:'An envoy came seeking a marriage, but your house has no one of age to wed. He eats a great deal and leaves.', choices:[{t:'Feed him and forget him.', fx:()=>{}}]};
  return { title:'An Offer of Marriage',
  text:`An envoy from ${R_.n} proposes a match: their ${theirs.sex==='f'?'lady':'lord'} <b>${fullName(theirs)}</b> (${age(theirs)}, ${theirs.tr.map(cap).join(', ')}) to your <b>${fullName(mine)}</b> (${age(mine)}). With it: alliance, and their spears at your side.`,
  choices:[
    {t:'Accept. Bind the houses.', fx:()=>{ doMarriage(mine, theirs); }},
    {t:'Decline, with honeyed words. (small slight)', fx:()=>{ addOp(ruler(R_.id), PR().id, -8); }},
  ]};}},
{id:'pilgrim', w:4, trig:['rome'], cond:()=>PR().tr.includes('pious')&&PRL().rel!=='pagan', run:()=>({
  title:'The Road to Rome',
  text:`Your confessor suggests — for the third time — a pilgrimage. Your soul, he implies, could use the exercise.`,
  choices:[
    {t:'Go. (+12 legitimacy, +10 prestige, the realm minds itself a season)', fx:()=>{ PRL().leg=clamp(PRL().leg+12,0,100); PRL().prs+=10; chron('In this year the king went to Rome a pilgrim and returned lighter of purse and heavier of virtue.'); }},
    {t:'The realm cannot spare me. (confessor sighs)', fx:()=>{}},
  ]})},
{id:'tourney', w:5, trig:['muster'], cond:()=>G.season===1&&PRL().gold>=15, run:()=>({
  title:'A Tournament Proposed',
  text:`Your marshal proposes a grand tournament: lances, wagers, and the flower of chivalry drinking your cellars dry.`,
  choices:[
    {t:'Hold it. (-15 gold, +20 prestige, court pleased)', fx:()=>{ PRL().gold-=15; PRL().prs+=20; for(const c of myCourt()) addOp(c,PR().id,6); }},
    {t:'A vain expense. (nothing happens, cheaply)', fx:()=>{}},
  ]})},
{id:'illness', w:99, cond:()=>age(PR())>55&&!G.flags['ill'+PR().id]&&chance(.18), run:()=>{
  G.flags['ill'+PR().id]=1;
  return { who:PR().id, title:'The King Coughs Blood',
  text:`It began as a winter chill. It is not a chill. The physicians confer in Latin, which is never good.`,
  choices:[
    {t:'Submit to the physicians. (bleeding, poultices, a coin flip)', fx:()=>{ if(chance(.4)) killChar(PR(),'died under the care of his physicians, which surprised no one'); else { queueEvent({title:'Recovery', text:'Against all medical intervention, you live.', choices:[{t:'Providence.', fx:()=>{}}]}); } }},
    {t:'Prayer, broth, and stubbornness.', fx:()=>{ if(chance(.28)) killChar(PR(),'died of a long illness'); }},
  ]};}},
{id:'witch', w:3, cond:()=>true, run:()=>({
  title:'Whispers of Witchcraft',
  text:`A village midwife stands accused: a dead cow, a strange birth, a neighbor's grudge. Your chaplain wants a burning. Your steward notes she is the only midwife for twenty miles.`,
  choices:[
    {t:'Burn her. (clergy pleased: +5 legitimacy; the village remembers)', fx:()=>{ PRL().leg=clamp(PRL().leg+5,0,100); }},
    {t:'An ordeal of water, rigged to acquit. (+5 prestige, chaplain suspicious)', fx:()=>{ PRL().prs+=5; }},
  ]})},
{id:'monastery', w:4, trig:['rome'], cond:()=>PRL().gold>=20, run:()=>({
  title:'The Abbot’s Ledger',
  text:`The abbot of a great house comes with plans for a new choir, drawn beautifully, priced outrageously. He mentions, in passing, who writes the chronicles.`,
  choices:[
    {t:'Endow it. (-20 gold, +10 legitimacy, +10 prestige)', fx:()=>{ PRL().gold-=20; PRL().leg=clamp(PRL().leg+10,0,100); PRL().prs+=10; chron('In this year the king endowed our house most generously, being wise, just, handsome, and much maligned by lesser chroniclers.'); }},
    {t:'Send him home with a blessing. (chronicles grow colder)', fx:()=>{ PRL().leg=clamp(PRL().leg-3,0,100); }},
  ]})},
{id:'windfall', w:5, trig:['build','develop'], cond:()=>realmProvs(G.player).some(p=>pv(p).bld==='market'), run:()=>({
  title:'A Fat Convoy',
  text:`Wool out, wine in, and the tolls collected on both. Your market towns have had a golden season. <em>(+12 gold)</em>`,
  choices:[{t:'The best sound in the world is other men’s money arriving.', fx:()=>{ PRL().gold+=12; }}]})},
{id:'fire', w:3, cond:()=>true, run:()=>{
  const p = PRL().cap;
  return { title:'Fire in '+PROVDATA[p].n,
  text:`It started in a baker's yard and ate three streets before the rain came. The town asks for timber and tax relief.`,
  choices:[
    {t:'Rebuild at your cost. (-14 gold, +6 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-14); PRL().leg=clamp(PRL().leg+6,0,100); }},
    {t:'Towns burn; towns rebuild. (-1 development)', fx:()=>{ pv(p).dev=Math.max(1,pv(p).dev-1); }},
  ]};}},
{id:'dream', w:3, cond:()=>true, run:()=>({
  title:'The King’s Dream',
  text:`You dream of a white ship sinking in calm water, and wake certain it meant something. Your chaplain and your spymaster offer competing interpretations, each implicating the other.`,
  choices:[
    {t:'Heed the chaplain: give alms. (-5 gold, +4 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-5); PRL().leg=clamp(PRL().leg+4,0,100); }},
    {t:'Heed the spymaster: double the watch. (plots against you slowed)', fx:()=>{ for(const p of G.plots){ if(ch(p.target)&&ch(p.target).realm===G.player) p.progress=Math.max(0,p.progress-30); } }},
    {t:'It was the eels at dinner.', fx:()=>{}},
  ]})},
{id:'bastard', w:6, cond:()=>PR().tr.includes('lustful')&&PR().sex==='m', run:()=>({
  title:'A Cradle at the Gate',
  text:`A woman of the town presents an infant with — there is no diplomatic way to say this — your exact nose. The court studies the tapestries intently.`,
  choices:[
    {t:'Acknowledge the child. (-10 legitimacy, the queen’s cold fury, +a dynast someday)', fx:()=>{
      PRL().leg=clamp(PRL().leg-10,0,100);
      const sx = chance(.5)?'m':'f';
      const k = mkChar({nm:pick(NAMES[rl(G.player).cult][sx]), dyn:PR().dyn, realm:G.player, cult:PR().cult, sex:sx, by:G.year, fa:PR().id, tr:randTraits(2), sk:{dip:ri(1,5),mar:ri(1,5),int:ri(1,5),ste:ri(1,5)}});
      if(PR().sp) addOp(ch(PR().sp), PR().id, -30);
      logIt('court', `The ${PR().sex==='m'?'king':'queen'} acknowledges a bastard, ${k.nm}.`); }},
    {t:'Provide for them quietly, deny everything. (-5 gold)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-5); }},
  ]})},
{id:'quarrel', w:5, cond:()=>{ const R_=PRL(); return R_.council.marshal&&R_.council.steward; }, run:()=>{
  const m = ch(PRL().council.marshal), s = ch(PRL().council.steward);
  if(!m||!s) return {title:'A Quiet Season', text:'Nothing of note occurs, which your chronicler resents professionally.', choices:[{t:'Good.', fx:()=>{}}]};
  return { title:'Daggers at the Council Table',
  text:`${fullName(m)} (Marshal) and ${fullName(s)} (Steward) have moved from disagreement to open feud — over budgets, over precedence, over an inheritance from before you were born. The council is choosing sides.`,
  choices:[
    {t:'Back the Marshal.', fx:()=>{ addOp(m,PR().id,15); addOp(s,PR().id,-20); }},
    {t:'Back the Steward.', fx:()=>{ addOp(s,PR().id,15); addOp(m,PR().id,-20); }},
    {t:'Bang the table: serve or go. (both cowed, both sour)', fx:()=>{ addOp(m,PR().id,-8); addOp(s,PR().id,-8); PRL().prs+=5; }},
  ]};}},
{id:'relic', w:3, trig:['rome'], cond:()=>PRL().gold>=25, run:()=>({
  title:'A Relic for Sale',
  text:`A monk of doubtful provenance offers the finger-bone of a saint of impeccable provenance. Such a relic would dignify your chapel — and its owner.`,
  choices:[
    {t:'Buy it. (-25 gold, +12 legitimacy, +8 prestige)', fx:()=>{ PRL().gold-=25; PRL().leg=clamp(PRL().leg+12,0,100); PRL().prs+=8; }},
    {t:'Count his fingers and send him off.', fx:()=>{}},
  ]})},
{id:'mercs', w:8, trig:['muster','war','retinue'], cond:()=>atWar(G.player).length>0&&PRL().gold>=15, run:()=>({
  title:'Swords for Hire',
  text:`A free company — Flemish, mostly, with some men too disreputable to be Flemish — offers its services cheap. Their captain has honest eyes, which in a mercenary is itself dishonest.`,
  choices:[
    {t:'Hire them. (-15 gold, +600 men to your largest host)', fx:()=>{ PRL().gold-=15;
      const a = G.armies.filter(x=>x.realm===G.player).sort((x,y)=>armySize(y)-armySize(x))[0];
      if(a) a.mercs+=600; else G.armies.push({id:'a'+(++G.aid), realm:G.player, prov:PRL().cap, levies:0, retinue:0, mercs:600, cmdr:bestCommander(G.player), siege:0, moved:false}); }},
    {t:'War is expensive enough already.', fx:()=>{}},
  ]})},
{id:'oldwarrior', w:3, trig:['muster','retinue'], cond:()=>true, run:()=>{
  const c = mkCourtier(G.player); c.sk.mar = ri(6,9); c.tr = ['brave', pick(['honest','wrathful','content'])];
  return { title:'A Grey Wolf at the Door',
  text:`${fullName(c)}, a scarred veteran of three kings' wars, offers his sword and his experience to your house. He asks only bread, beer, and someone worth dying for.`,
  choices:[{t:'Welcome him. (a skilled commander joins your court)', fx:()=>{}}]};}},
{id:'suitor', w:5, trig:['feast','court'], cond:()=>myKids().some(k=>k.sex==='f'&&age(k)>=16&&!k.sp), run:()=>{
  const d = myKids().find(k=>k.sex==='f'&&age(k)>=16&&!k.sp);
  return { who:d.id, title:'A Suitor for '+d.nm,
  text:`A wealthy local magnate asks for your daughter ${fullName(d)}'s hand. No crown, no alliance — but gold, gratitude, and a friend inside your own nobility.`,
  choices:[
    {t:'Grant it. (+15 gold, nobles pleased)', fx:()=>{ const husband = mkCourtier(G.player); husband.by = G.year - ri(20,35); wed(d.id, husband.id); PRL().gold+=15; for(const c of myCourt()) addOp(c,PR().id,4); }},
    {t:'She is meant for a crown, not a coffer. (keep her for a royal match)', fx:()=>{}},
  ]};}},
{id:'taxes', w:5, trig:['harvest','develop'], cond:()=>true, run:()=>({
  title:'The Geld Grumbles',
  text:`Your steward proposes squeezing the geld harder. The nobles propose, through gritted teeth, that you not.`,
  choices:[
    {t:'Squeeze. (+15 gold, court opinion falls, -5 legitimacy)', fx:()=>{ PRL().gold+=15; PRL().leg=clamp(PRL().leg-5,0,100); for(const c of myCourt()) addOp(c,PR().id,-6); }},
    {t:'Hold the line. (+3 legitimacy)', fx:()=>{ PRL().leg=clamp(PRL().leg+3,0,100); }},
  ]})},
{id:'childfever', w:99, cond:()=>myKids().some(k=>age(k)<10)&&chance(.07), run:()=>{
  const k = pick(myKids().filter(x=>age(x)<10));
  return { who:k.id, title:'Fever in the Nursery',
  text:`Little ${k.nm} burns with fever, ${age(k)} years old and fighting. The physician speaks of humors. The nurse speaks of saints. You would trade provinces.`,
  choices:[
    {t:'The physician — bleed the fever out.', fx:()=>{ if(chance(.3)) killChar(k,'died of a fever, despite the physicians'); }},
    {t:'The saint’s shrine — carry the child there yourself. (-5 gold)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-5); if(chance(.22)) killChar(k,'died of a fever on the pilgrim road'); else PRL().leg=clamp(PRL().leg+2,0,100); }},
  ]};}},
{id:'eagle', w:2, trig:['muster','retinue'], cond:()=>true, run:()=>({
  title:'The Eagle on the Standard',
  text:`During the muster, an eagle settled on your standard and would not be shooed. The men are calling it an omen. The eagle is calling it a comfortable perch.`,
  choices:[{t:'An omen it is, then. (+8 prestige)', fx:()=>{ PRL().prs+=8; }}]})},
{id:'winterwolves', w:5, cond:()=>G.season===3, run:()=>({
  title:'Wolf Winter',
  text:`The hardest winter in memory. Wolves have been seen inside the churchyards, and the roads are white graves.`,
  choices:[
    {t:'Open the storehouses. (-10 gold, +6 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-10); PRL().leg=clamp(PRL().leg+6,0,100); }},
    {t:'Winter cannot be legislated. (some of the weak do not see spring)', fx:()=>{ PRL().leg=clamp(PRL().leg-4,0,100); }},
  ]})},
{id:'spynetwork', w:4, trig:['plotMurder','plotSlander','fabricate'], cond:()=>PRL().council.spymaster&&PRL().gold>=10, run:()=>({
  title:'The Spymaster’s Price',
  text:`Your spymaster requests funds for "friends" in foreign courts — servants, clerks, a bishop's laundress. Information, like fish, is freshest when paid for.`,
  choices:[
    {t:'Fund the network. (-10 gold, plots against you easier to catch)', fx:()=>{ PRL().gold-=10; G.flags.spyBoost = (G.flags.spyBoost||0)+2; }},
    {t:'He can listen at doors for free.', fx:()=>{}},
  ]})},
{id:'oath', w:4, trig:['imprison','execute'], cond:()=>myCourt().some(c=>opinion(c,PR())<-30&&!c.prison), run:()=>{
  const c = myCourt().find(x=>opinion(x,PR())<-30&&!x.prison);
  return { who:c.id, title:'A Cold Bow from '+c.nm,
  text:`${fullName(c)} barely bends the knee at court these days, and men notice such arithmetic. (Opinion of you: ${opinion(c,PR())})`,
  choices:[
    {t:'Win them back with a gift. (-8 gold, +20 opinion)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-8); addOp(c,PR().id,20); }},
    {t:'Let them sulk. Watch them, though.', fx:()=>{}},
  ]};}},
{id:'investiture', w:4, trig:['rome'], cond:()=>PRL().rel==='catholic'&&G.year>=1070&&PRL().leg<65&&!PRL().excomm, run:()=>({
  title:'The Investiture Question',
  text:`A legate arrives with soft hands and hard parchment: who names your bishops — you, or Rome? Your grandfather named them. The reformed Papacy has opinions about your grandfather.`,
  choices:[
    {t:'Yield the investiture to Rome. (+10 legitimacy, -15 prestige)', fx:()=>{ PRL().leg=clamp(PRL().leg+10,0,100); PRL().prs=Math.max(0,PRL().prs-15); }},
    {t:'My bishops, my ring, my crozier. (+10 prestige, -8 legitimacy, Rome remembers)', fx:()=>{ PRL().prs+=10; PRL().leg=clamp(PRL().leg-8,0,100); }},
  ]})},
{id:'varangian', w:5, cond:()=>G.player==='byzantium'&&PRL().gold>=20, run:()=>({
  title:'Axes from the North',
  text:`A shipload of Northmen stands in the Great Palace courtyard, huge and polite, asking to join the Varangian Guard. They are expensive, loyal to the paymaster, and famously indifferent to palace politics — which is precisely the point.`,
  choices:[
    {t:'Enroll them. (-20 gold, +300 retinue)', fx:()=>{ PRL().gold-=20; PRL().retinue=Math.min(900,PRL().retinue+300); }},
    {t:'The treasury groans already.', fx:()=>{}},
  ]})},
{id:'elcid', w:99, once:1, cond:()=>G.scen==='y1066'&&G.player==='castile'&&alive(ch('elcid'))&&G.year>=1068, run:()=>({
  who:'elcid', title:'The Campeador Quarrels',
  text:`Rodrigo de Vivar — your best sword and everyone's favorite hero — has feuded with your courtiers once too often. They demand his exile. The soldiers demand his pardon. He himself says nothing, which is somehow worse.`,
  choices:[
    {t:'Pardon him; he is worth ten courtiers. (court -8 opinion)', fx:()=>{ for(const c of myCourt()) addOp(c, PR().id, -8); addOp(ch('elcid'), PR().id, 30); }},
    {t:'Exile him. (he takes service with al-Andalus — as history did)', fx:()=>{ const e=ch('elcid'); e.realm='andalus'; e.seat=null; logIt('court','El Cid rides south to sell his sword in al-Andalus.'); chron('In this year the Campeador was exiled and the infidel gained the best lance in Iberia. The chronicler offers no comment loud enough to be quoted.'); }},
  ]})},
{id:'domesday', w:99, once:1, cond:()=>!!G.flags.conqueredOnce, run:()=>({
  title:'The Great Survey',
  text:`Conquered land is only wealth if you know what it holds. Your clerks propose a survey so thorough the peasants will call it doomsday: every hide, every ox, every eel-pond, written down forever.`,
  choices:[
    {t:'Send the clerks. (+20 gold, +8 legitimacy, your subjects shudder)', fx:()=>{ PRL().gold+=20; PRL().leg=clamp(PRL().leg+8,0,100); for(const c of myCourt()) addOp(c,PR().id,-4); chron('In this year the king caused all the land to be written in a great book, and there was no hide of land unrecorded, which men thought shameful and efficient.'); }},
    {t:'Rule by custom, not by ledger.', fx:()=>{}},
  ]})},
{id:'silkroad', w:5, trig:['develop','build'], cond:()=>['byzantium','venice','sicily'].includes(G.player), run:()=>({
  title:'The Eastern Convoy',
  text:`Silk, pepper, alum and dyes — a rich convoy has paid its customs in your ports, and the customs were not modest. <em>(+14 gold)</em>`,
  choices:[{t:'The wealth of two worlds flows through us.', fx:()=>{ PRL().gold+=14; }}]})},
{id:'university', w:99, once:1, cond:()=>G.year>=1150&&realmProvs(G.player).some(p=>pv(p).dev>=4)&&PRL().gold>=25, run:()=>({
  title:'The Masters Petition',
  text:`Scholars gathering in your richest town want a charter: a universitas, with rights, robes, and freedom from the town watch. Towns hate students. Kings who charter them are remembered for centuries.`,
  choices:[
    {t:'Grant the charter. (-25 gold, +25 prestige)', fx:()=>{ PRL().gold-=25; PRL().prs+=25; chron('In this year the king chartered a university, and the town got riots and eternity got doctors of law.'); }},
    {t:'Learning breeds lawyers. Refuse.', fx:()=>{}},
  ]})},
{id:'jubilee', w:99, cond:()=>G.year - G.reignStart === 25 && !G.flags['jub'+PR().id], run:()=>{
  G.flags['jub'+PR().id]=1;
  return { who:PR().id, title:'The Silver Jubilee',
  text:`Twenty-five years on the throne. Most of your enemies from the coronation are dead, which is the truest kind of victory. The realm expects a celebration; the chronicle expects a paragraph.`,
  choices:[
    {t:'A jubilee for the ages. (-15 gold, +12 legitimacy, +15 prestige, the realm rallies)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-15); PRL().leg=clamp(PRL().leg+12,0,100); PRL().prs+=15; grantOrders(1, 8, 'A jubilant realm rallies to your will'); chron('In this year the crown marked twenty-five years, and the realm drank to a reign grown old enough to be called an age.'); }},
    {t:'A quiet mass and back to work. (+5 legitimacy)', fx:()=>{ PRL().leg=clamp(PRL().leg+5,0,100); }},
  ]};}},
{id:'greatcouncil', w:5, trig:['court'], cond:()=>!G.regency, run:()=>({
  title:'The Great Council Assembles',
  text:`Your magnates, bishops and captains ride in from every corner of the realm. With the great men of the land gathered at your side, far more can be set in motion for a season than a lone court could dream.`,
  choices:[
    {t:'Put them to work. (−6 gold; +2 orders through the coming year)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-6); grantOrders(2, 4, 'The great council lends its hands'); }},
    {t:'Hear their grievances and send them home. (+6 legitimacy)', fx:()=>{ PRL().leg=clamp(PRL().leg+6,0,100); }},
  ]})},
{id:'relictheft', w:3, cond:()=>realmProvs(G.player).some(p=>pv(p).bld==='cathedral'), run:()=>({
  title:'The Empty Reliquary',
  text:`The sacristan opened the reliquary at matins and found velvet, dust, and absence. The saint is gone. Pilgrim revenue is following.`,
  choices:[
    {t:'Set the spymaster on it. (recovered on a good 🗡 roll: +8 legitimacy)', fx:()=>{
      if(ri(0,10) < 4 + councilBonus(G.player,'spymaster')){ PRL().leg=clamp(PRL().leg+8,0,100); toast('✟ The relic is recovered — +8 legitimacy'); }
      else toast('The trail goes cold in a port town.'); }},
    {t:'Quietly substitute a new bone. God will understand. (-4 legitimacy if it ever surfaces)', fx:()=>{ if(chance(.3)) PRL().leg=clamp(PRL().leg-4,0,100); }},
  ]})},
{id:'scholar', w:3, trig:['court','feast'], cond:()=>PRL().gold>=8, run:()=>({
  title:'A Scholar at the Gate',
  text:`A wandering master — Bologna, Toledo, Constantinople, the man has eaten in every famous kitchen of learning — offers a season of instruction for bed and board.`,
  choices:[
    {t:'Rhetoric and statecraft. (-8 gold, +1 Diplomacy for your ruler)', fx:()=>{ PRL().gold-=8; PR().sk.dip=Math.min(10,PR().sk.dip+1); }},
    {t:'Letters and ciphers. (-8 gold, +1 Intrigue)', fx:()=>{ PRL().gold-=8; PR().sk.int=Math.min(10,PR().sk.int+1); }},
    {t:'We have priests for reading.', fx:()=>{}},
  ]})},
{id:'assassin', w:4, trig:['war'], cond:()=>atWar(G.player).length>0&&PRL().gold>=15, run:()=>{
  const w = atWar(G.player)[0];
  const foe = w.sides.a.includes(G.player) ? w.def : w.att;
  const t = ruler(foe);
  if(!t) return null;
  return { title:'A Man of Discreet Talents',
  text:`He came with the wool merchants and will leave with them. His references are excellent and unverifiable. For a consideration, he suggests, the war with ${esc(rl(foe).n)} could lose its head.`,
  choices:[
    {t:`Pay him. (-15 gold, a murder plot begins against ${esc(fullName(t))})`, fx:()=>{ PRL().gold-=15; const p=startPlot(PR().id,'murder',t.id); p.mine=true; p.progress=25; }},
    {t:'Kings do not deal with such men. (openly.)', fx:()=>{}},
  ]};}},
{id:'bogomils', w:3, cond:()=>PRL().rel==='orthodox', run:()=>({
  title:'The Bogomil Preachers',
  text:`They preach that the visible world is the devil's work — which flatters no one who runs any of it. The bishops demand fire; the villages shelter the preachers; the tax rolls thin either way.`,
  choices:[
    {t:'Persecute the heresy. (+8 legitimacy, court -5 opinion)', fx:()=>{ PRL().leg=clamp(PRL().leg+8,0,100); for(const c of myCourt()) addOp(c,PR().id,-5); }},
    {t:'Souls are the Church’s problem; taxes are mine. (-6 legitimacy)', fx:()=>{ PRL().leg=clamp(PRL().leg-6,0,100); }},
  ]})},
{id:'saladintithe', w:99, once:1, cond:()=>G.scen==='y1187'&&PRL().rel==='catholic'&&G.year>=1188, run:()=>({
  title:'The Saladin Tithe',
  text:`Every Catholic crown is asked a tenth of movables for the recovery of Jerusalem. Collectors are already counting other people's silver on your roads.`,
  choices:[
    {t:'Pay the tithe. (-15 gold, +8 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-15); PRL().leg=clamp(PRL().leg+8,0,100); }},
    {t:'Jerusalem is far and my roof leaks. (-6 legitimacy)', fx:()=>{ PRL().leg=clamp(PRL().leg-6,0,100); }},
  ]})},
{id:'minstrels', w:4, trig:['feast','crowncourt'], cond:()=>PRL().gold>=6, run:()=>({
  title:'A Troupe at the Gate',
  text:`Jongleurs, a lute, a girl who swallows fire, and a man who claims to know three hundred songs and forgets the middles of most. Winter is long.`,
  choices:[
    {t:'Let them winter here. (-6 gold, court +5 opinion)', fx:()=>{ PRL().gold-=6; for(const c of myCourt()) addOp(c,PR().id,5); }},
    {t:'Songs do not garrison castles.', fx:()=>{}},
  ]})},
{id:'towercollapse', w:2, cond:()=>realmProvs(G.player).some(p=>pv(p).bld==='castle'), run:()=>{
  const p = realmProvs(G.player).find(x=>pv(x).bld==='castle');
  return { title:'The Tower Cracks at '+PROVDATA[p].n,
  text:`The master mason stands very far from the keep while explaining that the foundations were, in the previous administration, economized.`,
  choices:[
    {t:'Rebuild properly. (-15 gold)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-15); }},
    {t:'It has stood this long. (the castle may fall on its own)', fx:()=>{ if(chance(.35)){ pv(p).bld=null; toast(`♜ The keep at ${esc(PROVDATA[p].n)} collapses in the next storm.`); } }},
  ]};}},
{id:'greatmort', w:2, once:1, cond:()=>G.year > (G.endYear-92) && !G.plague, run:()=>({
  title:'The Great Mortality',
  text:`<span class="dropcap">It came off a ship, they say — or out of a grave, or on the wind. Whole villages sicken between one market day and the next. The physicians blame the air. The priests blame the sins. The dead, who now outnumber both professions' successes, say nothing.</span><br><br><em>For the next two years: income falls, death stalks every character, and provinces wither. It spares no realm and no rank.</em>`,
  choices:[
    {t:'Shut the court away in the countryside. (your family safer; the towns despair, -8 legitimacy)', fx:()=>{ G.plague=7; PRL().leg=clamp(PRL().leg-8,0,100); G.flags.plagueRefuge=1;
      chron('In this year came the great pestilence, and the court fled to clean air, and the towns remembered who fled.'); }},
    {t:'Stay. Organize burials, quarantines, grain. (+10 legitimacy, your kin share the risk)', fx:()=>{ G.plague=7; PRL().leg=clamp(PRL().leg+10,0,100);
      chron('In this year came the great pestilence, and the crown did not flee, which the living never forgot.'); }},
  ]})},
{id:'manzikert', w:99, once:1, cond:()=>G.scen==='y1066'&&G.year===1071&&rl('byzantium')&&!rl('byzantium').dead&&pv('armeniakon').r==='byzantium', run:()=>{
  const S = rl('seljuk');
  S.dead = 0; S.gold = 60; S.leg = 70; S.prs = 120; S.retinue = 1200;
  const alp = mkChar({ id:'alparslan', nm:'Alp Arslan', dyn:'Seljuk', realm:'seljuk', cult:'turkic', sex:'m', by:1029,
    tr:['brave','genius','wrathful'], sk:{dip:5,mar:10,int:5,ste:5} });
  S.ruler = 'alparslan';
  for(let i=0;i<3;i++) mkCourtier('seljuk');
  transferProv('armeniakon', 'seljuk');
  if(pv('cappadocia').r==='byzantium') transferProv('cappadocia', 'seljuk');
  aiFillCouncil('seljuk');
  declareWar('seljuk', 'byzantium', {type:'province', target:'paphlagonia'}, 'alparslan');
  chron('In this year the Sultan Alp Arslan broke the armies of the East at Manzikert, and the Turks came into Anatolia, and the world east of the sea was never the same again.');
  return { who:'alparslan', title:'Manzikert',
    text:`<span class="dropcap">Word runs west like a crack through ice: the Sultan Alp Arslan has annihilated the eastern armies at Manzikert. Anatolia lies open, and Turkish horsemen ride where the Romans taxed. ${isPlayer('byzantium')?'Your eastern themes are lost — and the war has only begun.':'Byzantium reels. Every ambitious neighbour recalculates.'}</span>`,
    choices:[{t: isPlayer('byzantium')?'The Empire has survived worse. It must.':'God weighs empires too.', fx:()=>{}}]};
}},
{id:'jerusalem', w:99, once:1, cond:()=>G.scen==='y1187'&&G.year===1187&&G.season>=1&&PRL().rel==='catholic', run:()=>({
  title:'Jerusalem Has Fallen',
  text:`<span class="dropcap">The news crosses Europe like a crack through glass: Saladin has destroyed the crusader army at Hattin and taken the Holy City itself. The True Cross is captured. The Pope, they say, died of the grief. Every court in Christendom now asks its ruler one question: <em>will you take the cross?</em></span>`,
  choices:[
    {t:'Take the cross. Lead a crusade east. (-30 gold now; return in two years with glory — or not at all)', fx:()=>{
      if(PRL().gold>=30){ PRL().gold-=30; PRL().prs+=25; PRL().leg=clamp(PRL().leg+10,0,100); G.flags.crusadeReturn=G.year+2;
        chron(`In this year the ${PR().sex==='m'?'king':'queen'} took the cross at the altar, and the court wept, variously.`); }
      else { PRL().leg=clamp(PRL().leg-5,0,100); }
    }},
    {t:'Send gold and knights, but stay. (-20 gold, +8 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-20); PRL().leg=clamp(PRL().leg+8,0,100); }},
    {t:'The Holy Land is far; my enemies are near. (-6 legitimacy, clergy seethe)', fx:()=>{ PRL().leg=clamp(PRL().leg-6,0,100); }},
  ]})},
{id:'devilsbrood', w:99, once:1, cond:()=>G.scen==='y1187'&&isPlayer('england')&&G.year>=1188&&PRL().ruler==='henry2'&&alive(ch('richard')), run:()=>({
  who:'richard', title:'Richard Demands the Succession',
  text:`<span class="dropcap">Your son Richard stands before the court in mail, not silk, and demands to be named heir to everything — England, Normandy, all of it — publicly, now, before witnesses. Behind his shoulder, invisible but present, stands Philip of France, who has been so very helpful to him lately. John watches from the side with the expression of a boy doing arithmetic.</span>`,
  choices:[
    {t:'Name him heir before the court. (Richard is bound to you; John starts counting differently)', fx:()=>{ addOp(ch('richard'),'henry2',50); addOp(ch('johnl'),'henry2',-25); PRL().prs-=10;
      chron('In this year the king named Richard his heir in all things, and the realm exhaled, and John inhaled.'); }},
    {t:'Refuse. No son of mine will extort me. (Richard walks out — toward Paris)', fx:()=>{ addOp(ch('richard'),'henry2',-40);
      const p = startPlot('richard','depose','henry2'); p.progress = 40;
      addOp(ch('philip2'),'richard',20);
      logIt('plot','Richard rides from court without leave. Men note which road he takes: the Paris road.');
      chron('In this year the king refused his son the succession, and the son went to the king’s enemy, and the father read Absalom with new attention.'); }},
    {t:'"When you have earned it." Stall him. (both sons resent the scales still swinging)', fx:()=>{ addOp(ch('richard'),'henry2',-15); addOp(ch('johnl'),'henry2',-10); }},
  ]})},
{id:'buildruins', w:6, trig:['build','develop'], cond:()=>true, run:()=>{
  const p = pick(realmProvs(G.player).filter(x=>!pv(x).occ)) || PRL().cap;
  return { title:'Old Stones at '+PROVDATA[p].n,
  text:`Digging foundations at ${PROVDATA[p].n}, the workmen strike dressed stone — a buried Roman villa, its floors bright with pagan gods. The masons want it blessed; the peasants want the lead; an antiquary you did not hire wants a word.`,
  choices:[
    {t:'Strip it for coin and cut stone. (+10 gold)', fx:()=>{ PRL().gold+=10; }},
    {t:'Consecrate the ground and raise a chapel over it. (+5 legitimacy)', fx:()=>{ PRL().leg=clamp(PRL().leg+5,0,100); }},
  ]};}},
{id:'envoyreturn', w:6, trig:['envoy','gift'], cond:()=>Object.values(G.realms).some(r=>!r.dead&&r.id!==G.player&&!warBetween(r.id,G.player)), run:()=>{
  const r = pick(Object.values(G.realms).filter(x=>!x.dead&&x.id!==G.player&&!warBetween(x.id,G.player)));
  return { title:'A Return Embassy',
  text:`Hard on the heels of your own envoy, ${esc(r.n)} sends one back — with gifts, flattery, and a proposal folded inside the courtesy: a common cause, if you are minded to it.`,
  choices:[
    {t:`Warm the friendship. (+15 opinion with ${esc(r.n)})`, fx:()=>{ addOp(ruler(r.id), PR().id, 15); }},
    {t:'Take the gifts, promise nothing. (+6 gold)', fx:()=>{ PRL().gold+=6; }},
  ]};}},
{id:'plotwaver', w:6, trig:['plotMurder','plotSlander'], cond:()=>G.plots.some(p=>p.mine&&(p.type==='murder'||p.type==='slander')), run:()=>{
  const p = pick(G.plots.filter(x=>x.mine&&(x.type==='murder'||x.type==='slander')));
  return { title:'A Conspirator’s Cold Feet',
  text:`One of your quiet men in the ${p.type} against ${esc(plotTargetName(p))} has grown loud in his silences. He wants more coin, or a way out — and a frightened man is a leak with legs.`,
  choices:[
    {t:'Pay him to hold his nerve. (-8 gold, the plot advances)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-8); p.progress=Math.min(95,p.progress+20); }},
    {t:'Silence him for good. (-4 legitimacy, the secret keeps)', fx:()=>{ PRL().leg=clamp(PRL().leg-4,0,100); }},
    {t:'Let him run. (the plot slows; discovery looms)', fx:()=>{ p.progress=Math.max(0,p.progress-15); if(chance(.3)) p.exposed=1; }},
  ]};}},
{id:'warvolunteers', w:6, trig:['war'], cond:()=>atWar(G.player).length>0, run:()=>({
  title:'The Banner Draws Swords',
  text:`War has a way of emptying halls. Landless younger sons, hedge-knights, and second cousins with debts and grudges come riding to your muster, smelling plunder and a place in the chronicle.`,
  choices:[
    {t:'Take the best of them. (+150 retinue)', fx:()=>{ PRL().retinue=Math.min(900,PRL().retinue+150); }},
    {t:'Feast them and send the rabble home. (-4 gold, court +4 opinion)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-4); for(const c of myCourt()) addOp(c,PR().id,4); }},
  ]})},

/* ===== Faith & piety ===== */
{id:'heresy', w:5, cond:()=>realmProvs(G.player).length>=2&&PRL().rel!=='pagan', run:()=>{
  const p=pick(realmProvs(G.player));
  return { title:'A Preacher of Error',
  text:`In ${PROVDATA[p].n} a barefoot preacher draws crowds, denouncing your bishops as fat and your taxes as sin. The doctrine is muddled; the anger is not. Your chaplain wants him burned; your steward notes that the crowd around him pays no tithes.`,
  choices:[
    {t:'Burn him. Let the ashes preach obedience. (+6 legitimacy, −8 piety, the commons fear you)', fx:()=>{ PRL().leg=clamp(PRL().leg+6,0,100); PRL().piety=clamp((PRL().piety||0)-8,0,100); chron(`In this year a heresiarch was burned at ${PROVDATA[p].n}, and the smoke was accounted a sermon.`); }},
    {t:'Let your chaplain out-argue him. (his skill decides: a triumph of doctrine, or a public embarrassment)', fx:()=>{ const s=councilBonus(G.player,'chaplain'); if(ri(0,10)<3+s){ pietyGain(G.player,10); toast('✝ Your chaplain wins the disputation — <b>+10 piety</b>'); } else { PRL().leg=clamp(PRL().leg-5,0,100); toast('The preacher makes a fool of your chaplain — −5 legitimacy'); } }},
    {t:'Tolerate him; the poor need someone to shout for. (−6 piety, +4 gold, the crowd loves you)', fx:()=>{ PRL().piety=clamp((PRL().piety||0)-6,0,100); PRL().gold+=4; }},
  ]};}},
{id:'holyorder', w:4, cond:()=>(PRL().piety||0)>=25&&PRL().rel!=='pagan', run:()=>({
  title:'A Holy Order Petitions',
  text:`Brothers of a rising order — plain habits, hard eyes, a rule of poverty they intend chiefly for others — ask leave to found a house in your realm. They bring prayers, hospitals for the poor, and, quietly, disciplined knights.`,
  choices:[
    {t:'Endow them richly. (−12 gold, +12 piety, +4 legitimacy)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-12); pietyGain(G.player,12); PRL().leg=clamp(PRL().leg+4,0,100); }},
    {t:'Grant land, but no gold. (+6 piety)', fx:()=>{ pietyGain(G.player,6); }},
    {t:'Refuse; you have monks enough eating your bread. (−4 piety)', fx:()=>{ PRL().piety=clamp((PRL().piety||0)-4,0,100); }},
  ]})},
{id:'zealotwar', w:4, cond:()=>{ if((PRL().piety||0)<30||PRL().rel==='pagan'||G.flags.holyBanner) return false; return borderRealms(G.player).some(r=>rl(r).rel!==PRL().rel); }, run:()=>{
  const foes=borderRealms(G.player).filter(r=>rl(r).rel!==PRL().rel);
  const foe=foes.length?pick(foes):null;
  if(!foe) return null;
  return { title:'The Preacher’s Demand',
  text:`A firebrand preaches in your own hall: God’s enemies sit across your border in ${rl(foe).n}, and a prince who will not draw the sword for the faith is no prince at all. The court is stirred; some eyes turn to you, measuring.`,
  choices:[
    {t:`Bless a banner against ${esc(rl(foe).n)}. (−25 piety; your next war on the faithless is a holy one)`, fx:()=>{ PRL().piety=clamp((PRL().piety||0)-25,0,100); G.flags.holyBanner=1; toast('⚔ A holy banner waits to be raised'); }},
    {t:'Counsel patience. War is not prayer. (−6 piety, the zealots grumble)', fx:()=>{ PRL().piety=clamp((PRL().piety||0)-6,0,100); }},
    {t:'Silence him from the pulpit. (+4 legitimacy, −10 piety)', fx:()=>{ PRL().leg=clamp(PRL().leg+4,0,100); PRL().piety=clamp((PRL().piety||0)-10,0,100); }},
  ]};}},
{id:'tithewar', w:4, cond:()=>PRL().rel==='catholic'&&!PRL().excomm, run:()=>({
  title:'The Tithe Dispute',
  text:`Your bishops want the tithes of three rich manors restored to the Church; your treasury wants them kept. Both cite God; only one cites the account-books. The legate waits, mild-eyed, on your answer.`,
  choices:[
    {t:'Restore the tithes to the Church. (−8 gold, +12 piety)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-8); pietyGain(G.player,12); }},
    {t:'Keep them for the crown. (+8 gold, −12 piety, and Rome remembers)', fx:()=>{ PRL().gold+=8; PRL().piety=clamp((PRL().piety||0)-12,0,100); if(chance(.12)){ PRL().excomm=true; logIt('court','☩ Rome pronounces anathema over the seized tithes.'); toast('☩ <b class="neg">Rome excommunicates you over the tithes!</b>'); } }},
    {t:'Split the difference and satisfy no one. (−3 gold, −3 piety)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-3); PRL().piety=clamp((PRL().piety||0)-3,0,100); }},
  ]})},
{id:'pilgrimreturn', w:4, cond:()=>(PRL().piety||0)>=20&&PRL().rel!=='pagan', run:()=>({
  title:'The Pilgrims Return',
  text:`A ragged column of your subjects returns from a far shrine — Compostela, or Rome, or further still — footsore and shining-eyed, bearing palm-fronds and impossible tales. They say they prayed for your house at the holy places.`,
  choices:[
    {t:'Receive them at court with honour. (+6 piety, +6 prestige)', fx:()=>{ pietyGain(G.player,6); PRL().prs+=6; }},
    {t:'Found a hospice for the next who go. (−6 gold, +10 piety)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-6); pietyGain(G.player,10); }},
  ]})},

/* ===== Culture & assimilation ===== */
{id:'foreigncustoms', w:6, cond:()=>realmForeignCult(G.player).length>0, run:()=>{
  const p=pick(realmForeignCult(G.player));
  return { title:'A Conquered People Petition',
  text:`The elders of ${PROVDATA[p].n} — ${cap(pv(p).cult)} in tongue and temper, and lately yours by the sword — ask to keep their own law, their own courts, their own market-days. Grant it, and they settle; refuse, and they submit, sullenly, and keep their grudge warm.`,
  choices:[
    {t:'Grant their customs. (+4 legitimacy now — but they cling to their ways: slower to assimilate)', fx:()=>{ PRL().leg=clamp(PRL().leg+4,0,100); pv(p).asm=Math.max(0,(pv(p).asm||0)-25); }},
    {t:'Impose your law and tongue. (assimilation leaps ahead, but they seethe — −5 legitimacy)', fx:()=>{ pv(p).asm=Math.min(99,(pv(p).asm||0)+30); PRL().leg=clamp(PRL().leg-5,0,100); }},
  ]};}},
{id:'mothertongue', w:5, cond:()=>realmForeignCult(G.player).length>0&&PRL().prs>=10, run:()=>({
  title:'The Crown’s Own Tongue',
  text:`Your chancellor proposes that all charters, courts, and high offices use the ${cap(PRL().cult)} tongue alone — the language of the crown, imposed from the top. It would knit the realm together. It would also tell every other people in it exactly where they stand.`,
  choices:[
    {t:'Decree it. (−10 prestige on the effort; every foreign province assimilates faster this year)', fx:()=>{ PRL().prs=Math.max(0,PRL().prs-10); for(const p of realmForeignCult(G.player)) pv(p).asm=Math.min(99,(pv(p).asm||0)+20); toast('🏰 The crown’s tongue advances across the realm'); }},
    {t:'Leave each people its own. (a realm of many tongues, at peace with itself)', fx:()=>{ for(const c of myCourt()) addOp(c,PR().id,2); }},
  ]})},
{id:'scholarcourt', w:4, cond:()=>PRL().gold>=10, run:()=>{
  const p=realmProvs(G.player).filter(x=>pv(x).dev<5).sort((a,b)=>pv(b).dev-pv(a).dev)[0];
  return { title:'A Scholar Seeks a Patron',
  text:`A scholar of some renown — astronomer, jurist, translator of the Greeks and the Arabs both — seeks a patron. Genius is portable; it goes where the purse opens.`,
  choices:[
    p?{t:`Set him to improving ${PROVDATA[p].n}. (−10 gold, that province develops)`, fx:()=>{ PRL().gold=Math.max(0,PRL().gold-10); pv(p).dev=Math.min(5,pv(p).dev+1); toast(`🌾 ${esc(PROVDATA[p].n)} develops under the scholar’s hand`); }}:null,
    {t:'Keep him at court for his brilliance alone. (−8 gold, +10 prestige)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-8); PRL().prs+=10; }},
    {t:'Send him on his way. Learning is a luxury of peace.', fx:()=>{}},
  ].filter(Boolean)};}},

/* ===== Region & historic ===== */
{id:'firstcrusade', w:99, once:1, cond:()=>G.scen==='y1066'&&G.year>=1095&&PRL().rel==='catholic'&&!PRL().excomm&&!G.flags.crusadeReturn, run:()=>({
  title:'Deus Vult',
  text:`<span class="dropcap">Word comes from Clermont: the Holy Father has called all Christendom to march east and free Jerusalem from the infidel. Kings and beggars alike are sewing crosses to their cloaks. The greatest venture of the age is leaving — with you, or without you.</span>`,
  choices:[
    {t:'Take the cross. (−30 gold; return in two years with glory — or not at all)', fx:()=>{ if(PRL().gold>=30){ PRL().gold-=30; PRL().prs+=25; pietyGain(G.player,30); PRL().leg=clamp(PRL().leg+8,0,100); G.flags.crusadeReturn=G.year+2; chron('In this year the king took the cross and rode east toward Jerusalem, and the realm held its breath.'); } else { toast('You cannot afford to march east — the treasury is too thin.'); } }},
    {t:'Send gold and prayers; keep your throne warm. (−10 gold, +10 piety)', fx:()=>{ PRL().gold=Math.max(0,PRL().gold-10); pietyGain(G.player,10); }},
    {t:'Let the zealots go. Someone must mind the realm. (−6 piety)', fx:()=>{ PRL().piety=clamp((PRL().piety||0)-6,0,100); }},
  ]})},
{id:'worms', w:99, once:1, cond:()=>G.year>=1122&&G.year<=1140&&PRL().rel==='catholic', run:()=>({
  title:'The Concordat',
  text:`After two generations of quarrel between crown and mitre over who invests bishops with ring and staff, a settlement is reached: the Church shall name them, the crown shall grant their lands. Everyone claims victory; the parchment is ambiguous enough to allow it.`,

function fireEvents(scriptedOnly){
  const eligible = EVENTS.filter(e=>{
    if(e.once && G.flags['ev_'+e.id]) return false;
    try{ return e.cond(); }catch(_){ return false; }
  });
  /* scripted (w=99) always fire; then up to 2 random others */
  const scripted = eligible.filter(e=>e.w===99);
  const rest = scriptedOnly ? [] : eligible.filter(e=>e.w<99 && !e.trig);
  const chosen = [...scripted.slice(0,2)];
  let budget = chance(.5) ? 1 : 0;  /* the rest now arrive mid-turn, triggered by your actions */
  while(budget-- > 0 && rest.length){
    const tot = rest.reduce((s,e)=>s+e.w,0);
    let roll = R()*tot;
    let idx = 0;
    for(let i=0;i<rest.length;i++){ roll -= rest[i].w; if(roll<=0){ idx=i; break; } }
    chosen.push(rest.splice(idx,1)[0]);
  }
  for(const e of chosen){
    G.flags['ev_'+e.id] = 1;
    try{ const ev = e.run(); if(ev) queueEvent(ev); }catch(err){ console.error('event',e.id,err); }
  }
}

<script>
/* ============ AI realms ============ */
function landPath(from, targets, realmId){
  /* BFS over land adjacency; armies may only cross their own, hostile, or occupied ground */
  const passable = p => pv(p).r===realmId || hostile(pv(p).r, realmId) || pv(p).occ===realmId;
  const tset = new Set(targets);
  if(tset.has(from)) return null;
  const prev = {[from]:null};
  const q = [from];
  while(q.length){
    const cur = q.shift();
    for(const nx of (PROVDATA[cur].adj||[])){
      if(prev[nx]!==undefined || !passable(nx)) continue;
      prev[nx] = cur;
      if(tset.has(nx)){
        let step = nx;
        while(prev[step]!==from) step = prev[step];
        return step;
      }
      q.push(nx);
    }
  }
  return undefined; /* unreachable by land */
}
function aiTurn(rid){
  const R_ = rl(rid);
  if(R_.dead || isPlayer(rid)) return;
  const rul = ruler(rid);
  if(!rul) return;
  const wars = atWar(rid);
  const amb = rul.tr.includes('ambitious'), brave = rul.tr.includes('brave'),
    craven = rul.tr.includes('craven'), content = rul.tr.includes('content'),
    greedy = rul.tr.includes('greedy'), pious = rul.tr.includes('pious');

  /* --- economy --- */
  if(!wars.length && R_.gold > 75 && chance(.5)){
    const slot = realmProvs(rid).filter(p=>!pv(p).bld && !pv(p).cons).sort((a,b)=>pv(b).dev-pv(a).dev)[0];
    if(slot){
      const b = pious ? (chance(.4)?'cathedral':'monastery')
        : greedy ? (chance(.6)?'market':'castle')
        : chance(.2) ? 'academy' : chance(.5) ? 'market' : 'castle';
      R_.gold -= BUILDINGS[b].cost; pv(slot).cons = {b, left:4};
    }
  }
  /* --- marriages (AI–AI) --- */
  if(chance(.15)){
    const mine = marriageCandidates(rid);
    if(mine.length){
      const partners = Object.values(G.realms).filter(r=>!r.dead&&r.id!==rid&&!isPlayer(r.id)&&!allianceBetween(r.id,rid)&&marriageCandidates(r.id).length);
      if(partners.length){
        const pr = pick(partners);
        const a = pick(mine);
        const b = marriageCandidates(pr.id).find(c=>c.sex!==a.sex);
        if(b && rl(pr.id).rel===R_.rel && opinion(ruler(pr.id), rul) > -20) doMarriage(a,b);
      }
    }
  }
  /* --- declare war --- */
  if(!wars.length && (G.season<=1) && !G.regencyOf?.(rid)){
    if(age(rul)>=16){
      const claimants = [rul, ...Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&c.claims.length&&c.id!==rul.id)];
      let best=null;
      const viable = tgt => { const T=rl(tgt);
        return T && !T.dead && tgt!==rid && !truceBetween(rid,tgt) && !warBetween(rid,tgt) && !allianceBetween(rid,tgt); };
      for(const cl of claimants){
        for(const tgt of cl.claims){
          if(!viable(tgt)) continue;
          const ratio = realmStrength(rid) / Math.max(1, realmStrength(tgt));
          let need = 1.3;
          if(amb) need -= .3; if(brave) need -= .15;
          if(content) need += .5; if(craven) need += .4;
          /* 1066: the great gamble — history holds its breath */
          const scripted = G.year<=1067 && tgt==='england' && (rid==='normandy'||rid==='norway');
          if(scripted) need = .45;
          if(ratio >= need && chance(scripted? .85 : amb? .6 : .3)){
            best = {cl, tgt, cb:{type:'throne', target:tgt}}; break;
          }
        }
        if(best) break;
      }
      /* the faithful raid across the faith line */
      if(!best && (rul.tr.includes('pious')||rul.tr.includes('ambitious')||rul.tr.includes('brave')) && chance(.25)){
        const targets = Object.keys(G.provinces).filter(p=>{
          const o = pv(p).r;
          return o && o!==rid && rl(o) && !rl(o).dead && rl(o).rel!==R_.rel && viable(o) &&
            ((PROVDATA[p].adj||[]).some(q=>pv(q).r===rid) || (PROVDATA[p].coast && PROVDATA[rl(rid).cap].coast && chance(.3)));
        });
        if(targets.length){
          const prov = pick(targets);
          const tgt = pv(prov).r;
          const ratio = realmStrength(rid) / Math.max(1, realmStrength(tgt));
          if(ratio >= (amb? .95 : 1.15)){
            best = {cl:rul, tgt, cb:{type:'province', target:prov, holy:true}};
            R_.leg = clamp(R_.leg+5, 0, 100);
          }
        }
      }
      /* a province claim is a smaller, safer war */
      if(!best && rul.pclaims && rul.pclaims.length){
        for(const prov of rul.pclaims){
          const tgt = pv(prov).r;
          if(!tgt || tgt===rid || !viable(tgt)) continue;
          const ratio = realmStrength(rid) / Math.max(1, realmStrength(tgt));
          let need = 1.0;
          if(amb) need -= .2; if(content) need += .4; if(craven) need += .3;
          if(ratio >= need && chance(amb? .5 : .25)){
            best = {cl:rul, tgt, cb:{type:'province', target:prov}}; break;
          }
        }
      }
      if(best){
        declareWar(rid, best.tgt, best.cb, best.cl.id);
      }
    }
  }
  /* --- wage war --- */
  if(atWar(rid).length){
    const myArmies = G.armies.filter(a=>a.realm===rid);
    const fielded = myArmies.reduce((s,a)=>s+armySize(a),0);
    if(fielded < realmStrength(rid)*.5 && G.season<=1 && !myArmies.length){
      raiseArmy(rid, R_.cap);
    }
    const foes = new Set();
    for(const w of atWar(rid)){
      const mySideA = w.sides.a.includes(rid);
      for(const f of (mySideA? w.sides.b : w.sides.a)) foes.add(f);
    }
    for(const a of G.armies.filter(x=>x.realm===rid && !x.moved)){
      /* defend home sieges first, then unoccupied enemy ground, then contested ground */
      let targets = Object.keys(G.provinces).filter(p=>pv(p).r===rid && enemiesIn(p, rid).length);
      if(!targets.length) targets = Object.keys(G.provinces).filter(p=>foes.has(pv(p).r) && !pv(p).occ);
      if(!targets.length) targets = Object.keys(G.provinces).filter(p=>foes.has(pv(p).r) && pv(p).occ!==rid && !hostile(pv(p).occ, pv(p).r));
      if(!targets.length) continue;
      const step = landPath(a.prov, targets, rid);
      if(step === null) continue; /* already there */
      if(step === undefined){
        /* cross the sea: land where the defence is thinnest, capital first among equals */
        if(PROVDATA[a.prov].coast && R_.gold>=15){
          const coastal = targets.filter(p=>PROVDATA[p].coast)
            .sort((x,y)=> ((y===rl(pv(y).r)?.cap?1:0) - (x===rl(pv(x).r)?.cap?1:0)));
          const dest = coastal.find(p=>enemiesIn(p, rid).reduce((s,f)=>s+armySize(f),0) < armySize(a)*1.1);
          if(dest) moveArmy(a, dest, true);
        }
      } else {
        const foeArmies = enemiesIn(step, rid);
        const foeStr = foeArmies.reduce((s,f)=>s+armySize(f),0);
        if(foeStr === 0 || foeStr < armySize(a)*(brave?1.25:1.0)) moveArmy(a, step, false);
      }
    }
  } else {
    /* peace: send the levies home */
    for(const a of G.armies.filter(x=>x.realm===rid)) disbandArmy(a);
  }
  /* --- courtesies --- */
  if(chance(.1)){
    const others = Object.values(G.realms).filter(r=>!r.dead&&r.id!==rid);
    if(others.length){
      const o = pick(others);
      addOp(ruler(o.id), rul.id, 4);
    }
  }
  aiFillCouncil(rid);
}
</script>

  },

    let x=0,y=0; for(const p of pts){x+=p[0];y+=p[1];} return [x/pts.length, y/pts.length];
  },

    const r=clamp(Math.round(((n>>16)&255)*f),0,255), g=clamp(Math.round(((n>>8)&255)*f),0,255), b=clamp(Math.round((n&255)*f),0,255);

    if(c.sex==='f'){
      hair = `<path d="M9.6 23 q-1.8 -15 7.4 -16 q9.2 1 7.4 16 l-2.6 0 q.6 -9 -1.2 -11.5 q-1.6 2 -3.6 2 q-2 0 -3.6 -2 q-1.8 2.5 -1.2 11.5 z" fill="${hairC}" stroke="${hairD}" stroke-width=".5"/>`;
    } else if(hs===2 && a>40){

  provTip(pid){
    const pd = PROVDATA[pid], st = pv(pid);
    let t = `<b>${esc(pd.n)}</b><br>${st.r&&rl(st.r)?esc(rl(st.r).n):'—'}`;
    if(st.occ) t += ` · <span class="neg">occupied by ${esc(rl(st.occ).n)}</span>`;
    t += `<br>${TERRAIN[pd.t].n} · ${STATICO.dev}${st.dev} · ${st.bld?BUILDINGS[st.bld].ico+' '+BUILDINGS[st.bld].n:'no building'}`;
    t += `<br>${RELICO[st.rel]} ${RELNAME[st.rel]} · ${esc(cap(st.cult||''))}${st.r&&rl(st.r)&&st.rel!==rl(st.r).rel?' <span class="neg">(faith not the realm’s)</span>':''}${st.r&&rl(st.r)&&st.cult!==rl(st.r).cult?' <span class="neg">(foreign culture)</span>':''}`;
    t += `<br>Levies ${fmtN(levyOf(pid))} · Tax ${taxOf(pid)}/season`;
    const here = G.armies.filter(a=>a.prov===pid);
    for(const a of here) t += `<br>⚔ ${esc(rl(a.realm).n)} host — ${fmtN(armySize(a))}${a.siege?` (siege ${Math.min(99,Math.round(a.siege))}%)`:''}`;
    if(G.moveMode){
      const mv = G.armies.find(x=>x.id===G.moveMode);
      if(mv && mv.prov!==pid){
        const foes = enemiesIn(pid, mv.realm);
        if(foes.length){
          const cmA = alive(ch(mv.cmdr))?skill(ch(mv.cmdr),'mar'):3;
          const my = armySize(mv)*(1+cmA*.06)*TERRAIN[pd.t].atk;
          const their = foes.reduce((s,f)=>{const cf=alive(ch(f.cmdr))?skill(ch(f.cmdr),'mar'):3; return s+armySize(f)*(1+cf*.06);},0)*TERRAIN[pd.t].def;
          const r = my/Math.max(1,their);
          const [cls, word] = r>1.25?['oddsGood','Favorable']:r<0.8?['oddsBad','Grim']:['oddsEven','Even'];
          t += `<br><span class="${cls}">⚔ Battle odds: ${word}</span> — ${Math.round(my)} vs ${Math.round(their)}, before fortune`;
        } else if(G.season>=2 && (pv(pid).r!==mv.realm || pv(pid).occ)){
          t += `<br><span class="neg">${G.season===2?'Autumn rains':'Winter'} will bleed an army here</span>`;
        }
      }
    }
    return t.replace(/"/g,'&quot;');
  },

      <filter id="parchtex"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" seed="3" result="n"/>

    h += `<g class="seaDeco">
      <text class="seaLbl" x="430" y="332" style="font-size:13px;letter-spacing:3px">Mare Germanicum</text>
      <text class="seaLbl" x="580" y="368" style="font-size:10px;letter-spacing:2px">Mare Balticum</text>
