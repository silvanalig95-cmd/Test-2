<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Crown &amp; Realm — 1066</title>
<style>
:root{
  --parch:#e8dcbf; --parch2:#dfd0aa; --parch3:#d4c294;
  --ink:#2b2013; --ink2:#5a4a33;
  --red:#7b2d26; --gold:#8a6d1f; --sea:#a9bdb1;
  --panel:#efe4c8; --line:#a08c5f;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:Georgia,'Times New Roman',serif; color:var(--ink);
  background:var(--parch);
  background-image:radial-gradient(ellipse at 30% 20%, rgba(255,250,230,.5), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(120,90,40,.12), transparent 55%);
  display:flex; flex-direction:column; overflow:hidden;
}
button{font-family:inherit; cursor:pointer; color:var(--ink);
  background:linear-gradient(#f2e8cd,#ddcda3); border:1px solid var(--line);
  border-radius:3px; padding:4px 10px; font-size:13px;}
button:hover{background:linear-gradient(#f8f0da,#e6d7ae)}
button:disabled{opacity:.45; cursor:default}
button.primary{background:linear-gradient(#8c3a31,#6d251f); color:#f3e6c8; border-color:#4c1712; font-weight:bold}
button.primary:hover{background:linear-gradient(#9c453b,#7b2d26)}
button.small{font-size:11px; padding:2px 7px}
h3{font-variant:small-caps; letter-spacing:1px; color:var(--red); font-size:15px; margin-bottom:4px}
::-webkit-scrollbar{width:9px} ::-webkit-scrollbar-thumb{background:var(--line); border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

#topbar{
  display:flex; align-items:center; gap:14px; padding:6px 12px; flex:0 0 auto;
  background:linear-gradient(#3a2a18,#2b2013); color:#e8dcbf;
  border-bottom:3px double var(--gold); font-size:14px; flex-wrap:wrap;
}
#topbar .title{font-variant:small-caps; letter-spacing:2px; font-size:17px; color:#d9b95c}
#topbar .res{display:flex; gap:12px; align-items:center}
#topbar .res span{white-space:nowrap}
#dateBox{font-style:italic; color:#f0e2b8}
#apBox b{color:#d9b95c}
#topbar .spacer{flex:1}
#main{flex:1; display:flex; min-height:0}
.panel{
  width:295px; flex:0 0 auto; overflow-y:auto; padding:10px;
  background:linear-gradient(var(--panel),var(--parch2));
  font-size:13px;
}
#leftPanel{border-right:2px solid var(--line)}
#rightPanel{border-left:2px solid var(--line)}
#mapWrap{flex:1; min-width:0; position:relative; background:var(--sea);
  background-image:repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 26px)}
#mapSvg{width:100%; height:100%; display:block}
#log{
  flex:0 0 112px; overflow-y:auto; padding:6px 12px; font-size:12.5px;
  background:linear-gradient(var(--parch2),var(--parch3));
  border-top:2px solid var(--line);
}
#log .entry{margin-bottom:2px; line-height:1.35}
#log .stamp{color:var(--red); font-variant:small-caps; margin-right:6px}
#log .war{color:#6d251f} #log .plot{color:#4a2a5a} #log .court{color:#3a4a2a}

.tabs{display:flex; gap:4px; margin-bottom:8px}
.tabs button{flex:1; font-size:12px; padding:3px}
.tabs button.on{background:linear-gradient(#8c3a31,#6d251f); color:#f3e6c8}
.charRow{display:flex; align-items:center; gap:7px; padding:4px 3px; border-bottom:1px dotted var(--line); cursor:pointer}
.charRow:hover{background:rgba(255,250,220,.55)}
.charRow .nm{flex:1; min-width:0}
.charRow .nm .sub{font-size:11px; color:var(--ink2); font-style:italic}
.medal{width:34px; height:38px; flex:0 0 auto}
.medal.big{width:64px; height:72px}
.card{background:rgba(255,251,235,.6); border:1px solid var(--line); border-radius:4px; padding:8px; margin-bottom:9px}
.trait{display:inline-block; background:#e4d5a8; border:1px solid var(--line); border-radius:8px;
  padding:0 7px; font-size:11.5px; margin:1px 2px 1px 0}
.trait.bad{background:#dcc0b4}
.skl{display:inline-block; margin-right:9px; font-size:12px}
.skl b{color:var(--red)}
.opline{display:flex; justify-content:space-between; font-size:12px; padding:1px 0}
.pos{color:#2e5e2e} .neg{color:#8c2f26}
.actBtns{display:flex; flex-wrap:wrap; gap:5px; margin-top:7px}
.kv{display:flex; justify-content:space-between; padding:1px 0; font-size:12.5px}
.kv b{font-weight:bold}
.hint{font-size:11.5px; font-style:italic; color:var(--ink2); margin-top:5px; line-height:1.35}

.provPath{stroke:#4a3a22; stroke-width:1.4; cursor:pointer; transition:filter .12s}
.provPath:hover{filter:brightness(1.12)}
.provPath.sel{stroke:#fff8e0; stroke-width:2.6}
.provName{font-size:11px; fill:#f6eed6; text-anchor:middle; pointer-events:none;
  font-family:Georgia,serif; paint-order:stroke; stroke:rgba(30,20,8,.75); stroke-width:2.6px; letter-spacing:.4px}
.armyTok{cursor:pointer}
.armyTok text{font-size:10px; fill:#fff; text-anchor:middle; font-weight:bold; pointer-events:none}
.moveTarget{stroke:#ffe98a; stroke-width:3; stroke-dasharray:6 4; animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.capStar{pointer-events:none}

.modalBack{position:fixed; inset:0; background:rgba(25,16,6,.62); display:flex;
  align-items:center; justify-content:center; z-index:50}
.modal{
  width:min(560px,92vw); max-height:86vh; overflow-y:auto;
  background:linear-gradient(#f4ead0,#e6d7ae); border:2px solid #6b552e; border-radius:6px;
  box-shadow:0 10px 40px rgba(0,0,0,.5), inset 0 0 60px rgba(160,120,50,.15);
  padding:18px 22px;
}
.modal h2{font-variant:small-caps; letter-spacing:1.5px; color:var(--red);
  border-bottom:1px solid var(--line); padding-bottom:6px; margin-bottom:10px; font-size:20px}
.modal .body{font-size:14px; line-height:1.5; margin-bottom:12px}
.modal .body em{color:var(--ink2)}
.modal .choices{display:flex; flex-direction:column; gap:7px}
.modal .choices button{text-align:left; padding:8px 12px; font-size:13.5px; line-height:1.35}
.modal .fine{font-size:11.5px; color:var(--ink2); font-style:italic; margin-top:3px}
.btMath{font-family:'Courier New',monospace; font-size:12px; background:rgba(255,255,255,.45);
  border:1px dashed var(--line); padding:7px 9px; margin:8px 0; white-space:pre-wrap}

#setup{position:fixed; inset:0; z-index:60; overflow-y:auto;
  background:radial-gradient(ellipse at 50% 30%, #4a3823, #241a0d 75%);
  color:#e8dcbf; display:flex; flex-direction:column; align-items:center; padding:34px 16px}
#setup h1{font-variant:small-caps; letter-spacing:6px; font-size:44px; color:#d9b95c;
  text-shadow:0 3px 12px rgba(0,0,0,.7)}
#setup .sub{font-style:italic; margin:8px 0 26px; color:#cbb98c; text-align:center; max-width:640px; line-height:1.5}
.scenTabs{display:flex; gap:10px; margin:18px 0 4px}
.scenBtn{background:transparent; color:#cbb98c; border:1px solid #8a6d1f; border-radius:4px;
  padding:6px 16px; font-size:14px; font-variant:small-caps; letter-spacing:1px}
.scenBtn.on{background:linear-gradient(#8c3a31,#6d251f); color:#f3e6c8; border-color:#4c1712}
.scenBtn:hover{color:#f3e6c8}
#setup .realms{display:flex; gap:18px; flex-wrap:wrap; justify-content:center}
.realmCard{width:250px; background:linear-gradient(#efe4c8,#d9c89c); color:var(--ink);
  border:2px solid #8a6d1f; border-radius:6px; padding:14px; cursor:pointer; transition:transform .15s}
.realmCard:hover{transform:translateY(-5px)}
.realmCard h2{font-variant:small-caps; color:var(--red); font-size:19px}
.realmCard .diff{font-size:12px; font-weight:bold; margin:3px 0 8px}
.realmCard p{font-size:12.5px; line-height:1.45}
.realmCard .shield{float:right; width:44px; height:52px}
#setup .foot{margin-top:26px; font-size:12px; color:#9a8a68}
#setup .loadRow{margin-top:18px}

#chronicleModal .modal{width:min(680px,94vw)}
.chronEntry{margin-bottom:9px; line-height:1.5; font-size:14px}
.chronEntry .yr{font-variant:small-caps; color:var(--red); font-weight:bold; margin-right:7px}
.chronEntry:first-letter{font-size:1.05em}
.dropcap:first-letter{float:left; font-size:44px; line-height:.85; padding:2px 6px 0 0; color:var(--red)}

.seasonBadge{display:inline-block; border:1px solid var(--gold); border-radius:3px;
  padding:0 8px; background:rgba(217,185,92,.15)}
.warRow{border-left:3px solid var(--red); padding-left:7px; margin-bottom:7px}
.plotRow{border-left:3px solid #4a2a5a; padding-left:7px; margin-bottom:7px}
@media (max-width:1050px){ .panel{width:230px} }
</style>
</head>
<body>

<div id="topbar">
  <span class="title">Crown &amp; Realm</span>
  <span id="dateBox"></span>
  <span id="realmBox"></span>
  <div class="res">
    <span id="goldBox" title="Gold — buildings, mercenaries, bribes"></span>
    <span id="prsBox" title="Prestige — marriages, claims, coronation"></span>

  <button class="primary" id="endBtn" onclick="Game.endSeason()">End Season ⏵</button>
</div>

<div id="main">
  <div class="panel" id="leftPanel">
    <div class="tabs">

    <div id="leftBody"></div>
  </div>
  <div id="mapWrap">
    <svg id="mapSvg" viewBox="0 0 1000 760" preserveAspectRatio="xMidYMid meet"></svg>
  </div>
  <div class="panel" id="rightPanel"><div id="rightBody"></div></div>
</div>

<div id="log"></div>

<div id="setup">
  <h1>Crown &amp; Realm</h1>

</div>

<div id="modalHost"></div>

<script>
"use strict";
/* ============ RNG & helpers ============ */
let _rs = 1;
function srand(s){ _rs = s>>>0 || 1; }
function R(){ _rs |= 0; _rs = _rs + 0x6D2B79F5 | 0; let t = Math.imul(_rs ^ _rs>>>15, 1|_rs);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
function ri(a,b){ return a + Math.floor(R()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(R()*arr.length)]; }
function chance(p){ return R() < p; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtN(n){ return n>=1000 ? (n/1000).toFixed(1).replace('.0','')+'k' : ''+n; }

<script>
/* ============ Game state & world creation ============ */
let G = null;

function skill(c, s){
  let v = c.sk[s];
  for(const t of c.tr){ const T=TRAITS[t]; if(T && T[s]) v += T[s]; }
  return clamp(v, 0, 12);
}
function age(c){ return (G.year - c.by); }
function alive(c){ return c && !c.dead; }
function ch(id){ return G.chars[id]; }
function rl(id){ return G.realms[id]; }
function pv(id){ return G.provinces[id]; }
function ruler(rid){ return ch(rl(rid).ruler); }
function isPlayer(rid){ return rid === G.player; }
function fullName(c){ return c.nm + (c.num ? ' ' + c.num : '') + (c.epithet ? ' ' + c.epithet : ''); }
function title(c){
  const r = Object.values(G.realms).find(r=>!r.dead && r.ruler===c.id);
  if(r) return (c.sex==='m'?(r.rank==='duchy'?'Duke':'King'):(r.rank==='duchy'?'Duchess':'Queen'))+' of '+r.n;
  return c.sex==='m'?'Lord':'Lady';
}
function realmProvs(rid){ return Object.keys(G.provinces).filter(p=>G.provinces[p].r===rid); }
function realmStrength(rid){
  let s = 0;
  for(const p of realmProvs(rid)){ const pr=pv(p); if(pr.occ && pr.occ!==rid) continue; s += levyOf(p); }
  s += rl(rid).retinue||0;
  return s;
}
function levyOf(p){ const pr=pv(p); return 200 + pr.dev*110 + (pr.bld==='castle'?150:0); }
function taxOf(p){ const pr=pv(p); return pr.dev + (pr.bld==='market'?2:0); }

let _cid = 0;
function mkChar(o){
  const c = Object.assign({
    id:'c'+(++_cid), nm:'?', dyn:'', realm:'', cult:'saxon', sex:'m', by:1030, dead:0,
    tr:[], sk:{dip:ri(2,6),mar:ri(2,6),int:ri(2,6),ste:ri(2,6)}, sp:null, fa:null, mo:null,
    op:{}, claims:[], pclaims:[], seat:null,
  }, o);
  if(o.id) c.id = o.id;
  G.chars[c.id] = c;
  return c;
}
function randTraits(n){
  const out = [];
  const keys = Object.keys(TRAITS);
  while(out.length < n){
    const t = pick(keys);
    if(out.includes(t) || out.includes(TRAITS[t].opp)) continue;
    out.push(t);
  }
  return out;
}
function mkCourtier(rid, sex){
  const R_ = rl(rid);
  const cult = R_.cult;
  return mkChar({ nm:pick(NAMES[cult][sex||'m']), dyn:'', realm:rid, cult, sex:sex||'m',
    by: G.year - ri(20,52), tr:randTraits(2) });
}

function newGame(playerRealm, seed, scenId){
  srand(seed);
  _cid = 0;
  const S = SCENARIOS[scenId];
  G = {
    seed, scen:scenId, year:S.year, endYear:S.year+100, season:0, player:playerRealm,
    realms:{}, provinces:{}, chars:{}, armies:[], wars:[], plots:[], alliances:[], truces:[],
    log:[], chron:[], ap:3, sel:null, moveMode:null, aid:0, wid:0, pid:0, plague:0,
    flags:{}, over:false, regency:false, eventQueue:[],
  };
  for(const [pid, pd] of Object.entries(PROVDATA)){
    G.provinces[pid] = { r:null, occ:null, dev:pd.d, bld:null };
  }
  for(const [rid, rd] of Object.entries(REALMDATA)){
    const provs = S.provs ? (S.provs[rid]||[]) : rd.provs;
    G.realms[rid] = { id:rid, n:rd.n, col:rd.col, cap:rd.cap, cult:rd.cult,
      gold:20+provs.length*8, prs:S.cards[rid]?100:60, leg:70, ruler:null, retinue:0, law:'primo',
      excomm:false, council:{marshal:null,steward:null,spymaster:null,chaplain:null},
      rank: provs.length>=3 ? 'kingdom':'duchy', dead: provs.length?0:'unformed' };
    for(const p of provs) G.provinces[p].r = rid;
  }
  G.provinces.rouen.bld='castle'; G.provinces.idf.bld='castle';
  G.provinces.flanders.bld='market'; G.provinces.essex.bld='market';
  G.provinces.kent.bld='cathedral';

  if(scenId==='y1066'){
    G.realms.normandy.rank='duchy'; G.realms.flanders.rank='duchy'; G.realms.brittany.rank='duchy';
    G.realms.mercia.rank='duchy'; G.realms.northumbria.rank='duchy'; G.realms.wales.rank='kingdom';
    seedCast1066();
    /* standing forces of 1066: housecarls, knights, and Hardrada's veterans */
    G.realms.england.retinue = 400;
    G.realms.normandy.retinue = 500;
    G.realms.norway.retinue = 600;
    /* recent peaces hold a while: Sweyn made terms with both crowns */
    G.truces.push({a:'denmark', b:'norway', until:1069}, {a:'denmark', b:'england', until:1069});
    logIt('court', 'The chronicle of your house begins. Edward the Confessor is dead; the year of three kings has come.');
    chron(`In the year of Our Lord 1066 this chronicle was begun, when Edward the old king died childless at Westminster and the great of the earth began to circle England like ravens over a stricken hart.`);
  } else {
    G.realms.flanders.rank='duchy'; G.realms.brittany.rank='duchy'; G.realms.wales.rank='kingdom';
    G.provinces.essex.dev=5; G.provinces.rouen.dev=4; G.provinces.idf.dev=5;
    G.provinces.york.bld='cathedral'; G.provinces.sjaelland.bld='market';
    seedCast1187();
    /* Angevin knights and the French royal demesne guard */
    G.realms.england.retinue = 600;
    G.realms.france.retinue = 300;
    G.realms.scotland.retinue = 200;
    /* the humiliation of Falaise still binds Scotland's hands, barely */
    G.truces.push({a:'scotland', b:'england', until:1189});
    logIt('court', 'The chronicle of your house begins. The Angevin empire sprawls from Northumbria to Maine — and its heirs sharpen their knives at their father’s table.');
    chron(`In the year of Our Lord 1187 this chronicle was begun, when Henry the second of that name ruled more of France than the French king did, and his sons loved him as wolves love a wounded stag.`);
  }
  /* the player's imperial threshold scales with their inheritance */
  G.impThresh = Math.max(15, realmProvs(playerRealm).length+5);
  for(const rid of Object.keys(G.realms)){
    if(G.realms[rid].dead) continue;
    for(let i=0;i<3;i++) mkCourtier(rid);
    aiFillCouncil(rid);
  }
  G.realms[playerRealm].gold += 10;
}

  addOp(ch('eleanor'), 'henry2', -50); addOp(ch('henry2'), 'eleanor', -30);
  addOp(ch('philip2'), 'henry2', -55); addOp(ch('henry2'), 'philip2', -40);
  addOp(ch('philip2'), 'richard', 25); addOp(ch('richard'), 'philip2', 20);
  addOp(ch('wlion'), 'henry2', -45);
  addOp(ch('constance'), 'henry2', -30);
  addOp(ch('palsace'), 'philip2', -20);
}

function wed(a, b, silent){
  const A = ch(a), B = ch(b);
  A.sp = B.id; B.sp = A.id;
  if(!silent) logIt('court', `${fullName(A)} and ${fullName(B)} are wed.`);
}
function addOp(c, tgt, d){
  const id = typeof tgt==='string' ? tgt : tgt.id;
  c.op[id] = clamp((c.op[id]||0) + d, -100, 100);
}
function opinion(a, b){
  if(!a || !b) return 0;
  let v = a.op[b.id] || 0;
  for(const t of b.tr) v += (TRAITS[t].opn||0);
  for(const t of a.tr) if(b.tr.includes(t)) v += 8; else if(b.tr.includes(TRAITS[t].opp)) v -= 10;
  if(a.dyn && a.dyn === b.dyn) v += 15;
  if(a.sp === b.id) v += 20;
  if(a.seat && rl(a.realm) && rl(a.realm).ruler === b.id) v += 15;
  /* an excommunicate is shunned by all Christendom */
  const bR = Object.values(G.realms).find(r=>!r.dead && r.ruler===b.id);
  if(bR && bR.excomm) v -= 25;
  return clamp(Math.round(v), -100, 100);
}
function addAlliance(ra, rb, via){
  if(allianceBetween(ra,rb)) return;
  G.alliances.push({a:ra, b:rb, via});
}
function allianceBetween(ra, rb){
  return G.alliances.find(x=>(x.a===ra&&x.b===rb)||(x.a===rb&&x.b===ra));
}
function breakAlliance(ra, rb){
  G.alliances = G.alliances.filter(x=>!((x.a===ra&&x.b===rb)||(x.a===rb&&x.b===ra)));
}
function aiFillCouncil(rid){
  const R_ = rl(rid);
  const court = Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&c.id!==R_.ruler&&age(c)>=16);
  const seats = [['marshal','mar'],['steward','ste'],['spymaster','int'],['chaplain','dip']];
  for(const [seat, sk] of seats){
    if(R_.council[seat] && alive(ch(R_.council[seat]))) continue;
    let best=null, bv=-1;
    for(const c of court){ if(c.seat) continue; const v=skill(c,sk); if(v>bv){bv=v;best=c;} }
    if(best){ best.seat = seat; R_.council[seat] = best.id; }
  }
}
function councilBonus(rid, seat){
  const cid = rl(rid).council[seat];
  if(!cid || !alive(ch(cid))) return 0;
  return skill(ch(cid), {marshal:'mar',steward:'ste',spymaster:'int',chaplain:'dip'}[seat]);
}

function logIt(cls, txt){
  G.log.push({y:G.year, s:G.season, cls, txt});
  if(G.log.length>400) G.log.shift();
}
function chron(txt){ G.chron.push({y:G.year, txt}); }

<script>
/* ============ Life, death & succession ============ */
function deathRisk(c){
  const a = age(c);
  let p = a<2 ? .04 : a<16 ? .006 : a<50 ? .008 : a<60 ? .035 : a<70 ? .09 : a<80 ? .18 : .32;
  if(c.tr.includes('sickly')) p *= 2.2;
  if(c.tr.includes('robust')) p *= 0.45;
  if(G.plague) p *= 2.4; /* the Great Mortality spares no rank */
  return p/4; /* checked each season */
}
function inheritedTraits(fa, mo){
  const pool = [...(fa?fa.tr:[]), ...(mo?mo.tr:[])];
  const out = [];
  if(pool.length && chance(.55)){
    const t = pick(pool);
    out.push(t);
  }
  while(out.length < 2){
    const t = pick(Object.keys(TRAITS));
    if(!out.includes(t) && !out.includes(TRAITS[t].opp)) out.push(t);
  }
  return out;
}
function tryBirths(){
  for(const c of Object.values(G.chars)){
    if(!alive(c) || c.sex!=='f' || !c.sp) continue;
    const h = ch(c.sp);
    if(!alive(h)) continue;
    const a = age(c);
    if(a<16 || a>45) continue;
    let p = .055;
    if(c.tr.includes('lustful')||h.tr.includes('lustful')) p += .025;
    if(c.tr.includes('chaste')||h.tr.includes('chaste')) p -= .03;
    const kids = Object.values(G.chars).filter(k=>k.mo===c.id).length;
    p *= Math.max(.25, 1 - kids*.13);
    if(!chance(p)) continue;
    const sex = chance(.51)?'m':'f';
    const kid = mkChar({ nm:pick(NAMES[h.cult][sex]), dyn:h.dyn, realm:h.realm, cult:h.cult, sex,
      by:G.year, fa:h.id, mo:c.id, tr:inheritedTraits(h,c),
      sk:{dip:ri(1,5),mar:ri(1,5),int:ri(1,5),ste:ri(1,5)} });
    const rel = (rl(h.realm) && rl(h.realm).ruler===h.id);
    if(rel || isPlayer(h.realm) || isPlayer(c.realm))
      logIt('court', `A ${sex==='m'?'son':'daughter'}, ${kid.nm}, is born to ${fullName(h)} and ${fullName(c)}.`);
    if(rel && isPlayer(h.realm)) chron(`In this year a ${sex==='m'?'son':'daughter'} was born to the ${sex==='m'?'king':'king'}'s house and given the name ${kid.nm}, and there was feasting.`);
    if(chance(.04) && alive(c)){ killChar(c, 'died in childbed'); }
  }
}
function heirLine(c, seen){
  /* recursive primogeniture: sons (eldest first) then their lines, then daughters */
  const out = [];
  const kids = Object.values(G.chars).filter(k=>k.fa===c.id||k.mo===c.id);
  kids.sort((a,b)=> (a.sex===b.sex? a.by-b.by : (a.sex==='m'?-1:1)));
  for(const k of kids){
    if(seen.has(k.id)) continue;
    seen.add(k.id);
    if(alive(k)) out.push(k);
    out.push(...heirLine(k, seen));
  }
  return out;
}
function heirOf(rid){
  const r = ruler(rid);
  if(!r) return null;
  /* elective law: the magnates choose the ablest adult of the blood */
  if(rl(rid).law==='elective'){
    const cands = Object.values(G.chars).filter(c=>alive(c)&&c.dyn&&c.dyn===r.dyn&&c.id!==r.id&&c.sex==='m'&&age(c)>=16);
    if(cands.length){
      const court = Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&c.id!==r.id);
      const score = c => skill(c,'dip')+skill(c,'mar')+skill(c,'ste')+skill(c,'int')
        + (court.length ? court.reduce((s,x)=>s+opinion(x,c),0)/court.length/4 : 0);
      return cands.sort((a,b)=>score(b)-score(a))[0];
    }
  }
  const seen = new Set([r.id]);
  let line = heirLine(r, seen);
  let anc = r;
  for(let up=0; up<3 && !line.length; up++){
    if(!anc.fa || !ch(anc.fa)) break;
    anc = ch(anc.fa);
    if(!seen.has(anc.id)){ seen.add(anc.id); if(alive(anc)) line.push(anc); }
    line.push(...heirLine(anc, seen));
  }
  if(!line.length){
    line = Object.values(G.chars).filter(c=>alive(c)&&c.dyn&&c.dyn===r.dyn&&c.id!==r.id)
      .sort((a,b)=>a.by-b.by);
  }
  return line[0] || null;
}
function killChar(c, causeTxt){
  if(c.dead) return;
  c.dead = G.year;
  const spouse = c.sp ? ch(c.sp) : null;
  if(spouse){ spouse.sp = null; c.sp = null; }
  /* personal alliances die with the person */
  const lapsed = G.alliances.filter(al=>al.via===c.id);
  for(const al of lapsed){
    logIt('court', `The alliance of ${rl(al.a).n} and ${rl(al.b).n} dies with ${fullName(c)}.`);
  }
  G.alliances = G.alliances.filter(al=>al.via!==c.id);
  if(c.seat){
    const R_ = rl(c.realm);
    if(R_ && R_.council[c.seat]===c.id) R_.council[c.seat]=null;
    c.seat = null;
  }
  const R_ = Object.values(G.realms).find(r=>!r.dead && r.ruler===c.id);
  const important = R_ || isPlayer(c.realm) || c.claims.length;
  if(important) logIt('court', `${title(c)} ${fullName(c)} ${causeTxt||'has died'}, aged ${age(c)}.`);
  if(R_) rulerDied(R_, c, causeTxt);
  else if(isPlayer(c.realm) && ruler(G.player) && c.dyn===ruler(G.player).dyn)
    chron(`In this year died ${fullName(c)} of the royal house, aged ${age(c)}, ${causeTxt||'of a sickness'}.`);
  /* a war whose claimant lies dead (and unreplaced) has no cause left */
  for(const w of [...G.wars])
    if(w.cb.type==='throne' && (!ch(w.claimant) || ch(w.claimant).dead))
      endWar(w, 'white', `The claim died with ${fullName(c)}; the armies go home.`);
  if(G.sel && G.sel.t==='char' && G.sel.id===c.id) G.sel=null;
}
function rulerDied(R_, c, causeTxt){
  chron(`In this year ${causeTxt&&causeTxt.includes('battle')?'fell':'died'} ${title(c)} ${fullName(c)} of ${R_.n}, aged ${age(c)}, ${causeTxt||'in his bed'} — ${c.tr.includes('cruel')?'and few wept':c.tr.includes('kind')?'and the poor wept in the streets':'and the realm held its breath'}.`);
  /* levy desertion: the war was his, not yet his heir's */
  for(const a of G.armies){ if(a.realm===R_.id){ a.levies = Math.floor(a.levies*.8); } }
  /* claims are personal: each passes to the heir only imperfectly */
  const h = heirOf(R_.id);
  const inherited = h ? c.claims.filter(()=>chance(.6)) : [];
  for(const w of [...G.wars]){
    if(w.cb.type==='throne' && w.claimant===c.id){
      if(h && inherited.includes(w.cb.target)){
        w.claimant = h.id;
        logIt('war', `${fullName(h)} takes up the dead ${c.sex==='m'?'king':'queen'}'s claim, and the war goes on.`);
      } else {
        endWar(w, 'white', `The claim died with ${fullName(c)}; the armies go home.`);
      }
    }
  }
  if(h) h.claims = [...new Set([...h.claims, ...inherited])];
  if(!h){
    if(isPlayer(R_.id)){ gameOver(false, `The line of ${c.dyn} is ended. ${fullName(c)} died without an heir, and strangers now sit in your halls.`); return; }
    const court = Object.values(G.chars).filter(x=>alive(x)&&x.realm===R_.id&&x.sex==='m'&&age(x)>=16);
    const nr = court.sort((a,b)=>skill(b,'dip')+skill(b,'mar')-skill(a,'dip')-skill(a,'mar'))[0] || mkCourtier(R_.id);
    nr.dyn = nr.dyn || nr.nm;
    R_.ruler = nr.id; R_.leg = clamp(R_.leg-25, 0, 100);
    logIt('court', `The house of ${c.dyn} is extinct in ${R_.n}; the magnates raise ${fullName(nr)} in its place.`);
    return;
  }
  R_.ruler = h.id;
  h.realm = R_.id;
  R_.leg = clamp(R_.leg - 15, 0, 100);
  const minor = age(h) < 16;
  if(isPlayer(R_.id)){
    G.regency = minor;
    queueEvent({
      title:'The King is Dead',
      text:`<span class="dropcap">${fullName(c)} is dead — ${causeTxt||'the fever took him in the night'}. The crown passes to ${fullName(h)}, ${age(h)} years of age.` +
        (minor?` A child cannot rule alone: a regency council will govern until the ${h.sex==='m'?'young king':'young queen'} comes of age. The realm's enemies know this.`:
        ` The magnates swear their oaths — some more slowly than others.`) +
        `</span><br><br><em>You now play as ${fullName(h)}. Legitimacy has fallen; disappointed kin may press their own claims.</em>`,
      choices:[{t:'The '+(h.sex==='m'?'king':'queen')+' is dead. Long live the '+(h.sex==='m'?'king':'queen')+'.', fx:()=>{}}]
    });
  } else if(minor){
    logIt('court', `A child of ${age(h)} now wears the crown of ${R_.n}. Wolves take note.`);
  }
  /* alliances of the old ruler's realm are tested by the succession */
  for(const al of [...G.alliances]){
    if(al.a!==R_.id && al.b!==R_.id) continue;
    const other = al.a===R_.id ? al.b : al.a;
    const or = ruler(other);
    if(or && opinion(or, h) < 10 && chance(.5)){
      breakAlliance(al.a, al.b);
      logIt('court', `${rl(other).n} does not renew its oaths to the new ruler of ${R_.n}; the alliance lapses.`);
    }
  }
  /* a passed-over ambitious kinsman may take up a claim */
  const rivals = Object.values(G.chars).filter(x=>alive(x)&&x.dyn===h.dyn&&x.id!==h.id&&x.sex==='m'&&age(x)>=16&&x.tr.includes('ambitious'));
  for(const rv of rivals){
    if(chance(.35)){
      rv.claims = [...new Set([...rv.claims, R_.id])];
      addOp(rv, h.id, -40);
      logIt('plot', `${fullName(rv)} lets it be known that the succession in ${R_.n} was… irregular.`);
    }
  }
  aiFillCouncil(R_.id);
}
function seasonDeaths(){
  for(const c of Object.values(G.chars)){
    if(!alive(c)) continue;
    if(chance(deathRisk(c))){
      const cause = age(c)>60 ? 'died of old age' : pick(['died of a fever','died of the flux','died of a sudden sickness','was thrown from a horse and died']);
      killChar(c, cause);
    }
  }
}

/* ============ Diplomacy ============ */
function marriageCandidates(rid){
  return Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&!c.sp&&age(c)>=16&&age(c)<=(c.sex==='f'?42:60)&&c.dyn);
}
function proposeMarriage(myChar, theirChar){
  const myR = rl(G.player), tR = rl(theirChar.realm);
  const tr = ruler(theirChar.realm);
  let acc = opinion(tr, ruler(G.player)) + (myR.prs - tR.prs)/8 + (myR.rank==='kingdom'?15:0);
  if(theirChar.id===tr.id) acc -= 20;
  acc += skill(ruler(G.player),'dip')*3;
  if(acc > ri(-10, 40)){
    doMarriage(myChar, theirChar);
    return true;
  }
  addOp(tr, ruler(G.player).id, -5);
  return false;
}
function doMarriage(a, b){
  wed(a.id, b.id);
  const ra = a.realm, rb = b.realm;
  /* the bride joins the groom's court */
  const groom = a.sex==='m'?a:b, bride = a.sex==='m'?b:a;
  bride.realm = groom.realm;
  if(bride.seat){ const R0=rl(rb===bride.realm?ra:rb); }
  if(ra!==rb){
    addAlliance(ra, rb, bride.id);
    addOp(ruler(ra), ruler(rb).id, 15); addOp(ruler(rb), ruler(ra).id, 15);
    logIt('court', `${rl(ra).n} and ${rl(rb).n} are bound by the marriage of ${fullName(groom)} and ${fullName(bride)}.`);
    if(isPlayer(ra)||isPlayer(rb)) chron(`In this year was made a marriage between the houses of ${rl(ra).n} and ${rl(rb).n}, and with it an alliance sworn on holy relics.`);
  }
}

<script>
/* ============ War ============ */
function warBetween(a,b){ return G.wars.find(w=>w.sides && ((w.sides.a.includes(a)&&w.sides.b.includes(b))||(w.sides.a.includes(b)&&w.sides.b.includes(a)))); }
function hostile(a,b){ return a!==b && !!warBetween(a,b); }
function atWar(rid){ return G.wars.filter(w=>w.sides.a.includes(rid)||w.sides.b.includes(rid)); }
function truceBetween(a,b){ return G.truces.find(t=>((t.a===a&&t.b===b)||(t.a===b&&t.b===a)) && t.until > G.year + G.season/4); }

function declareWar(att, def, cb, claimantId){
  const w = { id:'w'+(++G.wid), att, def, sides:{a:[att], b:[def]}, cb, claimant:claimantId||rl(att).ruler,
    bp:0, started:G.year };
  G.wars.push(w);
  rl(att).leg = clamp(rl(att).leg + (cb.type==='none' ? -20 : 0), 0, 100);
  addOp(ruler(def), ruler(att).id, -50);
  const cbTxt = cb.type==='throne' ? `pressing the claim of ${fullName(ch(w.claimant))} to the throne of ${rl(cb.target).n}` :
    cb.type==='province' ? `claiming the province of ${PROVDATA[cb.target].n}` : 'without just cause, God forgive them';
  logIt('war', `⚔ ${rl(att).n} declares war on ${rl(def).n}, ${cbTxt}.`);
  chron(`In this year ${title(ruler(att))} ${fullName(ruler(att))} raised his banners against ${rl(def).n}, ${cbTxt}.`);
  /* call allies */
  for(const [rid, side] of [[att,'a'],[def,'b']]){
    for(const al of G.alliances){
      if(al.a!==rid && al.b!==rid) continue;
      const other = al.a===rid ? al.b : al.a;
      if(w.sides.a.includes(other)||w.sides.b.includes(other)) continue;
      const or = ruler(other);
      if(isPlayer(other)){
        queueEvent({ title:'A Call to Arms',
          text:`${fullName(ruler(rid))} of ${rl(rid).n} calls on your alliance: war has come between ${rl(att).n} and ${rl(def).n}, and your banners are asked for the ${side==='a'?'attack':'defence'}.`,
          choices:[
            {t:'Honor the alliance — we march.', fx:()=>{ w.sides[side].push(other); logIt('war',`${rl(other).n} joins the war.`); }},
            {t:'Refuse. (The alliance breaks; your word is cheapened)', fx:()=>{ breakAlliance(al.a,al.b); rl(other).prs-=25; addOp(or? ruler(rid):null, or?rl(other).ruler:null, 0); addOp(ruler(rid), rl(other).ruler, -40); }},
          ]});
      } else if(or && (opinion(or, ruler(rid)) > -10 || side==='b')){
        w.sides[side].push(other);
        logIt('war', `${rl(other).n} honors its alliance and joins the war.`);
      } else {
        breakAlliance(al.a, al.b);
        logIt('court', `${rl(other).n} finds reasons to stay home; the alliance lapses.`);
      }
    }
  }
}
function raiseArmy(rid, provId){
  const own = realmProvs(rid).filter(p=>!pv(p).occ);
  let levies = 0;
  for(const p of own) levies += levyOf(p);
  levies = Math.floor(levies * (0.85 + councilBonus(rid,'marshal')*0.02));
  const existing = G.armies.find(a=>a.realm===rid && a.prov===provId);
  if(existing){ existing.levies += levies; existing.retinue += rl(rid).retinue; }
  else G.armies.push({ id:'a'+(++G.aid), realm:rid, prov:provId, levies, retinue:rl(rid).retinue,
    mercs:0, cmdr:bestCommander(rid), siege:0, moved:true });
  rl(rid).retinue = 0;
  logIt('war', `${rl(rid).n} musters ${fmtN(levies)} levies at ${PROVDATA[provId].n}.`);
}
function bestCommander(rid){
  const R_ = rl(rid);
  let best = R_.ruler, bv = skill(ruler(rid),'mar');
  const m = R_.council.marshal;
  if(m && alive(ch(m)) && skill(ch(m),'mar')>bv){ best = m; bv = skill(ch(m),'mar'); }
  return best;
}
function armySize(a){ return a.levies + a.retinue + a.mercs; }
function disbandArmy(a){
  rl(a.realm).retinue = Math.min(600, (rl(a.realm).retinue||0) + a.retinue);
  G.armies = G.armies.filter(x=>x!==a);
}
function enemiesIn(provId, rid){
  return G.armies.filter(a=>a.prov===provId && hostile(a.realm, rid));
}
function moveArmy(a, dest, naval){
  if(a.moved) return false;
  const R_ = rl(a.realm);
  if(naval){
    if(R_.gold < 15) return false;
    R_.gold -= 15;
    const stormP = G.season===2 ? .25 : G.season===3 ? .4 : .1;
    if(chance(stormP)){
      const lost = Math.floor(armySize(a)*.25);
      a.levies = Math.max(0, a.levies - lost);
      logIt('war', `Storms scatter the ${rl(a.realm).n} fleet; ${fmtN(lost)} men feed the fishes.`);
      if(isPlayer(a.realm)) chron(`In this year the sea rose against the king's ships and many good men were drowned unshriven.`);
    }
  }
  a.prov = dest; a.moved = true; a.siege = 0;
  const foes = enemiesIn(dest, a.realm);
  if(foes.length){ battle(a, foes[0], dest); }
  return true;
}
function terrainMod(provId, side){
  const t = TERRAIN[PROVDATA[provId].t];
  return side==='atk' ? t.atk : t.def;
}
function battle(atk, def, provId){
  const w = warBetween(atk.realm, def.realm);
  const roll = ()=>ri(2,12)/10 + .5; /* 0.7 .. 1.7 */
  const line = (a, side, r)=>{
    const cm = alive(ch(a.cmdr)) ? skill(ch(a.cmdr),'mar') : 3;
    const tm = terrainMod(provId, side);
    return { n:armySize(a), cm, tm, r, str: armySize(a) * (1+cm*.06) * tm * r };
  };
  const ra = roll(), rd = roll();
  const A = line(atk,'atk',ra), D = line(def,'def',rd);
  const atkWins = A.str > D.str;
  const [wn, ls, wnA, lsA] = atkWins ? [A,D,atk,def] : [D,A,def,atk];
  const lsCas = Math.min(.9, .28 + (wn.str/ls.str -1)*.18), wnCas = .12;
  const casOf = (army, frac)=>{
    const total = Math.floor(armySize(army)*frac);
    let rem = total;
    const m = Math.min(army.mercs, Math.floor(rem*.4)); army.mercs-=m; rem-=m;
    const l = Math.min(army.levies, rem); army.levies-=l; rem-=l;
    army.retinue = Math.max(0, army.retinue-rem);
    return total;
  };
  const wc = casOf(wnA, wnCas), lc = casOf(lsA, lsCas);
  if(w){ w.bp = clamp(w.bp + (atkWins?1:-1)*Math.min(25, 8+Math.floor(lc/120)), -100, 100); }
  const report =
`${rl(atk.realm).n.toUpperCase()} attacks ${rl(def.realm).n.toUpperCase()} at ${PROVDATA[provId].n} (${TERRAIN[PROVDATA[provId].t].n})
Attacker: ${fmtN(A.n)} men x (1+${A.cm} Martial x .06) x ${A.tm} terrain x ${A.r.toFixed(2)} fortune = ${Math.round(A.str)}
Defender: ${fmtN(D.n)} men x (1+${D.cm} Martial x .06) x ${D.tm} terrain x ${D.r.toFixed(2)} fortune = ${Math.round(D.str)}
${rl(wnA.realm).n} holds the field. Losses — victor ${fmtN(wc)}, vanquished ${fmtN(lc)}.`;
  logIt('war', `⚔ Battle of ${PROVDATA[provId].n}: ${rl(wnA.realm).n} defeats ${rl(lsA.realm).n} (${fmtN(lc)} slain).`);
  /* the loser retreats, or dies */
  let cmdrNote = '';
  const lsCmdr = ch(lsA.cmdr);
  if(alive(lsCmdr) && chance(.14)){
    killChar(lsCmdr, 'was slain in battle at '+PROVDATA[provId].n);
    cmdrNote = `\n${fullName(lsCmdr)} fell in the rout.`;
  }
  if(armySize(lsA) < 150){
    G.armies = G.armies.filter(x=>x!==lsA);
    cmdrNote += `\nThe ${rl(lsA.realm).n} host is destroyed utterly.`;
  } else {
    const home = realmProvs(lsA.realm).find(p=>!enemiesIn(p, lsA.realm).length) || lsA.prov;
    const adjSafe = (PROVDATA[lsA.prov].adj||[]).find(p=>pv(p).r===lsA.realm && !enemiesIn(p,lsA.realm).length);
    lsA.prov = adjSafe || home; lsA.siege = 0; lsA.moved = true;
  }
  const involved = isPlayer(atk.realm)||isPlayer(def.realm)||
    (w && (w.sides.a.includes(G.player)||w.sides.b.includes(G.player)));
  if(involved){
    UI.modal('Battle of '+PROVDATA[provId].n,
      `<div class="btMath">${esc(report+cmdrNote)}</div>` +
      (wnA.realm===G.player||w&&w.sides[atkWins?'a':'b'].includes(G.player) ?
        `<em>God favored the right. War score shifts in your favor.</em>` :
        `<em>A dark day. Pray the chronicle is kind.</em>`),
      [{t:'So be it', fx:()=>{}}]);
    if(isPlayer(wnA.realm)) chron(`In this year our men met the host of ${rl(lsA.realm).n} at ${PROVDATA[provId].n} and by God's grace broke them, ${fmtN(lc)} of the foe being slain.`);
    if(isPlayer(lsA.realm)) chron(`In this year our host was broken at ${PROVDATA[provId].n} by ${rl(wnA.realm).n}, and ${fmtN(lc)} men did not come home. A bitter year.`);
  }
}
function warScore(w){
  /* occupation by ANY enemy of the owner counts: a realm under rival boots is losing either way */
  let s = w.bp;
  for(const p of Object.keys(G.provinces)){
    const pr = pv(p);
    if(pr.occ && w.sides.b.includes(pr.r) && hostile(pr.occ, pr.r)) s += (p===rl(w.def).cap? 25:10);
    if(pr.occ && w.sides.a.includes(pr.r) && hostile(pr.occ, pr.r)) s -= (p===rl(w.att).cap? 25:10);
  }
  const defP = realmProvs(w.def), attP = realmProvs(w.att);
  if(defP.length && defP.every(p=>pv(p).occ && hostile(pv(p).occ, w.def))) return 100;
  if(attP.length && attP.every(p=>pv(p).occ && hostile(pv(p).occ, w.att))) return -100;
  return clamp(s, -100, 100);
}
function endWar(w, result, msg){
  G.wars = G.wars.filter(x=>x!==w);
  for(const p of Object.keys(G.provinces)){
    const pr = pv(p);
    if(pr.occ && (w.sides.a.includes(pr.occ)||w.sides.b.includes(pr.occ))) pr.occ = null;
  }
  G.truces.push({a:w.att, b:w.def, until:G.year+5});
  logIt('war', `☮ Peace between ${rl(w.att).n} and ${rl(w.def).n}. ${msg||''}`);
  if(w.sides.a.includes(G.player)||w.sides.b.includes(G.player))
    chron(`In this year the war with ${rl(w.sides.a.includes(G.player)?w.def:w.att).n} was ended. ${result==='white'?'Neither side could claim God’s verdict.':''}`);
}
function enforceDemands(w, winnerSide){
  const [wr, lr] = winnerSide==='a' ? [w.att, w.def] : [w.def, w.att];
  if(winnerSide==='a' && w.cb.type==='throne'){
    conquerRealm(wr, w.cb.target, w.claimant);
    endWar(w, 'conquest', `The crown of ${rl(w.cb.target).n} changes heads.`);
  } else if(winnerSide==='a' && w.cb.type==='province'){
    transferProv(w.cb.target, wr);
    endWar(w, 'cession', `${PROVDATA[w.cb.target].n} is ceded to ${rl(wr).n}.`);
  } else {
    const gold = Math.min(rl(lr).gold, 40);
    rl(lr).gold -= gold; rl(wr).gold += gold;
    rl(wr).prs += 30; rl(lr).prs = Math.max(0, rl(lr).prs-20);
    rl(lr).leg = clamp(rl(lr).leg-10,0,100);
    if(w.cb.type==='throne'){ const cl = ch(w.claimant); if(cl) cl.claims = cl.claims.filter(x=>x!==w.cb.target); }
    endWar(w, 'defended', `${rl(wr).n} takes ${gold} gold in tribute and much honor.`);
  }
}
function transferProv(p, toRealm){
  const from = pv(p).r;
  pv(p).r = toRealm; pv(p).occ = null;
  logIt('war', `${PROVDATA[p].n} passes from ${rl(from).n} to ${rl(toRealm).n}.`);
  if(rl(from) && realmProvs(from).length===0) realmFalls(from, toRealm);
}
function conquerRealm(winner, targetRealm, claimantId){
  const provs = realmProvs(targetRealm);
  for(const p of provs){ pv(p).r = winner; pv(p).occ = null; }
  const cl = ch(claimantId);
  chron(`In this year was ${rl(targetRealm).n.toUpperCase()} CONQUERED, and ${cl?fullName(cl):'the victor'} took the crown by right of blood and iron. Let none say God does not judge by battle.`);
  realmFalls(targetRealm, winner);
  rl(winner).prs += 150; rl(winner).leg = clamp(rl(winner).leg+15,0,100);
  if(cl && cl.realm!==winner) cl.realm = winner;
  if(isPlayer(winner)) queueEvent({ title:'A Crown Taken',
    text:`<span class="dropcap">The war is won. The realm of ${rl(targetRealm).n} kneels — its lands, its levies, its treasury now answer to your house. The chroniclers are already arguing about what to call you.</span>`,
    choices:[{t:'God wills it.', fx:()=>{ rl(winner).gold += 30; }}]});
}
function realmFalls(rid, toRealm){
  const R_ = rl(rid);
  R_.dead = G.year;
  for(const c of Object.values(G.chars)) if(alive(c)&&c.realm===rid){ c.realm = toRealm; c.seat = null; }
  R_.council = {marshal:null,steward:null,spymaster:null,chaplain:null};
  for(const w of [...G.wars]){
    if(w.att===rid||w.def===rid){ endWar(w,'white', `${R_.n} is no more.`); continue; }
    w.sides.a = w.sides.a.filter(x=>x!==rid); w.sides.b = w.sides.b.filter(x=>x!==rid);
  }
  G.armies = G.armies.filter(a=>a.realm!==rid);
  G.alliances = G.alliances.filter(al=>al.a!==rid&&al.b!==rid);
  logIt('war', `The realm of ${R_.n} is extinguished.`);
  if(isPlayer(rid)) gameOver(false, `Your last province is lost. The house of ${ruler(rid)?ruler(rid).dyn:'your fathers'} passes into the footnotes of other men's chronicles.`);
}
function warUpkeep(){
  for(const a of [...G.armies]){
    const R_ = rl(a.realm);
    const cost = Math.ceil(a.levies/350) + Math.ceil(a.mercs/160);
    R_.gold -= cost;
    if(R_.gold < 0){
      const des = Math.floor(a.levies*.15);
      a.levies -= des; R_.gold = 0;
      if(des>0) logIt('war', `Unpaid, ${fmtN(des)} ${rl(a.realm).n} levies slip away home.`);
    }
    /* attrition in autumn & winter */
    if(G.season>=2){
      const own = pv(a.prov).r===a.realm && !pv(a.prov).occ;
      let rate = (G.season===2? .08 : .22) * (own? .4 : 1);
      const lost = Math.floor(armySize(a)*rate);
      if(lost>40){
        a.levies = Math.max(0, a.levies-lost);
        if(isPlayer(a.realm)) logIt('war', `${G.season===2?'Autumn rains':'Winter'} claim ${fmtN(lost)} of your men in the field.`);
      }
    }
    if(armySize(a)<80){ G.armies = G.armies.filter(x=>x!==a); logIt('war', `The remnant of the ${rl(a.realm).n} host disbands.`); }
  }
}
function siegeTick(){
  for(const a of G.armies){
    const pr = pv(a.prov);
    const owner = pr.occ || pr.r;
    if(!hostile(a.realm, pr.r) || owner===a.realm) { a.siege=0; continue; }
    if(enemiesIn(a.prov, a.realm).length) continue;
    if(pr.occ && !hostile(a.realm, pr.r)) continue;
    const castle = pr.bld==='castle' ? 1 : 0;
    a.siege += 30 + skill(ch(a.cmdr)||ruler(a.realm),'mar')*2 + ri(0,15) - castle*22;
    if(a.siege >= 100){
      pr.occ = a.realm; a.siege = 0;
      rl(a.realm).gold += Math.floor(pr.dev*1.5);
      logIt('war', `🔥 ${PROVDATA[a.prov].n} falls to ${rl(a.realm).n} after siege.`);
      if(isPlayer(a.realm)) chron(`In this year ${PROVDATA[a.prov].n} was taken after siege, and the town paid well for its stubbornness.`);
      if(isPlayer(pr.r)) chron(`In this year the enemy took ${PROVDATA[a.prov].n} from us by siege, God's judgment on our sins.`);
    }
  }
}
function checkWarEnds(){
  for(const w of [...G.wars]){
    const s = warScore(w);
    /* AI-only wars settle themselves */
    const pInv = w.sides.a.includes(G.player)||w.sides.b.includes(G.player);
    if(!pInv){
      if(s>=70) enforceDemands(w,'a');
      else if(s<=-70) enforceDemands(w,'b');
      else if(G.year - w.started >= 6) endWar(w,'white','Both realms are bled white.');
      continue;
    }
    /* AI offers terms to the player */
    const playerA = w.sides.a.includes(G.player);
    const aiLosing = playerA ? s>=60 : s<=-60;
    const aiWinning = playerA ? s<=-65 : s>=65;
    /* a realm wholly occupied cannot refuse forever */
    const aiTotal = playerA ? s===-100 : s===100;
    if(aiTotal){
      w.doom = (w.doom||0)+1;
      if(w.doom>=4){
        queueEvent({ title:'The Realm Submits',
          text:`Every castle is taken, every shire under the enemy's law. Whatever you say in your hall, the realm itself has surrendered — the magnates treat with the invader over your head.`,
          choices:[{t:'So falls the house.', fx:()=>{}}]});
        enforceDemands(w, playerA?'b':'a');
        continue;
      }
    } else w.doom = 0;
    if(aiLosing && !w.offered){
      w.offered = true;
      const foe = playerA ? w.def : w.att;
      queueEvent({ title:'They Sue for Peace',
        text:`Envoys arrive from ${rl(foe).n} under a white banner. The war goes badly for them, and they know it. They offer to concede your full demands.`,
        choices:[
          {t:'Accept their surrender.', fx:()=>enforceDemands(w, playerA?'a':'b')},
          {t:'No. Grind them into the mud. (war continues)', fx:()=>{ rl(G.player).leg=clamp(rl(G.player).leg-5,0,100); addOp(ruler(foe), rl(G.player).ruler, -20); }},
        ]});
    }
    if(aiWinning && !w.demanded){
      w.demanded = true;
      const foe = playerA ? w.def : w.att;
      const isThrone = w.cb.type==='throne' && !playerA;
      queueEvent({ title:'Terms, or the Sword',
        text:`Envoys from ${rl(foe).n} bring hard words: yield now — ${isThrone?'the crown itself':'gold, honor, and their demands'} — or they will take it over your corpse.`,
        choices:[
          {t:'Yield. End this war on their terms.', fx:()=>enforceDemands(w, playerA?'b':'a')},
          {t:'Never. We fight on.', fx:()=>{}},
        ]});
    }
  }
}
</script>
<script>
/* ============ Intrigue ============ */
function startPlot(plotterId, type, targetId, benefRealm){
  const p = { id:'p'+(++G.pid), plotter:plotterId, type, target:targetId, benef:benefRealm||ch(plotterId).realm,
    progress:0, backers:[], exposed:false };
  G.plots.push(p);
  return p;
}
function plotPower(p){
  const pl = ch(p.plotter);
  if(!alive(pl)) return 0;
  let pow = 10 + skill(pl,'int')*8;
  for(const b of p.backers){ const c=ch(b); if(alive(c)) pow += skill(c,'int')*4; }
  return pow;
}
function plotTargetName(p){
  return (p.type==='defection'||p.type==='fabricate') ? PROVDATA[p.target].n : (ch(p.target)?fullName(ch(p.target)):'?');
}
function plotTick(){
  for(const p of [...G.plots]){
    const pl = ch(p.plotter);
    if(!alive(pl) || (p.type!=='defection' && p.type!=='fabricate' && !alive(ch(p.target)))){ G.plots = G.plots.filter(x=>x!==p); continue; }
    /* recruit backers */
    if(p.backers.length<3 && p.type!=='slander' && p.type!=='fabricate'){
      const tRealm = (p.type==='defection'||p.type==='fabricate') ? pv(p.target).r : ch(p.target).realm;
      const pool = Object.values(G.chars).filter(c=>alive(c)&&c.realm===tRealm&&c.id!==p.plotter&&!p.backers.includes(c.id)
        && (p.type==='defection' || opinion(c, ch(p.target)) < -15)
        && (c.tr.includes('ambitious')||c.tr.includes('deceitful')||c.tr.includes('greedy')));
      if(pool.length && chance(.35)) p.backers.push(pick(pool).id);
    }
    p.progress += plotPower(p)/8 + ri(0,6);
    /* discovery */
    const victimRealm = (p.type==='defection'||p.type==='fabricate') ? pv(p.target).r : ch(p.target).realm;
    if(victimRealm && rl(victimRealm) && !rl(victimRealm).dead){
      const spy = councilBonus(victimRealm,'spymaster');
      const discP = .04 + spy*.022 - skill(pl,'int')*.012 + p.backers.length*.02;
      if(chance(Math.max(.02, discP))){
        plotDiscovered(p, victimRealm);
        continue;
      }
    }
    if(p.progress >= 100) resolvePlot(p);
  }
}
function plotDiscovered(p, victimRealm){
  G.plots = G.plots.filter(x=>x!==p);
  const pl = ch(p.plotter);
  if(p.mine && victimRealm!==G.player){
    /* player's own plot busted */
    rl(G.player).prs = Math.max(0, rl(G.player).prs-30);
    rl(G.player).leg = clamp(rl(G.player).leg-10,0,100);
    addOp(ruler(victimRealm), rl(G.player).ruler, -40);
    queueEvent({ title:'The Plot Is Blown',
      text:`Your scheme against ${plotTargetName(p)} has been dragged into daylight. ${rl(victimRealm).n} knows, the courts of Europe whisper, and your name is spat in two languages. <em>(-30 prestige, -10 legitimacy)</em>`,
      choices:[{t:'Deny everything.', fx:()=>{}}]});
    return;
  }
  if(isPlayer(victimRealm)){
    const inRealm = pl.realm===G.player;
    queueEvent({ title:'A Plot Uncovered',
      text:`Your spymaster comes at a late hour. <b>${fullName(pl)}</b> has been plotting <b>${p.type==='murder'?'the murder of':'against'} ${plotTargetName(p)}</b>${p.backers.length?`, with ${p.backers.length} backer${p.backers.length>1?'s':''} in the shadows`:''}. The proofs are good.`,
      choices:[
        inRealm ? {t:'Arrest and imprison the wretch.', fx:()=>{ imprison(pl); }} : null,
        inRealm ? {t:'Execute them. Let the head speak to the others. (-legitimacy, fear)', fx:()=>{
            killChar(pl,'was beheaded for treason'); rl(G.player).leg=clamp(rl(G.player).leg-8,0,100);
            for(const c of Object.values(G.chars)) if(alive(c)&&c.realm===G.player) addOp(c, rl(G.player).ruler, -8);
            chron(`In this year ${fullName(pl)} was put to death for treason, and the court learned silence.`);
          }} : null,
        {t:'Confront them privately. (they stop — and hate you)', fx:()=>{ addOp(pl, rl(G.player).ruler, -25); }},
        {t:'Watch, and say nothing. (the plot continues, but you know its shape)', fx:()=>{ p.exposed=true; G.plots.push(p); }},
      ].filter(Boolean)});
    return;
  }
  /* AI victim reacts */
  if(pl.realm===victimRealm && chance(.6)){ killChar(pl,'was executed for treason'); }
  else { addOp(ruler(victimRealm), pl.id, -60); logIt('plot', `A plot by ${fullName(pl)} against ${plotTargetName(p)} is uncovered in ${rl(victimRealm).n}.`); }
}
function imprison(c){
  c.prison = true; c.seat = null;
  const R_ = rl(c.realm);
  for(const s of Object.keys(R_.council)) if(R_.council[s]===c.id) R_.council[s]=null;
  logIt('plot', `${fullName(c)} is thrown in the dungeon.`);
}
function resolvePlot(p){
  G.plots = G.plots.filter(x=>x!==p);
  const pl = ch(p.plotter);
  if(p.type==='murder'){
    const t = ch(p.target);
    const guard = t.realm && rl(t.realm) ? councilBonus(t.realm,'spymaster') : 3;
    if(ri(0,100) < 55 + skill(pl,'int')*4 - guard*4){
      const cause = pick(['died suddenly at table — poison, the cooks swear it was not','was found dead at the foot of a stair','died in the night without mark or wound, and men crossed themselves','was set upon by "robbers" who took nothing']);
      logIt('plot', `† ${fullName(t)} ${cause}.`);
      if(isPlayer(pl.realm)) chron(`In this year ${fullName(t)} died most conveniently. The chronicler makes no accusation. The chronicler merely notes the convenience.`);
      killChar(t, cause);
      if(isPlayer(pl.realm)) rl(G.player).prs += 10;
    } else {
      logIt('plot', `An attempt on ${fullName(t)}'s life fails; the knife-man dies silent.`);
      if(isPlayer(t.realm)) queueEvent({ title:'A Knife in the Dark',
        text:`A killer was taken last night inside the walls, steel in hand, ${fullName(t)}'s chamber a corridor away. He died under question without naming his master. Someone paid well for your family's blood.`,
        choices:[{t:'Double the guard. Trust no one.', fx:()=>{}}]});
    }
  }
  if(p.type==='slander'){
    const t = ch(p.target);
    const R_ = rl(t.realm);
    if(R_){ R_.leg = clamp(R_.leg-12,0,100); R_.prs = Math.max(0, R_.prs-25); }
    for(const c of Object.values(G.chars)) if(alive(c)&&chance(.4)) addOp(c, t.id, -12);
    logIt('plot', `Vile songs about ${fullName(t)} are sung in three ports. Mud sticks.`);
    if(isPlayer(t.realm)) queueEvent({ title:'Poison in Every Ear',
      text:`A slander runs through the courts of Europe faster than any ship: verses about ${fullName(t)} — obscene, specific, and well-rhymed. Half of it is invented. The other half is worse. <em>(-12 legitimacy, -25 prestige)</em>`,
      choices:[{t:'Find me the poet.', fx:()=>{}}]});
  }
  if(p.type==='fabricate'){
    const owner = pv(p.target).r;
    if(owner === p.benef) return;
    const claimant = ruler(p.benef);
    if(claimant && !claimant.pclaims.includes(p.target)){
      claimant.pclaims.push(p.target);
      logIt('plot', `Monks of flexible conscience "discover" a charter: ${PROVDATA[p.target].n} rightfully belongs to ${rl(p.benef).n}.`);
      if(isPlayer(p.benef)) chron(`In this year came to light an old charter proving our right to ${PROVDATA[p.target].n}. The ink was old. The ink was very old. No further questions were taken.`);
    }
    return;
  }
  if(p.type==='defection'){
    const prov = pv(p.target);
    const from = prov.r;
    if(from===p.benef || !rl(p.benef) || rl(p.benef).dead) return;
    transferProv(p.target, p.benef);
    logIt('plot', `${PROVDATA[p.target].n} renounces ${rl(from).n} and gives its castles to ${rl(p.benef).n}.`);
    if(isPlayer(from)) queueEvent({ title:'Betrayal at '+PROVDATA[p.target].n,
      text:`The garrison commander of ${PROVDATA[p.target].n} has opened his gates to ${rl(p.benef).n} — bought, flattered, and promised. The province is lost without a blow struck. <em>Reclaiming it will take a war.</em>`,
      choices:[{t:'His name goes in the book.', fx:()=>{}}]});
    if(isPlayer(p.benef)) chron(`In this year ${PROVDATA[p.target].n} came over to us by quiet arrangement, which is the cheapest kind of conquest and the least sung.`);
  }
  if(p.type==='depose'){
    const t = ch(p.target);
    const R_ = Object.values(G.realms).find(r=>!r.dead&&r.ruler===t.id);
    if(!R_) return;
    const pow = plotPower(p), hold = R_.leg + skill(t,'mar')*3 + councilBonus(R_.id,'marshal')*2;
    if(isPlayer(R_.id)){
      queueEvent({ title:'The Realm Rises',
        text:`It breaks all at once: ${fullName(pl)} and ${p.backers.length} great men declare you unfit to rule and call the realm to arms. Steel decides now.<div class="btMath">Their power: ${pow}\nYour hold on the realm: ${Math.round(hold)} (legitimacy ${R_.leg} + martial + marshal)</div>`,
        choices:[
          {t:'Crush them.', fx:()=>{
            if(hold + ri(0,40) > pow + ri(0,40)){
              killChar(pl, 'was cut down in open rebellion');
              R_.leg = clamp(R_.leg+10,0,100); R_.prs += 20;
              queueEvent({title:'The Rising Fails', text:'The rebels are broken at the gates and their leader dies badly. Men remember, now, why your family rules. <em>(+10 legitimacy, +20 prestige)</em>', choices:[{t:'Let it be written.', fx:()=>{}}]});
              chron(`In this year certain great men rose against the crown and were destroyed, and their lands taught their heirs humility.`);
            } else {
              const t2 = ch(R_.ruler);
              R_.leg = clamp(R_.leg-20,0,100);
              const h = heirOf(R_.id);
              if(h){ killChar(t2, 'was deposed and died soon after — of shame, they said'); }
              else gameOver(false, 'The rebels drag you from the hall. There is no heir to continue the line.');
            }
          }},
          {t:'Buy them off — gold, seats, pardons. (-40 gold, -15 legitimacy)', fx:()=>{
            R_.gold = Math.max(0,R_.gold-40); R_.leg = clamp(R_.leg-15,0,100); addOp(pl, R_.ruler, 20);
          }},
        ]});
    } else {
      if(pow > hold + ri(-20,20)){
        logIt('plot', `${fullName(t)} of ${R_.n} is deposed by ${fullName(pl)}'s faction.`);
        const h = heirOf(R_.id);
        killChar(t, 'was deposed and quietly strangled');
      } else {
        killChar(pl, 'rose in rebellion and was destroyed');
      }
    }
  }
}
/* AI plot seeding — the same rules for everyone, from turn one */
function aiPlots(){
  for(const c of Object.values(G.chars)){
    if(!alive(c) || c.prison || age(c)<16) continue;
    if(G.plots.some(p=>p.plotter===c.id)) continue;
    if(!(c.tr.includes('ambitious')||c.tr.includes('deceitful')||c.tr.includes('cruel'))) continue;
    if(!chance(.03 + skill(c,'int')*.004)) continue;
    const R_ = rl(c.realm); if(!R_ || R_.dead) continue;
    const rul = ruler(c.realm);
    /* claimants scheme for thrones; the spurned scheme for blood */
    if(c.claims.length && chance(.5)){
      const tgt = rl(c.claims[0]);
      if(tgt && !tgt.dead && ruler(tgt.id)){
        if(c.realm===tgt.id){ startPlot(c.id,'depose', tgt.ruler); logIt('plot', isPlayer(tgt.id)?'(Something stirs in the shadows of your court…)':''); }
        else if(chance(.5)) startPlot(c.id,'murder', tgt.ruler);
        continue;
      }
    }
    if(rul && c.id!==rul.id && opinion(c, rul) < -30){
      startPlot(c.id, chance(.6)?'murder':'slander', rul.id);
      continue;
    }
    /* border lords tempt neighbours */
    if(skill(c,'int')>=6 && chance(.3)){
      const targets = Object.keys(G.provinces).filter(p=>{
        const owner = pv(p).r;
        return owner && owner!==c.realm && !rl(owner).dead &&
          (PROVDATA[p].adj||[]).some(q=>pv(q).r===c.realm);
      });
      if(targets.length) startPlot(c.id, 'defection', pick(targets), c.realm);
    }
  }
}

function fireEvents(){
  const eligible = EVENTS.filter(e=>{
    if(e.once && G.flags['ev_'+e.id]) return false;
    try{ return e.cond(); }catch(_){ return false; }
  });
  /* scripted (w=99) always fire; then up to 2 random others */
  const scripted = eligible.filter(e=>e.w===99);
  const rest = eligible.filter(e=>e.w<99);
  const chosen = [...scripted.slice(0,2)];
  let budget = chance(.75) ? 1 : 2;
  while(budget-- > 0 && rest.length){
    const tot = rest.reduce((s,e)=>s+e.w,0);
    let roll = R()*tot;
    let idx = 0;
    for(let i=0;i<rest.length;i++){ roll -= rest[i].w; if(roll<=0){ idx=i; break; } }
    chosen.push(rest.splice(idx,1)[0]);
  }
  for(const e of chosen){
    G.flags['ev_'+e.id] = 1;
    try{ const ev = e.run(); if(ev) queueEvent(ev); }catch(err){ console.error('event',e.id,err); }
  }
}
