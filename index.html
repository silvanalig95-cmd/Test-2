      <text class="seaLbl" x="105" y="330" style="font-size:14px">Oceanus</text>
      <line class="rhumb" x1="85" y1="735" x2="940" y2="90"/>
      <line class="rhumb" x1="85" y1="735" x2="960" y2="735"/>
      <line class="rhumb" x1="85" y1="735" x2="300" y2="30"/>
      <g class="compass" transform="translate(85,735)">
        <circle r="30"/><circle r="21"/>
        <path d="M0 -28 L6 0 L0 28 L-6 0 Z"/><path d="M-28 0 L0 6 L28 0 L0 -6 Z"/>
        <path d="M-17 -17 L0 -4 L17 17 M17 -17 L4 0 L-17 17" class="thin"/>
        <text y="-36">N</text>
      </g>
      <g class="cartouche">
        <rect x="24" y="20" width="272" height="56" rx="5"/>
        <text x="160" y="44">CROWN &amp; REALM</text>
        <text class="cartSub" x="160" y="62">Europa Septentrionalis · anno <tspan id="cartYear"></tspan></text>
      </g>
    </g>`;
    h += `<g style="filter:drop-shadow(2px 5px 6px rgba(30,20,5,.45))"><g filter="url(#rough)">`;
    h += `<g class="coastUnder">`;
    for(const [pid, pd] of Object.entries(PROVDATA)) h += `<path d="${dOf[pid]}" fill-rule="evenodd"/>`;
    h += `</g><g id="fillLayer">`;
    for(const [pid, pd] of Object.entries(PROVDATA)){
      if(pd.waste) h += `<path id="p_${pid}" class="provPath waste" d="${dOf[pid]}" fill-rule="evenodd" fill="url(#${pd.t==='desert'?'desertPat':'wastePat'})"></path>`;
      else h += `<path id="p_${pid}" class="provPath" d="${dOf[pid]}" fill-rule="evenodd" onclick="UI.selProv('${pid}')"></path>`;
    }
    h += `</g></g></g>`;
    h += `<g class="rivers">`;
    for(const [nm, pts] of Object.entries(RIVERS)){
      let d = `M${pts[0][0]} ${pts[0][1]}`;
      for(let i=1;i<pts.length;i++){ const a=pts[i-1], b=pts[i]; d += ` Q${a[0]} ${a[1]} ${(a[0]+b[0])/2} ${(a[1]+b[1])/2}`; }
      d += ` L${pts[pts.length-1][0]} ${pts[pts.length-1][1]}`;
      h += `<path class="river" d="${d}"><title>${nm}</title></path>`;
    }

    const TG = {
      hills:(x,y)=>`<path class="tglyph" d="M${x-7} ${y} l5 -7 l5 7 M${x+1} ${y} l5 -7 l5 7"/>`,

  renderMapDynamic(){
    const svg = document.getElementById('mapSvg'); if(!svg) return;
    /* occupation stripe patterns for whoever currently holds foreign ground */
    const occCols = new Set();
    for(const p of Object.keys(G.provinces)) if(pv(p).occ) occCols.add(pv(p).occ);
    let od = '';
    for(const o of occCols) od += `<pattern id="occ_${o}" width="9" height="9" patternTransform="rotate(45)" patternUnits="userSpaceOnUse"><rect width="9" height="9" fill="${rl(o).col}"/><rect width="9" height="4" fill="rgba(20,12,4,.35)"/></pattern>`;
    const occEl = document.getElementById('occDefs'); if(occEl) occEl.innerHTML = od;
    const yrEl = document.getElementById('cartYear'); if(yrEl && yrEl.textContent!=String(G.year)) yrEl.textContent = G.year;
    const selProv = G.sel && G.sel.t==='prov' ? G.sel.id : null;
    const moveTargets = G.moveMode ? Game.moveTargets() : {land:[],sea:[]};
    const mtSet = new Set([...moveTargets.land, ...moveTargets.sea]);
    let hlRealm = null;
    if(!G.moveMode && G.sel){
      if(G.sel.t==='prov') hlRealm = pv(G.sel.id) ? pv(G.sel.id).r : null;
      else if(G.sel.t==='char'){ const c = ch(G.sel.id); hlRealm = c ? c.realm : null; }
      else if(G.sel.t==='army'){ const a = G.armies.find(x=>x.id===G.sel.id); hlRealm = a ? a.realm : null; }
    }
    for(const [pid, pd] of Object.entries(PROVDATA)){
      const el = document.getElementById('p_'+pid); if(!el) continue;
      const st = pv(pid);

      let fill, mineMark=false;
      if(mode==='faith'){ fill = FAITH_COL[st.rel] || '#8a8a80'; mineMark = st.r===G.player; }
      else if(mode==='culture'){ fill = CULT_COL[st.cult] || '#8a8a80'; mineMark = st.r===G.player; }

      el.setAttribute('data-tip', this.provTip(pid));
    }
    /* marks: buildings, capitals, sieges */
    let m = '';
    for(const [pid, pd] of Object.entries(PROVDATA)){
      if(pd.waste) continue;
      const [cx, cy] = pd.lbl;
      if(pv(pid).bld) m += `<text class="bldIco small" x="${cx-16}" y="${cy+4}">${BUILDINGS[pv(pid).bld].ico}</text>`;
      else if(pv(pid).cons) m += `<text class="bldIco small" x="${cx-16}" y="${cy+4}">🏗</text>`;
      if(rl(pv(pid).r) && rl(pv(pid).r).cap===pid && !rl(pv(pid).r).dead)
        m += `<text class="capStar" x="${cx}" y="${cy-10}" text-anchor="middle" font-size="11" fill="#ffe9a0" style="paint-order:stroke" stroke="rgba(30,20,8,.7)" stroke-width="2">♛</text>`;

    }

    const byProv = {};
    for(const a of G.armies){ (byProv[a.prov]=byProv[a.prov]||[]).push(a); }
    const k = this.tokScale();
    let am = '';
    for(const [pid, list] of Object.entries(byProv)){
      const [cx, cy] = PROVDATA[pid].lbl;
      const span = 14;
      list.forEach((a,i)=>{
        const gcol = i % 3, grow = Math.floor(i/3);
        const rowN = Math.min(list.length - grow*3, 3);
        const x = cx + (gcol - (rowN-1)/2)*span, y = cy + 14 + grow*13;
        const seld = G.sel && G.sel.t==='army' && G.sel.id===a.id;
        const cm = ch(a.cmdr);
        const col = rl(a.realm).col;
        const dk = UI.shade(col, .6);
        const tipTxt = `<b>${esc(rl(a.realm).n)} host</b><br>${fmtN(a.levies)} levies · ${fmtN(a.retinue)} retinue · ${fmtN(a.mercs)} mercs<br>Commander: ${cm?esc(fullName(cm))+' ('+SKILLICO.mar+skill(cm,'mar')+')':'—'}${a.siege?`<br>Siege ${Math.min(99,Math.round(a.siege))}%`:''}`.replace(/"/g,'&quot;');
        const tf = k!==1 ? ` transform="translate(${(x*(1-k)).toFixed(2)} ${(y*(1-k)).toFixed(2)}) scale(${k.toFixed(3)})"` : '';
        am += `<g class="armyTok${seld?' seldTok':''}" onclick="UI.selArmy('${a.id}')" data-tip="${tipTxt}"${tf}${seld?' style="filter:drop-shadow(0 0 5px rgba(255,233,138,.85))"':''}>
          <line x1="${x}" y1="${y+7}" x2="${x}" y2="${y-17}" stroke="${seld?'#ffe98a':'#241a0c'}" stroke-width="1.6"/>
          <path d="M${x+.8} ${y-16.5} h11.5 q4 2.2 0 4.4 q-4 2.2 0 4.4 h-11.5 z" fill="${col}" stroke="${dk}" stroke-width=".9"/>
          <rect x="${x-8.5}" y="${y+1}" width="17" height="9.5" rx="2.5" fill="#241a0c" stroke="${seld?'#ffe98a':dk}" stroke-width="1"/>
          <text x="${x}" y="${y+8}">${(armySize(a)/1000).toFixed(1)}</text></g>`;
      });
    }
    const armyEl = document.getElementById('armyLayer'); if(armyEl) armyEl.innerHTML = am;
    svg.classList.toggle('zoomedOut', this.view.w > 620);
  },
  renderLog(){

  },

      h += `<div class="card"><div class="seatTop"><b>✠ Bless the Heir</b><button class="small" ${!Game.can()||P<30?'disabled':''} onclick="Game.faithBless()">30☩ (⚡)</button></div><div class="hint" style="margin:2px 0 0">+10 ✠ legitimacy now, steadying the succession.</div></div>`;

  empireHtml(){
    if(!G.empire){ return `<h3>The Holy Roman Empire</h3><div class="hint">The Empire is not part of this age.</div>`; }
    const E = G.empire, R_ = PRL();
    const holder = E.holder, emp = holder?ruler(holder):null;
    const amEmperor = isEmperor(G.player), amMember = empMember(G.player), amPretender = E.pretender===G.player;
    const tally = electorTally(); const mine = tally[G.player]||0;
    let h = `<h3>⚜ The Holy Roman Empire</h3>`;
    /* the Emperor */
    h += `<div class="card"><div class="seatTop"><b>The Emperor</b>${amEmperor?' <span class="hint" style="margin:0">· that is you</span>':''}</div>`;
    h += holder&&rl(holder)&&!rl(holder).dead
      ? `<div class="seatWho">${emp?esc(fullName(emp)):'—'} of <b>${esc(rl(holder).n)}</b></div>`
      : `<div class="seatWho"><i>The throne stands empty — an interregnum. The electors must choose.</i></div>`;
    h += `</div>`;
    /* your standing */
    h += `<div class="focusCard"><div class="focusSub">`;
    if(amEmperor) h += `You wear the Imperial crown. Forge a true Empire — <b>${realmProvs(G.player).length}/${G.impThresh}</b> provinces and <b>${Math.floor(R_.prs)}/200</b> ☀ — then hold your coronation to win the age.`;
    else if(amMember) h += `Your realm is a prince of the Empire. Court the electors, and when you hold <b>4 of 7</b> votes, contest the election and take the crown. You command <b>${mine}/7</b> so far.`;
    else if(amPretender) h += `You are a declared pretender to the Imperial throne — an outsider pressing in. Court the electors; you command <b>${mine}/7</b> votes, and need <b>4</b>.`;
    else h += `Your realm stands outside the Empire. ${R_.rel!=='catholic'?'The Imperial crown is a Catholic dignity, closed to you.':`Grow to <b>${G.impThresh}</b> provinces and press a claim to contend for the oldest crown in Christendom (you hold ${realmProvs(G.player).length}).`}`;
    h += `</div>`;
    /* action buttons */
    h += `<div class="actBtns" style="margin-top:8px">`;
    if(amEmperor){
      h += `<button class="small" ${!Game.can()||G.flags['diet'+G.year]?'disabled':''} onclick="Game.imperialDiet()" data-tip="+12 prestige, +4 legitimacy, a chance of an extra order · once a year">⚜ Summon the Imperial Diet (⚡)</button>`;
      h += `<button class="small" ${!Game.can()?'disabled':''} onclick="Game.imperialBan()" data-tip="Outlaw a neighbouring prince — gain a lawful claim on their land">⚖ Pronounce the Imperial Ban (⚡)</button>`;
    } else if(amMember||amPretender){
      h += `<button class="small" ${!Game.can()||R_.prs<60?'disabled':''} onclick="Game.contestElection()" data-tip="Force the electors to convene now (60 ☀). Need 4 of 7 votes to win.">⚜ Contest the election (⚡ 60☀)</button>`;
    } else if(R_.rel==='catholic'){
      h += `<button class="small" ${!Game.can()||realmProvs(G.player).length<G.impThresh||R_.prs<80?'disabled':''} onclick="Game.pressImperialClaim()" data-tip="Declare your candidacy for the Imperial throne (needs ${G.impThresh} provinces, 80 ☀)">⚜ Press an Imperial claim (⚡)</button>`;
    }
    h += `</div></div>`;
    /* the electors */
    h += `<h3 style="margin-top:10px">The Prince-Electors</h3>`;
    const canCourt = amMember || amPretender;
    for(const e of E.electors){
      const forMe = canCourt && e.op>=55;
      const favN = rl(e.favor)?rl(e.favor).n:'—';
      h += `<div class="card"><div class="seatTop"><b>${e.seat==='spiritual'?'✝':'⚜'} ${esc(e.n)}</b>`;
      if(canCourt) h += `<button class="small" ${!Game.can()||R_.gold<12?'disabled':''} onclick="Game.courtElector('${e.id}')">Court (⚡ 12🪙)</button>`;
      h += `</div><div class="seatWho">${forMe?'<span class="pos">Pledged to you</span>':`Favours <b>${esc(favN)}</b>`}${canCourt?` · warmth <span class="${e.op>=55?'pos':e.op>0?'':'neg'}">${e.op}</span>/55`:''}</div></div>`;
    }
    h += `<div class="hint">The seven electors choose the Emperor. ${canCourt?'Court them with gold, prestige, and piety — spiritual electors heed a devout prince, secular ones a renowned one — until four or more pledge to you, then contest the election.':'Only a member of the Empire or a declared pretender may court the electors.'}</div>`;
    return h;
  },
  renderRight(){
    const el = document.getElementById('rightBody');
    if(!G.sel){ el.innerHTML = this.overviewHtml(); return; }
    const back = `<button class="small" style="margin-bottom:8px" onclick="G.sel=null;G.moveMode=null;UI.renderAll()">⌂ Realm & counsel</button>`;

    if(G.sel.t==='prov') put(this.provHtml(G.sel.id));

    if(G.sel.t==='army'){

    }
  },
  advise(){
    const R_ = PRL(), out = [];
    const add = (txt, btn, fx, seat) => out.push({txt, btn, fx, seat});
    const myArmies = G.armies.filter(a=>a.realm===G.player);
    const invaded = Object.keys(G.provinces).filter(p=>pv(p).r===G.player && enemiesIn(p,G.player).length);
    const wars = atWar(G.player);
    if(invaded.length && !myArmies.length && Game.can('muster'))
      add(`Enemy soldiers stand on your soil at ${PROVDATA[invaded[0]].n} and no host opposes them.`, '⚔ Muster levies', `Game.act('muster','${R_.cap}')`, 'marshal');
    else if(wars.length && !myArmies.length && G.season<=1 && Game.can('muster'))
      add(`You are at war with no army in the field. Spring and summer are the mustering seasons.`, '⚔ Muster levies', `Game.act('muster','${R_.cap}')`, 'marshal');
    const idle = myArmies.find(a=>!a.moved);
    if(wars.length && idle)
      add(`Your host at ${PROVDATA[idle.prov].n} still has its march this season.`, '➤ Select army', `UI.selArmy('${idle.id}')`, 'marshal');
    if(!wars.length && myArmies.length)
      add(`The realm is at peace but ${fmtN(myArmies.reduce((s,a)=>s+armySize(a),0))} men stand idle, eating pay and dying of seasons.`, 'Disband host', `Game.act('disband','${myArmies[0].id}')`, 'marshal');
    if(!PR().sp && age(PR())<=60 && Game.can('marry'))
      add(`Your ruler is unwed — no consort, no heirs of the body, no marriage alliance.`, '⚭ Seek a match', `Game.marryMenuChar('${PR().id}')`, 'ruler');
    const heir = heirOf(G.player);
    if(!heir && !PR().sp && Game.can('marry'))
      add(`<b>The line hangs by a thread</b> — no heir, no consort. One fever ends the chronicle.`, '💍 Seek a marriage', `Game.marryMenuChar('${PR().id}')`, 'ruler');
    else if(!heir)
      add(`<b>No heir.</b> Pray for a child, or the chronicle ends with you.`, 'Court tab', `UI.tab('court')`, 'ruler');
    /* only recommend matches for close dynastic kin — whose marriage actually binds realms; courtiers may still be wed manually */
    const heirC = heir && !heir.sp && age(heir)>=16 && heir.id!==PR().id ? heir : null;
    const unwed = heirC || marriageCandidates(G.player).filter(c=>c.id!==PR().id && !c.sp && age(c)>=16 && c.dyn===PR().dyn)[0];
    if(unwed && Game.can('marry') && out.length<3)
      add(`${fullName(unwed)} (${age(unwed)}) of your house is unwed — a dynastic match here buys an ally's spears.`, '💍 Arrange match', `Game.marryMenuChar('${unwed.id}')`, 'ruler');
    if(R_.excomm && R_.gold>=40 && Game.can('rome'))
      add(`You are excommunicate. Every year outside the Church bleeds legitimacy and friends.`, '☩ Reconcile', `Game.act('rome')`, 'chaplain');
    else if(R_.leg<45 && (Game.can('rome')||Game.can('court')) && out.length<3)
      add(`Legitimacy is low (${Math.floor(R_.leg)}) — nobles get ideas about low kings.`, R_.gold>=15&&!G.flags['rome'+G.year] ? '☩ Petition Rome':'⚖ Convene court', R_.gold>=15&&!G.flags['rome'+G.year] ? `Game.act('rome')`:`Game.act('court')`, 'chaplain');
    const angry = myCourt().find(c=>opinion(c,PR())<-30 && c.tr.includes('ambitious') && !c.prison);
    if(angry && out.length<3 && Game.can('cgift') && R_.gold>=8)
      add(`${fullName(angry)} hates you (${opinion(angry,PR())}) and is ambitious. That arithmetic ends in plots.`, '🎁 Send gift', `Game.act('cgift','${angry.id}')`, 'ruler');
    if(out.length<3 && R_.gold>=60 && Game.can('build')){
      const slot = realmProvs(G.player).filter(p=>!pv(p).bld&&!pv(p).cons&&!pv(p).occ).sort((a,b)=>pv(b).dev-pv(a).dev)[0];
      if(slot) add(`The treasury is fat (${Math.floor(R_.gold)}🪙). Stone remembers longer than feasts.`, `🏗 Market at ${PROVDATA[slot].n}`, `Game.act('build','${slot}','market')`, 'steward');
    }
    if(out.length<3 && !wars.length && Game.can('fabricate') && R_.gold>=20 && !myCourt().some(c=>alive(c)&&(c.claims.length||c.pclaims.length))){
      const border = Object.keys(G.provinces).filter(p=>{ const o=pv(p).r;
        return o && o!==G.player && rl(o) && !rl(o).dead &&
          ((PROVDATA[p].adj||[]).some(q=>pv(q).r===G.player) || (PROVDATA[p].coast && PROVDATA[rl(G.player).cap].coast));
      }).sort((a,b)=>realmStrength(pv(a).r)-realmStrength(pv(b).r))[0];
      if(border) add(`Your house holds no claims — no lawful road to war. The monks could remedy that, given a candle and a quiet scriptorium. ${PROVDATA[border].n} looks… historically yours.`, `📜 Fabricate claim`, `Game.act('fabricate','${border}')`, 'spymaster');
    }
    if(!out.length && Game.can('feast') && R_.gold>=10)
      add(`A quiet season. Quiet seasons are for making friends before you need them.`, '🍖 Host a feast', `Game.act('feast')`, 'ruler');
    return out.slice(0,3);
  },
  tidings(){
    const out = [];
    const wars = atWar(G.player);
    for(const w of wars){
      const foes = w.sides.a.includes(G.player) ? w.sides.b : w.sides.a;
      for(const f of foes){
        const fa = G.armies.filter(a=>a.realm===f);
        const tot = fa.reduce((s,a)=>s+armySize(a),0);
        if(tot>0) out.push({i:'⚔', t:`${esc(rl(f).n)} fields <b>${fmtN(tot)}</b> men — nearest at ${esc(PROVDATA[fa[0].prov].n)}`, click:`UI.selProv('${fa[0].prov}')`});
      }
    }
    if(!wars.length){
      for(const r of Object.values(G.realms)){
        if(r.dead || r.id===G.player) continue;
        const rul = ruler(r.id);
        if(rul && rul.claims.includes(G.player) && !truceBetween(r.id, G.player)){
          const ratio = realmStrength(r.id)/Math.max(1, realmStrength(G.player));
          out.push({i:'👁', t:`${esc(fullName(rul))} of ${esc(r.n)} holds a claim on your crown${ratio>0.8?' — <b class="neg">and the strength to press it</b>':''}`});
        }
      }
    }
    for(const p of G.plots.filter(x=>x.mine))
      out.push({i:'🗡', t:`Your ${p.type} against ${esc(plotTargetName(p))}: <b>${Math.min(99,Math.round(p.progress))}%</b>`});
    const spySk = councilBonus(G.player,'spymaster');
    const hidden = G.plots.filter(p=>{
      if(p.mine || p.exposed) return false;
      const vr = (p.type==='defection'||p.type==='fabricate') ? pv(p.target).r : (ch(p.target)&&ch(p.target).realm);
      return vr===G.player;
    }).length;
    if(hidden>0 && spySk>=5)
      out.push({i:'🗡', t:`Your spymaster senses <b class="neg">${hidden===1?'a plot':hidden+' plots'}</b> moving against your house — not yet unmasked`});
    for(const c of Object.values(G.chars)){
      if(alive(c) && c.preg && c.realm===G.player && (c.dyn===PR().dyn || (c.sp && ch(c.sp) && ch(c.sp).dyn===PR().dyn)))
        out.push({i:'🤱', t:`${esc(fullName(c))} is with child — due ${c.preg<=1?'<b>this season</b>':'in '+c.preg+' seasons'}`, click:`UI.selChar('${c.id}')`});
    }
    for(const p of realmProvs(G.player)){
      const s = pv(p);
      if(s.cons) out.push({i:'🏗', t:`${BUILDINGS[s.cons.b].ico} ${BUILDINGS[s.cons.b].n} at ${esc(PROVDATA[p].n)} — ${s.cons.left===1?'<b>completes next season</b>':s.cons.left+' seasons yet'}`, click:`UI.selProv('${p}')`});
    }
    for(const t of G.truces){
      if(t.a!==G.player && t.b!==G.player) continue;
      const other = t.a===G.player ? t.b : t.a;
      if(!rl(other) || rl(other).dead) continue;
      if(t.until - (G.year + G.season/4) <= 1.25 && t.until > G.year)
        out.push({i:'☮', t:`The truce with ${esc(rl(other).n)} expires in ${t.until}`});
    }
    const abroad = G.armies.some(a=>a.realm===G.player && (pv(a.prov).r!==G.player || pv(a.prov).occ));
    if(G.season===1 && abroad) out.push({i:'🍂', t:'Autumn next — attrition begins for hosts on foreign soil'});
    if(G.season===2 && abroad) out.push({i:'❄', t:'<b class="neg">Winter next</b> — hosts still abroad will bleed badly'});
    if(G.plague) out.push({i:'☠', t:`The Great Mortality rages — ${G.plague} season${G.plague>1?'s':''} yet to run`});
    if(PRL().leg < 40) out.push({i:'⚖', t:`<b class="neg">Legitimacy is low (${Math.floor(PRL().leg)})</b> — vassals withhold levies, plotters take heart, and the commons mutter of revolt`, click:`UI.tab('dyn')`});
    return out.slice(0,8);
  },

    { const e=ETHOS[cultEthos(G.player)]; const fc=realmForeignCult(G.player).length;

  provHtml(pid){

      <div class="kv"><span>${st.bld?BUILDINGS[st.bld].ico:'🏗'} Building</span><b>${st.bld?BUILDINGS[st.bld].n : st.cons?BUILDINGS[st.cons.b].n+' — '+st.cons.left+' season'+(st.cons.left>1?'s':'')+' left' : '—'}</b></div>

      <button class="small" ${!Game.can('envoy')||G.flags['env'+rid+G.year]?'disabled':''} onclick="Game.act('envoy','${rid}')" data-tip="${G.flags['env'+rid+G.year]?'Already received this year — courts tire of flattery':'Improve their ruler’s opinion of you. One embassy per court per year.'}">Send envoy (⚡)</button>

      h += `<button class="small" ${!Game.can('war')||tr||G.regency?'disabled':''} onclick="Game.act('war','${rid}','${cl.id}')" data-tip="${G.regency?'A regency cannot declare war':''}">⚔ Press ${esc(cl.nm)}’s claim (⚡)</button>`;

    if(R_.excomm) h += `<div class="hint">☩ This ruler is excommunicate — shunned by all Christendom.</div>`;
    return h;
  },

          h += `<button class="small" onclick="Game.act('release','${c.id}')">Release (free)</button>

      const others = G.armies.filter(x=>x!==a && x.realm===a.realm && x.prov===a.prov);
      h += `<div class="actBtns">
        <button ${a.moved&&!a.extraMove?'disabled':''} onclick="Game.startMove('${a.id}')">${a.moved?(a.extraMove?'March again (forced)':'Already moved'):'March / Sail'}</button>
        <button class="small" ${size<100?'disabled':''} onclick="Game.splitMenu('${a.id}')" data-tip="Divide the host into two columns under separate captains — garrison and strike in the same season">✂ Split</button>
        ${others.length?`<button class="small" onclick="Game.mergeMenu('${a.id}')" data-tip="Fold a co-located host of yours into this one, massing for battle">⊕ Merge</button>`:''}
        <button class="small" onclick="Game.pickCommander('${a.id}')">Change commander</button>
        <button class="small" onclick="Game.act('disband','${a.id}')">Disband</button>
      </div>`;
      /* battle stance — how this host fights when it comes to blows */
      const cur = stanceOf(a);
      h += `<div class="actGroupHd">Battle stance</div><div class="stanceBtns">`;
      for(const [k,s] of Object.entries(STANCES)){
        h += `<button class="stanceBtn${cur===k?' on':''}" data-tip="${esc(s.d)}" onclick="Game.setStance('${a.id}','${k}')">${s.ico} ${s.n}</button>`;
      }
      h += `</div><div class="hint" style="margin-top:3px">${esc(STANCES[cur].d)}</div>`;
      if(others.length) h += `<div class="hint">${others.length===1?'Another column of yours stands here':others.length+' more columns of yours stand here'} — merge to mass, or leave split to hold more ground.</div>`;
      if(G.moveMode) h += `<div class="hint">Click a highlighted province. Dashed = by sea (15🪙, storm risk). Marching into an enemy host gives battle at once.</div>`;
      h += `<div class="hint">Armies move once a season. Split a large host to hold ground while you strike elsewhere; muster or merge to reinforce. Autumn and winter kill the unhoused — bring them home or press hard.</div>`;
    }
    return h;
  },
  /* ---- modal queue ---- */
  processQueue(){
    const tb = document.getElementById('tipBox'); if(tb) tb.style.display='none';
    const host = document.getElementById('modalHost');
    if(!G.eventQueue.length){ host.innerHTML=''; return; }
    const ev = G.eventQueue[0];
    const who = ev.who && ch(ev.who) ? ch(ev.who) : null;
    const whoHtml = who ? `<div class="evWho">${UI.portrait(who, true)}
      <div><b>${esc(fullName(who))}</b><br><span class="hint" style="margin:0">${esc(title(who))} · ${who.dead?'died '+who.dead:'age '+age(who)} · ${SKILLICO.dip}${skill(who,'dip')} ${SKILLICO.mar}${skill(who,'mar')} ${SKILLICO.int}${skill(who,'int')} ${SKILLICO.ste}${skill(who,'ste')}</span><br>${traitChips(who)}</div></div>` : '';
    host.innerHTML = `<div class="modalBack"><div class="modal">
      <h2>${ev.title}</h2>${whoHtml}<div class="body">${fmtFx(ev.text)}</div>
      <div class="choices">${ev.choices.map((c,i)=>`<button onclick="UI.choose(${i})">${fmtFx(c.t)}</button>`).join('')}</div>
    </div></div>`;
  },
  choose(i){
    const ev = G.eventQueue.shift();
    try{ ev.choices[i].fx(); }catch(err){ console.error(err); }
    this.renderAll();
  },
  modal(title, html, choices){
    queueEvent({title, text:html, choices});
    this.processQueue();
  },
  help(){
    this.modal('How to Rule',
    `<h3>The Dynasty</h3>You are a family, not a nation. Lose your last province or your last dynast and the chronicle closes. Heirs, marriages, and legitimacy are life itself.<br><br>
    <h3>The Season</h3>Each season you have a small pool of <b>orders</b> (⚡) to spend on anything — marriages, buildings, wars, plots, envoys. You hold <b>two from the crown</b> (one in a regency), <b>+1 for a working council</b> (two or more seated advisors), and <b>+1 for a beloved crown</b> (legitimacy 85+); some events grant temporary extra orders. So a staffed, contented, legitimate realm simply does more each season. Armies march once a season for free. Muster in spring, strike in summer; autumn and winter maul armies left in the field. Buildings take a year of construction.<br><br>
    <h3>Faith, People &amp; the Empire</h3>Your realm keeps a <b>faith</b> (piety, holy wars, missions — see the Faith tab) and a <b>people</b> (a martial, mercantile, or hardy ethos). Conquered land that spurns your faith pays and musters grudgingly until converted; land of a foreign people drags your legitimacy until it slowly assimilates. The <b>Holy Roman Empire</b> is an elective crown: court its seven prince-electors and win the Imperial title (Empire tab) — the road to a crowning victory.<br><br>
    <h3>Making Peace</h3>Wars end by negotiation. Open <b>Negotiate peace</b> and each term — white peace, tribute, a ceded province, the whole crown — shows how likely the enemy is to accept it. The harder your demand, the higher your hand must be; when you're losing, you can pay them to depart, or surrender their full demands.<br><br>
    <h3>Hosts in the Field</h3>A large host can be <b>split</b> into two columns under separate captains — garrison a town with one while the other strikes — and co-located columns of yours can be <b>merged</b> to mass for battle. Muster raises fresh levies into a stack that already stands on the muster province, so reinforcement is a matter of mustering or merging.<br><br>
    <h3>Sieges</h3>March onto an undefended enemy province and the siege begins by itself: each season it advances by 30 + 2×your commander's ⚔ + fortune, minus 22 if the province has a castle. At 100% the province is occupied, your treasury takes its loot, and your war score climbs. Occupying everything forces even a stubborn enemy to yield.<br><br>
    <h3>The Game of Thrones</h3><b>Marriage</b> buys alliances · <b>claims</b> make war lawful (the monks can forge one) · <b>legitimacy</b> keeps your nobles honest · <b>opinion</b> decides who joins whose plot — and plots run always, including against you. Your spymaster is your shield; Rome can bless you or cast you out.<br><br>
    <h3>Deeds Have Consequences</h3>The court does not wait for the new year to react. Muster a host and a captain may ride to your banner; endow the Church and a relic-seller appears; set a plot in motion and a conspirator may lose his nerve — events now surface <em>as you act</em>, not just at the season's turn, so a busy season is a lively one.<br><br>
    <h3>Victory</h3>Be crowned Emperor at the province threshold shown in your realm panel · keep the dynasty alive a hundred years · or amass 2500 ☀ prestige.<br><br>
    <h3>The Hand on the Reins</h3><b>Space</b> ends the season · <b>F</b> hurries quiet seasons · <b>Esc</b> deselects · hover anything for detail · the Council Advises panel always suggests a sensible next move. Save often; die well.`,
    [{t:'To the throne room.', fx:()=>{}}]);
  },
  ledger(){
    if(!G || G.over) return;
    const realms = Object.values(G.realms).filter(r=>!r.dead && ruler(r.id))
      .map(r=>({r, str:realmStrength(r.id), prov:realmProvs(r.id).length}))
      .sort((a,b)=>b.str-a.str);
    const relTo = rid => {
      if(rid===G.player) return '<b class="pos">— you —</b>';
      if(warBetween(rid,G.player)) return '<b class="neg">at war</b>';
      if(allianceBetween(rid,G.player)) return '<b class="pos">ally</b>';
      if(truceBetween(rid,G.player)) return '<span class="hint" style="margin:0">truce</span>';
      const o = opinion(ruler(rid), PR());
      return `<span class="${o>=0?'pos':'neg'}">${o>0?'+':''}${o}</span>`;
    };
    let rows = `<div class="ledgerHead"><span class="lr">Realm</span><span>Ruler</span><span>Faith</span><span>Lands</span><span>Levy</span><span>Toward you</span></div>`;
    realms.forEach((e,i)=>{
      const r = e.r, rul = ruler(r.id);
      rows += `<div class="ledgerRow${r.id===G.player?' me':''}" onclick="UI.focusRealm('${r.id}')">
        <span class="lr"><svg class="medal" style="width:20px;height:22px" viewBox="0 0 34 38"><path d="M3 3 h28 v18 q0 8 -14 14 q-14 -6 -14 -14 z" fill="${r.col}" stroke="#3a2c18" stroke-width="1.5"/></svg>
          <b>${i+1}.</b> ${esc(r.n)}${REALMDATA[r.id]&&REALMDATA[r.id].rtitle?'':''}</span>
        <span>${esc(rul.nm)}${rul.epithet?' '+esc(rul.epithet):''}</span>
        <span>${RELICO[r.rel]}</span>
        <span>${e.prov}</span>
        <span>${fmtN(e.str)}</span>
        <span>${relTo(r.id)}</span></div>`;
    });
    const host = document.getElementById('modalHost');
    host.innerHTML = `<div class="modalBack" style="pointer-events:auto"><div class="modal" style="width:min(680px,94vw)">
      <h2>The Great Powers</h2>
      <div class="hint" style="margin:-4px 0 8px">${realms.length} realms stand in Christendom and beyond, ${SEASONS[G.season]} ${G.year}. Click any to find it on the map.</div>
      <div class="ledger">${rows}</div>
      <div class="choices" style="margin-top:12px"><button onclick="UI.processQueue()">Close</button></div>
    </div></div>`;
  },
  focusRealm(rid){
    const cap = rl(rid).cap;
    if(cap && PROVDATA[cap]){
      const [cx,cy] = PROVDATA[cap].lbl;
      this.view = {x:clamp(cx-210,0,1000-420), y:clamp(cy-157,0,747-314), w:420, h:314};
      this.applyView();
      G.sel = {t:'prov', id:cap};
    }
    this.processQueue(); this.renderAll();
  },
};
</script>
<script>
/* ============ Actions, turn loop, boot ============ */
const ORDSEAT = { muster:'marshal', retinue:'marshal', march:'marshal', tourney2:'marshal',
  build:'steward', develop:'steward', harvest:'steward',
  plotMurder:'spymaster', plotSlander:'spymaster', fabricate:'spymaster',
  rome:'chaplain', court:'chaplain', envoy:'chaplain', crowncourt:'chaplain', gift:'chaplain',
  feast:'ruler', war:'ruler', pwar:'ruler', holywar:'ruler', marry:'ruler',
  cgift:'ruler', imprison:'ruler', execute:'ruler', law:'ruler' };
const SEATNAME = {ruler:'Crown', marshal:'Marshal', steward:'Steward', spymaster:'Spymaster', chaplain:'Chaplain'};
const SEATICO = {ruler:'👑', marshal:'⚔', steward:'🔑', spymaster:'🗡', chaplain:'🕊'};
function councilSize(rid){
  const R_ = rl(rid); let n = 0;
  for(const s of ['marshal','steward','spymaster','chaplain']){
    const cid = R_.council[s], c = cid && ch(cid);
    if(c && alive(c) && !c.prison && !c.mandate) n++;   /* an advisor on a mandate is occupied, not available for general governance */
  }
  return n;
}
function resetOrders(){
  if(!PRL()) return;
  G.ordersTemp = (G.ordersTemp||[]).filter(t=>t.until > G.year + G.season/4);
  G.ordersMax = ordersMaxNow();
  G.ordersLeft = G.ordersMax;
}
const Game = {
  busy(){
    if(G && G.eventQueue.length){ toast('⚑ The court awaits your decision first'); return true; }
    return false;
  },
  can(){ return !!(G && G.ordersLeft > 0); },
  order(){
    if(G && G.ordersLeft > 0){ G.ordersLeft--; return true; }
    toast('No orders left this season — end it, and the new year brings more.');
    return false; },
  react(kind){
    /* an action can spark a consequence in the same season, thematically tied to it */
    if(!G || G.over || G._ff) return;
    if(G.eventQueue.length) return;
    if(!chance(.28)) return;
    const pool = EVENTS.filter(e=>{
      if(!e.trig || !e.trig.includes(kind)) return false;
      if(e.once && G.flags['ev_'+e.id]) return false;
      try{ return e.cond(); }catch(_){ return false; }
    });
    if(!pool.length) return;
    const tot = pool.reduce((s,e)=>s+e.w,0);
    let roll = R()*tot, e = pool[0];
    for(const x of pool){ roll -= x.w; if(roll<=0){ e=x; break; } }
    G.flags['ev_'+e.id]=1;
    try{ const ev=e.run(); if(ev) queueEvent(ev); }catch(err){ console.error('react',e.id,err); }
  },
  act(type, a, b){
    if(this.busy()) return;
    const R_ = PRL();
    switch(type){
      case 'feast': if(G.flags['feast'+G.year]){ toast('🍖 You have already held your great feast this year.'); return; }
        if(R_.gold<10||!this.order('feast')) return; G.flags['feast'+G.year]=1; R_.gold-=10; R_.prs+=10;
        for(const c of myCourt()) addOp(c, PR().id, 6);
        logIt('court','You feast the court; grudges soften under grease and mead.');
        toast('🍖 A feast! <b>+10 prestige</b>, the court warms to you'); break;
      case 'retinue': if(!this.order('retinue')) return; R_.gold-=12; R_.retinue=Math.min(600,R_.retinue+100);
        logIt('war','A hundred sworn swords join your standing retinue.');
        toast('⚔ <b>+100 retinue</b> — permanent soldiers, modest upkeep'); break;
      case 'court': if(G.flags['court'+G.year]){ toast('✠ You have already convened the court this year.'); return; }
        if(!this.order('court')) return; G.flags['court'+G.year]=1; R_.leg=clamp(R_.leg+4,0,100);
        const c0 = pick(myCourt()); if(c0) addOp(c0, PR().id, 10);
        logIt('court','You hold open court; justice is seen to be done, mostly.');
        toast('✠ <b>+4 legitimacy</b> — justice was seen to be done'); break;
      case 'build': { const bc = Math.round(BUILDINGS[b].cost*focusBuild(G.player)); if(R_.gold<bc||pv(a).cons||!this.order('build')) return;
        R_.gold-=bc; pv(a).cons={b, left:4};
        logIt('court',`Masons begin work on a ${BUILDINGS[b].n.toLowerCase()} at ${PROVDATA[a].n}.`);
        toast(`🏗 <b>${BUILDINGS[b].n}</b> under construction at ${esc(PROVDATA[a].n)} — one year`); break; }
      case 'develop': { const cost=30+pv(a).dev*12; if(R_.gold<cost||!this.order('develop')) return;
        R_.gold-=cost; pv(a).dev++; logIt('court',`${PROVDATA[a].n} grows: roads, mills, and men.`);
        toast(`⛏ ${esc(PROVDATA[a].n)} grows to <b>development ${pv(a).dev}</b>`); break; }
      case 'muster': { if(!this.can('muster')) return; if(raiseArmy(G.player, a)) this.order('muster'); break; }
      case 'envoy': {
        if(G.flags['env'+a+G.year]){ toast(`🕊 Your envoy has already been received at the court of ${esc(rl(a).n)} this year.`); return; }
        if(!this.order('envoy')) return;
        G.flags['env'+a+G.year] = 1;
        const eop = 10+skill(PR(),'dip')+focusOpinion(G.player);
        addOp(ruler(a), PR().id, eop);
        logIt('court',`Your envoy flatters the court of ${rl(a).n}.`);
        toast(`🕊 Envoy to ${esc(rl(a).n)}: <b>+${eop} opinion</b>`); break; }
      case 'gift': if(G.flags['gift'+a+G.year]){ toast(`🎁 You have already sent gifts to ${esc(rl(a).n)} this year.`); return; }
        if(R_.gold<10||!this.order('gift')) return; G.flags['gift'+a+G.year]=1; R_.gold-=10;
        addOp(ruler(a), PR().id, 20+focusOpinion(G.player));
        logIt('court',`Gold and falcons for ${rl(a).n}; their ruler smiles.`);
        toast(`🎁 Gift to ${esc(rl(a).n)}: <b>+${20+focusOpinion(G.player)} opinion</b>`); break;
      case 'cgift': if(G.flags['cgift'+a+G.year]){ toast(`🎁 You have already gifted ${esc(fullName(ch(a)))} this year.`); return; }
        if(R_.gold<8||!this.order('cgift')) return; G.flags['cgift'+a+G.year]=1; R_.gold-=8;
        addOp(ch(a), PR().id, 18); logIt('court',`A gift finds ${fullName(ch(a))}.`);
        toast(`🎁 <b>+18 opinion</b> with ${esc(fullName(ch(a)))}`); break;
      case 'war': { if(G.regency) return;
        const claimant = b? ch(b) : null;
        this.confirmWar(a, claimant? {type:'throne', target:a} : {type:'none', target:a}, claimant?claimant.id:null);
        return; }
      case 'pwar': { if(G.regency) return;
        const [cid, prov] = b.split('|');
        this.confirmWar(a, {type:'province', target:prov}, cid);
        return; }
      case 'holywar': { if(G.regency) return;
        const owner = pv(a).r;
        this.confirmWar(owner, {type:'province', target:a, holy:true}, PR().id);
        return; }
      case 'fabricate': {
        if(G.plots.some(pl=>pl.mine && pl.type==='fabricate' && pl.target===a)){ toast(`📜 Your monks are already forging a claim to ${esc(PROVDATA[a].n)}.`); return; }
        if(R_.gold<20||!this.order('fabricate')) return;
        R_.gold -= 20;
        const p = startPlot(PR().id, 'fabricate', a, G.player); p.mine = true;
        logIt('plot', `In a quiet scriptorium, work begins on a very old charter concerning ${PROVDATA[a].n}.`);
        toast(`📜 The monks begin their quiet work on <b>${esc(PROVDATA[a].n)}</b>…`);
        break; }
      case 'rome': {
        if(R_.excomm){ if(R_.gold<40||!this.order('rome')) return;
          R_.gold -= 40; R_.excomm = false; R_.leg = clamp(R_.leg+10,0,100);
          ach('penitent');
          logIt('court','Barefoot, penitent, and considerably poorer, you are received back into the Church.');
          chron(`In this year the ${PR().sex==='m'?'king':'queen'} was reconciled with Holy Church, having discovered that Hell holds no vassals.`);
        } else { if(R_.gold<15||G.flags['rome'+G.year]||!this.order('rome')) return;
          R_.gold -= 15; G.flags['rome'+G.year]=1; R_.leg = clamp(R_.leg+8,0,100);
          logIt('court','Gold flows to Rome; blessings flow back. The exchange rate is stable.');
        }
        break; }
      case 'law': { if(R_.prs<50||G.flags['law'+PR().id]||!this.order('law')) return;
        R_.prs -= 50; R_.leg = clamp(R_.leg-10,0,100); G.flags['law'+PR().id]=1;
        R_.law = R_.law==='elective' ? 'primo' : 'elective';
        const heirNow = heirOf(G.player);
        logIt('court', `The magnates assent: the crown of ${R_.n} now passes by ${R_.law==='elective'?'election of the wise — or at least the loud':'right of the firstborn'}.` );
        chron(`In this year the law of succession was changed, which pleased those it favored and taught patience to the rest.`);
        /* passed-over sons notice immediately */
        for(const k of myKids()){
          if(k.sex==='m' && age(k)>=16 && heirNow && k.id!==heirNow.id){ addOp(k, PR().id, -25); }
        }
        break; }
      case 'imprison': if(!this.order('imprison')) return; imprison(ch(a));
        for(const c of myCourt()) addOp(c, PR().id, -4); break;
      case 'release': { const c=ch(a); c.prison=false; addOp(c,PR().id,25);
        logIt('court',`${fullName(c)} walks free, blinking.`); break; }
      case 'execute': if(!this.order('execute')) return;
        killChar(ch(a),'was put to death at the ruler’s command');
        R_.leg=clamp(R_.leg-8,0,100);
        for(const c of myCourt()) addOp(c, PR().id, -8); break;
      case 'plotMurder': { const t=ch(a); if(t.realm===G.player&&t.dyn===PR().dyn){ UI.modal('Kinslaying','Even your spymaster refuses to put this in writing. Plotting the murder of your own dynasty is a step the game of thrones forgives — but this game does not require.',[{t:'Withdraw the thought.',fx:()=>{}}]); return; }
        if(G.plots.some(pl=>pl.mine&&pl.type==='murder'&&pl.target===a)){ toast(`🗡 Your men are already at their quiet work against ${esc(fullName(t))}.`); return; }
        if(!this.order('plotMurder')) return;
        const p=startPlot(PR().id,'murder',a); p.mine=true;
        logIt('plot',`Quiet men begin quiet work regarding ${fullName(t)}.`); break; }
      case 'plotSlander': { if(G.plots.some(pl=>pl.mine&&pl.type==='slander'&&pl.target===a)){ toast(`🐍 The whispers against ${esc(fullName(ch(a)))} already spread.`); return; }
        if(!this.order('plotSlander')) return;
        const p=startPlot(PR().id,'slander',a); p.mine=true;
        logIt('plot',`Coin changes hands; poets sharpen quills against ${fullName(ch(a))}.`); break; }
      case 'disband': { const ar=G.armies.find(x=>x.id===a); if(ar) disbandArmy(ar);
        G.sel=null; break; }
      case 'tourney2': { if(G.season!==0||R_.gold<12||G.flags['sa'+G.year]||!this.order('tourney2')) return;
        R_.gold-=12; R_.prs+=12; G.flags['sa'+G.year]=1;
        for(const c of myCourt()) addOp(c, PR().id, 4);
        toast('🏇 The spring tournament: <b>+12 prestige</b>, the court cheers');
        logIt('court','The spring tournament fills the lists; lances break and reputations are made.'); break; }
      case 'march': { if(G.season!==1||G.flags['sa'+G.year+'s']) return;
        const ar = (G.sel&&G.sel.t==='army' && G.armies.find(x=>x.id===G.sel.id&&x.realm===G.player))
          || G.armies.filter(x=>x.realm===G.player).sort((x,y)=>armySize(y)-armySize(x))[0];
        if(!ar || !this.order('march')) return;
        ar.extraMove = true; G.flags['sa'+G.year+'s']=1;
        toast(`⚔ Forced march — the host at ${esc(PROVDATA[ar.prov].n)} may march twice this season`);
        break; }
      case 'harvest': { if(G.season!==2||G.flags['sa'+G.year+'a']||!this.order('harvest')) return;
        const g = realmProvs(G.player).filter(p=>!pv(p).occ).length;
        R_.gold += g; R_.leg = clamp(R_.leg-3,0,100); G.flags['sa'+G.year+'a']=1;
        for(const c of myCourt()) addOp(c, PR().id, -4);
        toast(`🌾 Harvest levy: <b>+${g} gold</b> — the villages grumble`);
        logIt('court','The harvest levy is collected to the last sheaf. The villages remember.'); break; }
      case 'crowncourt': { if(G.season!==3||R_.gold<8||G.flags['sa'+G.year+'w']||!this.order('crowncourt')) return;
        R_.gold-=8; R_.leg = clamp(R_.leg+8,0,100); G.flags['sa'+G.year+'w']=1;
        for(const c of myCourt()) addOp(c, PR().id, 6);
        toast('👑 Crown Court: <b>+8 legitimacy</b>, the great swear their oaths anew');
        logIt('court','The crown-wearing at Christmas court: oaths, candles, and a realm reminded who rules it.'); break; }
    }
    this.react(type);
    UI.renderAll();
  },
  confirmWar(tgt, cb, claimantId){
    /* a blessed holy banner sanctifies a war against another faith */
    const bannerFits = G.flags.holyBanner && !cb.holy && rl(tgt) && rl(tgt).rel!==PRL().rel;
    if(bannerFits) cb.holy = true;
    const mine = realmStrength(G.player), theirs = realmStrength(tgt);
    const alliesOf = rid => G.alliances.filter(al=>al.a===rid||al.b===rid)
      .map(al=>al.a===rid?al.b:al.a).filter(r=>rl(r)&&!rl(r).dead&&r!==tgt&&r!==G.player);
    const theirA = alliesOf(tgt), myA = alliesOf(G.player);
    const theirTotal = theirs + theirA.reduce((s,r)=>s+realmStrength(r),0);
    let body = `<div class="kv"><span>Your full levy (with retinue)</span><b>${fmtN(mine)}</b></div>
      <div class="kv"><span>${esc(rl(tgt).n)}</span><b>${fmtN(theirs)}</b></div>`;
    if(theirA.length) body += `<div class="kv"><span class="neg">Sworn to their defence</span><b>${theirA.map(r=>esc(rl(r).n)).join(', ')} — in all ~${fmtN(theirTotal)}</b></div>`;

  marryMenu(rid){

        UI.modal('No Match Possible', `The house of ${esc(rl(rid).n)} prays ${RELNAME[rl(rid).rel]} rites and yours ${RELNAME[PRL().rel]} — no priest in either land will read these banns.`, [{t:'A pity.',fx:()=>{}}]); return;

  pickAmbition(force){
    if(!force && this.busy()) return;
    const R_=PRL(); const cur = R_.ambition ? R_.ambition.id : null;
    const base = {baseProvs:realmProvs(G.player).length, baseWars:G.stats?G.stats.warsWon:0};
    const opts = AMBITIONS.filter(a=>{ try{ return a.cond(R_) && a.id!==cur && !a.check(base); }catch(e){ return false; } });
    /* offerings lean toward the ruler's character, so the goal feels their own */
    const rul = PR(), fit = {
      expand:['ambitious','brave'], warlord:['brave','wrathful','ambitious'], secure:['content','patient'],
      devout:['pious'], wealthy:['greedy'], dynast:['kind','honest','patient'], renowned:['ambitious','lustful'],
      builder:['content','generous'], imperial:['ambitious','genius'] };
    const wt = a => 1 + (fit[a.id]||[]).filter(t=>rul&&rul.tr.includes(t)).length*3 + R()*1.5;
    const pool = [...opts].sort((a,b)=>wt(b)-wt(a)).slice(0,3);
    if(!pool.length) return;
    UI.modal('Set Your Ambition', `Every ruler is remembered for what they set out to do. Choose the ambition of ${fullName(PR())} — fulfil it, and your house reaps the reward.`,
      pool.map(a=>({t:`${a.ico} <b>${a.n}</b> — ${esc(a.d)}`, fx:()=>this.setAmbition(a.id)}))
        .concat(cur?[{t:'— Keep my present ambition —',fx:()=>{}}]:[]));
  },
  setAmbition(id){
    const R_=PRL(); const a=ambitionById(id); if(!a) return;
    R_.ambition = { id, baseProvs:realmProvs(G.player).length, baseWars:G.stats?G.stats.warsWon:0, set:G.year };
    toast(`${a.ico} New ambition: <b>${esc(a.n)}</b>`);
    logIt('court', `${fullName(PR())} sets an ambition: ${a.n.toLowerCase()}.`);
    UI.renderAll();
  },
  checkAmbition(){
    const R_=PRL(); if(!R_||!R_.ambition||G.over) return;
    const a=ambitionById(R_.ambition.id); if(!a){ R_.ambition=null; return; }
    let done=false; try{ done=a.check(R_.ambition); }catch(e){ return; }
    if(!done) return;
    const msg=a.reward(R_); R_.ambition=null;
    queueEvent({ title:`${a.ico} Ambition Fulfilled`,
      text:`<span class="dropcap">${fullName(PR())} has achieved a life's ambition — <b>${esc(a.n)}</b>. ${esc(a.d)}</span><br><br>The realm rejoices, and your house is the richer for it. <em>(${msg})</em>`,
      choices:[{t:'On to the next.', fx:()=>{ Game.pickAmbition(true); }}] });

  assignMandate(seat){

    const m = MANDATES[seat];
    const commit = (target)=>{ if(!this.can()){ toast('No orders left this season to set a new task.'); return; }
      this.order(); c.mandate = { target };
      const label = target ? (m.target==='province' ? PROVDATA[target].n : rl(target).n) : '';
      toast(`${m.ico} <b>${esc(fullName(c))}</b> set to: ${m.n}${label?` — ${esc(label)}`:''}`);
      logIt('court', `${fullName(c)} is set to ${m.n.toLowerCase()}${label?` (${label})`:''}.`);
      UI.renderAll(); };
    if(!m.target){
      UI.modal(m.n, `${m.d}<br><br>Setting this task spends <b>one order</b> now; thereafter it works on its own each season until you recall your ${cap(seat)}. <span class="neg">While away, they forfeit this office’s passive bonus and their hand in your order pool</span> — the cost is their absence, not a second order.`,
        [{t:`⚡ Set to “${m.n}”`, fx:()=>commit(null)}, {t:'— Not now —', fx:()=>{}}]);
      return;
    }
    if(m.target==='province'){
      const opts = realmProvs(G.player).filter(p=>pv(p).dev<5)
        .sort((a,b)=>pv(a).dev-pv(b).dev || PROVDATA[a].n.localeCompare(PROVDATA[b].n)).slice(0,12);
      if(!opts.length){ toast('Every province you hold is already fully developed.'); return; }
      UI.modal(m.n, `${m.d}<br><br>Choose a province. Setting the task spends <b>one order</b>; it then advances on its own each season. <span class="neg">While away, your ${cap(seat)} forfeits this office’s passive and their hand in your orders.</span>`,
        opts.map(p=>({t:`${esc(PROVDATA[p].n)} — ${STATICO.dev}${pv(p).dev}/5`, fx:()=>commit(p)}))
          .concat([{t:'— Not now —', fx:()=>{}}]));
      return;
    }
    /* realm target */
    const opts = Object.values(G.realms).filter(r=>!r.dead && r.id!==G.player && ruler(r.id) && alive(ruler(r.id)))
      .sort((a,b)=>realmStrength(b.id)-realmStrength(a.id)).slice(0,12);
    if(!opts.length){ toast('No foreign court stands to receive your advisor.'); return; }
    UI.modal(m.n, `${m.d}<br><br>Choose a court. Setting the task spends <b>one order</b>; it then works on its own each season. <span class="neg">While away, your ${cap(seat)} forfeits this office’s passive and their hand in your orders.</span>`,
      opts.map(r=>({t:`${esc(r.n)} — ${STATICO.opinion}${opinion(ruler(r.id),PR())}`, fx:()=>commit(r.id)}))
        .concat([{t:'— Not now —', fx:()=>{}}]));

  doSplit(aid, n){

    const size = armySize(a);
    n = clamp(Math.round(n), 50, size-50);
    const frac = n/size;
    let dL = Math.min(a.levies, Math.round(a.levies*frac));
    let dR = Math.min(a.retinue, Math.round(a.retinue*frac));
    let dM = Math.min(a.mercs, Math.round(a.mercs*frac));
    if(dL+dR+dM < 1) dL = Math.min(a.levies, 50);
    a.levies-=dL; a.retinue-=dR; a.mercs-=dM;
    const nb = { id:'a'+(++G.aid), realm:a.realm, prov:a.prov, levies:dL, retinue:dR, mercs:dM,
      cmdr: secondCommander(a.realm, a.cmdr), siege:0, moved:a.moved, extraMove:!!a.extraMove };
    G.armies.push(nb);
    const cap = ch(nb.cmdr);
    logIt('war', `The ${rl(a.realm).n} host at ${PROVDATA[a.prov].n} divides; ${fmtN(dL+dR+dM)} men form a new column under ${cap?fullName(cap):'a captain'}.`);
    toast(`✂ Host divided — <b>${fmtN(dL+dR+dM)}</b> march${cap?' under '+esc(fullName(cap)):''}`);
    G.sel = {t:'army', id:nb.id};
    UI.processQueue(); UI.renderAll();
  },
  mergeMenu(aid){
    if(this.busy()) return;
    const a = G.armies.find(x=>x.id===aid); if(!a || a.realm!==G.player) return;
    const others = G.armies.filter(x=>x!==a && x.realm===a.realm && x.prov===a.prov);
    if(!others.length){ toast('No other host of yours stands here to join.'); return; }
    if(others.length===1){ this.doMerge(a.id, others[0].id); return; }
    UI.modal('Combine Which Column?', `Several of your columns stand at ${esc(PROVDATA[a.prov].n)}. Fold one into this host.`,
      others.map(o=>({t:`${fmtN(armySize(o))} men${ch(o.cmdr)?' under '+esc(fullName(ch(o.cmdr))):''}`, fx:()=>{ Game.doMerge(a.id, o.id); }}))
        .concat([{t:'— Keep them apart —', fx:()=>{}}]));
  },
  doMerge(aid, bid){
    const a = G.armies.find(x=>x.id===aid), b = G.armies.find(x=>x.id===bid);
    if(!a || !b || a===b) return;
    const [keep, gone] = armySize(a)>=armySize(b) ? [a,b] : [b,a];
    keep.levies += gone.levies; keep.retinue += gone.retinue; keep.mercs += gone.mercs;
    keep.siege = Math.max(keep.siege||0, gone.siege||0);
    keep.moved = keep.moved || gone.moved;
    keep.extraMove = !!(keep.extraMove && gone.extraMove);
    if(ch(gone.cmdr) && (!ch(keep.cmdr) || skill(ch(gone.cmdr),'mar') > skill(ch(keep.cmdr),'mar'))) keep.cmdr = gone.cmdr;
    G.armies = G.armies.filter(x=>x!==gone);
    logIt('war', `The ${rl(keep.realm).n} columns at ${PROVDATA[keep.prov].n} join into one host of ${fmtN(armySize(keep))}.`);
    toast(`⊕ Columns combined — <b>${fmtN(armySize(keep))}</b> under one banner`);
    G.sel = {t:'army', id:keep.id};
    UI.renderAll();
  },
  startMove(aid){
    if(this.busy()) return; G.moveMode = aid; UI.renderMap(); UI.renderRight(); },
  setStance(aid, st){
    const a = G.armies.find(x=>x.id===aid); if(!a || a.realm!==G.player) return;
    a.stance = st; toast(`${STANCES[st].ico} The host takes a <b>${STANCES[st].n.toLowerCase()}</b> stance`);
    UI.renderRight(); },
  moveTargets(){
    const a = G.armies.find(x=>x.id===G.moveMode);
    if(!a) return {land:[],sea:[]};
    const ok = p => { const st=pv(p); return st.r===a.realm || hostile(st.r, a.realm) || st.occ===a.realm; };
    const land = (PROVDATA[a.prov].adj||[]).filter(ok);
    let sea = [];
    if(PROVDATA[a.prov].coast && PRL().gold>=15)
      sea = Object.keys(PROVDATA).filter(p=>p!==a.prov && PROVDATA[p].coast && ok(p) && !land.includes(p));
    return {land, sea};
  },
  tryMove(pid){
    if(this.busy()){ G.moveMode = null; UI.renderAll(); return; }
    const a = G.armies.find(x=>x.id===G.moveMode);
    const t = this.moveTargets();
    G.moveMode = null;
    if(a && !a.moved){
      if(t.land.includes(pid)) moveArmy(a, pid, false);
      else if(t.sea.includes(pid)) moveArmy(a, pid, true);
    }
    UI.renderAll();
  },
  offerPeace(wid){
    if(this.busy()) return;
    const w = G.wars.find(x=>x.id===wid); if(!w) return;
    if(warAge(w) < 2){ UI.modal('Too Soon', `The war is barely a season old — no herald will carry terms before the first blows have even landed. Muster, march, and let the field speak first.`, [{t:'Then to arms.',fx:()=>{}}]); return; }
    const mySide = w.sides.a.includes(G.player)?'a':'b', foeSide = mySide==='a'?'b':'a';
    const foe = mySide==='a'?w.def:w.att;
    const s = warScore(w) * (mySide==='a'?1:-1);
    /* the terms I could impose, plus white peace, plus buying my way out when losing */
    const terms = [{kind:'white'}].concat(peaceTerms(w, mySide));
    if(s < -5){ terms.push({kind:'buyout', gold:clamp(Math.round(18 + (-s)*0.4), 10, 80), to:foe, from:G.player}); }
    const labelOf = t => t.kind==='white' ? 'Offer white peace — all go home'
      : t.kind==='tribute' ? `Demand ${t.gold} gold in tribute`
      : t.kind==='province' ? `Demand ${esc(PROVDATA[t.prov].n)} be ceded`
      : t.kind==='throne' ? `Demand the crown of ${esc(rl(t.target).n)} — full conquest`
      : t.kind==='buyout' ? `Pay ${t.gold} gold for them to depart`
      : 'Terms';
    const ch_ = [];
    for(const t of terms){
      const m = peaceAccept(w, foeSide, t);
      const [lbl, cls] = acceptLabel(m);
      ch_.push({ t:`${labelOf(t)} <span class="hint" style="margin:0">— <span class="${cls}">${lbl}</span> (${m>=0?'+':''}${m})</span>`,
        fx:()=>{ if(peaceAccept(w, foeSide, t) >= 0){ settleWar(w, t); }
          else UI.modal('They Refuse', `${esc(rl(foe).n)} will not agree to <b>${termText(w,t)}</b> — not while the war stands as it does. Press your advantage on the field, or ask for less.`, [{t:'Back to the war.',fx:()=>{}}]); }});
    }
    ch_.push({t:'⚑ Surrender — grant them their full demands', fx:()=>enforceDemands(w, foeSide)});
    ch_.push({t:'— Break off talks —', fx:()=>{}});
    UI.modal('Terms of Peace',
      `War score <b class="${s>=0?'pos':'neg'}">${s>0?'+':''}${s}</b> · ${Math.max(0,Math.round(warAge(w)/4*10)/10)} yr in the field. Offer terms and ${esc(rl(foe).n)} weighs each — a term they will accept ends the war on it. The harder your demand, the higher your hand must be.`, ch_);
  },
  courtElector(id){
    if(this.busy()) return;
    const R_ = PRL();
    if(!empIsCandidatePlayer()){ toast('You are not in the running for the Imperial crown — join the Empire or press a claim first.'); return; }
    const e = G.empire.electors.find(x=>x.id===id); if(!e) return;
    if(R_.gold<12){ toast('Courting an elector costs 12 gold in gifts and promises.'); return; }
    if(!this.order()) return;
    R_.gold -= 12;
    const seatBonus = e.seat==='spiritual' ? Math.round((R_.piety||0)/16) : Math.round(R_.prs/60);
    const gain = 12 + Math.round(councilBonus(G.player,'chaplain')) + seatBonus + ri(0,5);
    e.op = clamp(e.op + gain, -100, 100);
    toast(`⚜ You court the <b>${esc(e.n)}</b> — ${e.op>=55?'<b class="pos">their vote is yours</b>':'warming ('+e.op+'/55)'}`);

    UI.renderAll();
  },
  pressImperialClaim(){
    if(this.busy()) return;
    const R_ = PRL();
    if(R_.rel!=='catholic'){ UI.modal('The Imperial Crown','The Imperial dignity is a Catholic crown, blessed at Rome. It is closed to you while your realm keeps another faith.',[{t:'So be it.',fx:()=>{}}]); return; }
    if(empMember(G.player)){ toast('You are already of the Empire — you need no claim, only the electors’ votes.'); return; }
    if(G.empire.pretender===G.player){ toast('You have already declared your candidacy.'); return; }
    if(realmProvs(G.player).length < G.impThresh){ UI.modal('Not Yet','A pretender to the oldest crown in Christendom must command real might. Hold at least '+G.impThresh+' provinces before the princes will so much as hear your name.',[{t:'In time.',fx:()=>{}}]); return; }
    if(R_.prs<80){ toast('Pressing an Imperial claim demands renown — 80 ☀ prestige at the least.'); return; }
    if(!this.order()) return;
    R_.prs -= 40; G.empire.pretender = G.player; G.empire._contested = true;
    UI.modal('A Claim Upon the Empire', `You proclaim your candidacy for the Imperial throne — an outsider pressing in upon the oldest crown in Christendom. The prince-electors take note; some are affronted, some intrigued, all suddenly worth courting. Win them over, then contest the election — or wait for the old Emperor to die.`, [{t:'Let the princes weigh me.', fx:()=>{}}]);
    logIt('court','⚜ You proclaim your candidacy for the Imperial throne.');
    UI.renderAll();
  },
  contestElection(){
    if(this.busy()) return;
    const R_ = PRL();
    if(!empIsCandidatePlayer()){ toast('You must be of the Empire or a declared pretender to force an election.'); return; }
    if(isEmperor(G.player)){ toast('You already wear the Imperial crown.'); return; }
    if(R_.prs<60){ toast('Forcing an election costs 60 ☀ prestige — a great feast of banners and bribes.'); return; }
    const tally = electorTally(); const mine = tally[G.player]||0;
    UI.modal('Contest the Imperial Election',
      `Compel the electors to convene now, rather than wait for the Emperor's death. It costs <b>60 ☀ prestige</b>. As matters stand you would command about <b>${mine} of 7</b> electoral votes${mine>=4?' — <span class="pos">a majority</span>':', and <b>4</b> are needed'}.`,
      [{t:'Convene the electors now (60 ☀)', fx:()=>{ if(R_.prs<60||!this.order()) return; R_.prs-=60; G.empire._contested=true; imperialElection('contest'); }},
       {t:'— Wait, and court them further —', fx:()=>{}}]);
  },
  imperialDiet(){
    if(this.busy()) return;
    if(!isEmperor(G.player)){ toast('Only the Emperor may summon a Diet.'); return; }
    if(G.flags['diet'+G.year]){ toast('The Imperial Diet has already met this year.'); return; }

    R_.prs+=12; R_.leg=clamp(R_.leg+4,0,100);

  },
  imperialBan(){
    if(this.busy()) return;
    if(!isEmperor(G.player)){ toast('Only the Emperor may pronounce the Imperial Ban.'); return; }
    const targets = borderRealms(G.player).filter(r=>rl(r)&&!rl(r).dead&&r!==G.player).slice(0,10);
    if(!targets.length){ toast('No realm stands within reach of your ban.'); return; }
    UI.modal('Pronounce the Imperial Ban', `As Emperor you may place a neighbouring realm under the Imperial Ban — outlawing its prince and making war upon it a lawful act of the Empire. You gain a just cause against whomever you name.`,
      targets.map(r=>({t:`${esc(rl(r).n)} <span class="hint" style="margin:0">(${fmtN(realmStrength(r))} str)</span>`, fx:()=>{ if(!this.order()) return;
        G.flags['ban_'+r]=G.year;
        const tp = realmProvs(r).find(p=>!PR().pclaims.includes(p));
        if(tp) PR().pclaims.push(tp);
        toast(`⚜ <b>${esc(rl(r).n)}</b> is placed under the Imperial Ban`);
        logIt('court',`The Emperor pronounces the Imperial Ban upon ${rl(r).n}; a lawful war now lies open.`);
        UI.renderAll(); }})).concat([{t:'— Withhold the ban —',fx:()=>{}}]));
  },
  coronation(){
    if(this.busy()) return;
    const R_ = PRL();
    if(!isEmperor(G.player)){ toast('The crown of Empire is not yours to wear — win the Imperial election first.'); return; }
    if(R_.prs<200 || realmProvs(G.player).length<G.impThresh) return;
    R_.prs -= 200;
    ach('emperor');
    chron(`In this year, before God and such magnates as valued their lands, ${fullName(PR())} was crowned EMPEROR, lord of ${realmProvs(G.player).length} provinces from sea to sea. The chronicler was given a new scriptorium and finds his conscience untroubled.`);
    this.gameOver(true, `The bishops anoint you. The crowds roar. ${fullName(PR())}, Emperor. Your dynasty has climbed as high as crowns go.`);
  },
  /* ---------- turn loop ---------- */
  fastForward(){
    if(!G || G.over) return;
    if(this.busy()) return;
    G._ff = true;
    for(let i=0; i<8; i++){
      this.endSeason();
      if(!G || G.over || G.eventQueue.length) break;
      if(atWar(G.player).length) break;
      if(G.armies.some(a=>a.realm===G.player)) break;
      if(Object.keys(G.provinces).some(p=>enemiesIn(p, G.player).length && pv(p).r===G.player)) break;
    }
    if(G){ G._ff = false; seasonBanner(); }
  },
  endSeason(){
    if(!G || G.over || G.eventQueue.length) return;
    const logStart = G.log.length;
    warUpkeep();
    siegeTick();
    tickMandates();
    for(const rid of Object.keys(G.realms)) aiTurn(rid);
    checkWarEnds();
    plotTick();
    aiPlots();
    tryBirths();
    seasonDeaths();
    if(G.over){ UI.renderAll(); return; }
    G.season++;
    if(G.season>3){ G.season=0; G.year++; this.yearly(); }
    for(const [pcp, stc] of Object.entries(G.provinces)){
      if(!stc.cons) continue;
      if(--stc.cons.left <= 0){
        stc.bld = stc.cons.b;
        if(isPlayer(stc.r)){ toast(`${BUILDINGS[stc.bld].ico} <b>${BUILDINGS[stc.bld].n}</b> completed at ${esc(PROVDATA[pcp].n)}`); logIt('court',`The ${BUILDINGS[stc.bld].n.toLowerCase()} at ${PROVDATA[pcp].n} is complete.`); }
        delete stc.cons;
      }
    }
    if(G.plague){
      G.plague--;
      const p = pick(Object.keys(G.provinces));
      if(pv(p).dev>1 && chance(.5)){ pv(p).dev--; logIt('court', `The pestilence empties ${PROVDATA[p].n}; fields go back to briar.`); }
      if(!G.plague){
        ach('survivor');
        logIt('court','The Great Mortality burns itself out at last. The living inherit a quieter world.');
        chron(`In this year the great pestilence ended. The chronicler, who buried three fellow monks and one abbot, records it without comment. The comment is implied.`);
      }
    }
    this.income();
    for(const a of G.armies) a.moved=false;
    G.regency = age(PR())<16;
    resetOrders();
    if(G.alliances.filter(al=>al.a===G.player||al.b===G.player).length>=3) ach('matchmaker');
    if(myKids().filter(k=>alive(k)).length>=5) ach('dynast');
    fireEvents();
    /* the season report: one composed digest instead of a drip of log lines */
    if(!G._ff){
      const fresh = G.log.slice(logStart).filter(e=>e.txt && !/musters |slip away home|claim \d+ of your men/.test(e.txt));
      if(fresh.length){
        const meRe = new RegExp((PRL().n+'|'+PR().nm+'|'+(PR().dyn||'@@')).replace(/[.*+?^${}()|[\]\\]/g, m=>'\\'+m), 'i');
        const big = e => /Battle of|†|conquered|falls to|Peace between|EXCOMMUNICATED|deposed|is extinguished|declares war|with child|is born|are wed|bound by the marriage|Manzikert|joins the war|renounces/i.test(e.txt);
        const mine = fresh.filter(e=>meRe.test(e.txt));
        const warsE = fresh.filter(e=>!mine.includes(e) && e.cls==='war' && big(e));
        const world = fresh.filter(e=>!mine.includes(e) && !warsE.includes(e) && big(e)).slice(0,6);
        if(mine.length + warsE.length + world.length >= 2){
          const sec = (t, es) => es.length ? `<h3>${t}</h3>` + es.map(e=>`<div class="repLine">${e.txt}</div>`).join('') : '';
          G.eventQueue.unshift({ title:`${['🌱','☀️','🍂','❄️'][G.season]} ${SEASONS[G.season]}, ${G.year}`,
            text: sec('Your Realm', mine.slice(0,7)) + sec('Wars & Battles', warsE.slice(0,6)) + sec('The Wider World', world),
            choices:[{t:'The chronicle continues.', fx:()=>{}}] });
        }
      }
    }
    this.checkAmbition();
    this.victoryCheck();
    UI.renderAll();
    seasonBanner();
  },
  income(){
    for(const R_ of Object.values(G.realms)){
      if(R_.dead) continue;
      const f = realmFinances(R_.id);
      R_.gold = Math.max(0, Math.round((R_.gold + f.net)*10)/10);
      R_.prs += R_.rank==='kingdom'?2:1;
    }
  },
  yearly(){
    for(const R_ of Object.values(G.realms)){
      if(R_.dead) continue;
      let d = (50 - R_.leg)*.06 + councilBonus(R_.id,'chaplain')*.4 + focusLegYr(R_.id);
      d += realmProvs(R_.id).filter(p=>pv(p).bld==='cathedral').length;
      d += realmProvs(R_.id).filter(p=>pv(p).bld==='monastery').length*0.3;
      if(R_.excomm) d -= 4;
      R_.leg = clamp(R_.leg + d, 0, 100);
      R_.piety = clamp((R_.piety!=null?R_.piety:30) + pietyChange(R_.id), 0, 100);
      if(isEmperor(R_.id)) R_.prs += 3;   /* the Imperial dignity lends steady renown */
      /* Academies: renown, and slow growth of their province */
      { const acad = realmProvs(R_.id).filter(p=>pv(p).bld==='academy');
        if(acad.length){ R_.prs += acad.length;
          for(const p of acad){ const pr=pv(p); if(pr.dev<5){ pr._adev=(pr._adev||0)+1;
            if(pr._adev>=3){ pr._adev=0; pr.dev++; if(isPlayer(R_.id)&&!G._ff) toast(`🎓 <b>${esc(PROVDATA[p].n)}</b> flourishes under its academy`); } } } } }
      /* Culture: land of a foreign people drags on the crown, and slowly takes up its ruler's ways */
      { const fc = realmForeignCult(R_.id);
        if(fc.length){ let drag = Math.min(2.2, fc.length*0.3); if(cultHardy(R_.id)) drag*=0.5;
          R_.leg = clamp(R_.leg - drag, 0, 100); }
        for(const p of fc){ const pr=pv(p);
          let step = 3 + councilBonus(R_.id,'steward')*0.5;   /* good administration speeds integration */
          if(pr.rel===R_.rel) step += 2;                       /* a shared faith eases it */
          pr.asm = (pr.asm||0) + step;
          if(pr.asm>=100){ pr.asm=0; pr.cult=R_.cult;
            logIt('court', `${PROVDATA[p].n} has taken up the ${cap(R_.cult)} tongue and ways.`);
            if(isPlayer(R_.id)&&!G._ff) toast(`🏰 <b>${esc(PROVDATA[p].n)}</b> assimilates — now ${esc(cap(R_.cult))}`);
          }
        }
      }
      /* Rome watches: godless or failing kings invite the anathema */
      const rul = ruler(R_.id);
      if(rul && R_.rel==='catholic' && !R_.excomm && (R_.leg<30 || R_.piety<12 || (rul.tr.includes('cruel')&&rul.tr.includes('cynical'))) && chance(.15)){
        R_.excomm = true;
        logIt('court', `☩ Rome pronounces anathema: ${fullName(rul)} of ${R_.n} is EXCOMMUNICATED.`);
        if(isPlayer(R_.id)){
          chron(`In this year the Holy Father cast the ${rul.sex==='m'?'king':'queen'} out of the communion of the faithful, and the candles were snuffed, and every ambitious neighbor heard them go out.`);
          queueEvent({ title:'Anathema',
            text:`<span class="dropcap">Bell, book, and candle. Rome has cut you off from the Church — your oaths are void in the eyes of God, your vassals' loyalty is now a sin, and every rival suddenly remembers how devout they are. <em>(-25 opinion with everyone, legitimacy bleeds each year. Reconciling will cost gold and pride.)</em></span>`,
            choices:[{t:'God and I will discuss this privately.', fx:()=>{}}]});
        }
      }
      /* a crusading ruler comes home — or doesn't */
      if(isPlayer(R_.id) && G.flags.crusadeReturn && G.year >= G.flags.crusadeReturn){
        G.flags.crusadeReturn = 0;
        if(chance(.2)){
          queueEvent({ title:'News from the Holy Land', text:`The ships return without the ${PR().sex==='m'?'king':'queen'}. A fever outside Acre. The body travels home in salt and cedar; the crown travels faster.`,
            choices:[{t:'God takes His own.', fx:()=>killChar(PR(),'died on crusade, within sight of the walls of Acre')}]});
        } else {
          ach('crusader');
          R_.prs += 60; R_.leg = clamp(R_.leg+15,0,100); R_.gold += 20;
          queueEvent({ title:'The Crusader Returns', text:`Scarred, sun-blackened, and trailing legend, you return from the East with relics, ransoms, and a name that will outlive the deeds. <em>(+60 prestige, +15 legitimacy, +20 gold)</em>`,
            choices:[{t:'Deus vult.', fx:()=>{ chron(`In this year the ${PR().sex==='m'?'king':'queen'} returned from the Holy Land in glory, and the tales grew with each mile from the sea.`); }}]});
        }
      }
    }
    if(G.flags.spyBoost) G.flags.spyBoost = Math.max(0, G.flags.spyBoost-1);
    ensureMarriageMarket();
  },
  victoryCheck(){
    if(G.over) return;
    if(G.year>=G.endYear){ ach('century'); }
    if(G.year>=G.endYear) this.gameOver(true, `One hundred years. Through fevers, knives, storms, and stupidity, the house of ${PR().dyn} still reigns in ${PRL().n}. Most dynasties of ${G.endYear-100} are dust and cautionary tales; yours is a hundred years old and arguing about breakfast. This is victory.`);
    else if(PRL().prs>=2500) this.gameOver(true, `Your name is spoken in courts you have never seen. ${fmtN(Math.floor(PRL().prs))} prestige: minstrels, chroniclers, and terrified neighbours agree — this is the greatest house of the age.`);
  },
  gameOver(won, msg){
    if(G.over) return;
    G.over = won?'won':'lost';
    chron(won? `And here the chronicler lays down a happy pen.` : `And here the chronicle of this house ends. Pray for its souls; borrow nothing from its example.`);
    queueEvent({ title: won? '🏆 The Chronicle Ends in Glory' : '⚰ The Chronicle Ends',
      text:`<span class="dropcap">${msg}</span>`,
      choices:[{t:'Read the chronicle of the house.', fx:()=>this.showChronicle()}]});
    UI.processQueue();
  },
  showChronicle(){
    const r = PR();
    const ep = r.tr.includes('cruel')?'the Cruel':r.tr.includes('genius')?'the Wise':r.tr.includes('brave')?'the Bold'
      :r.tr.includes('kind')?'the Good':r.tr.includes('pious')?'the Pious':r.tr.includes('lustful')?'the Amorous'
      :r.tr.includes('greedy')?'the Grasping':G.over==='won'?'the Great':'the Unlucky';
    const host = document.getElementById('modalHost');
    host.innerHTML = `<div class="modalBack" id="chronicleModal"><div class="modal">
      <h2>The Chronicle of House ${esc(r.dyn||'?')}</h2>
      <div class="hint" style="margin-bottom:10px">…as set down by the monks, ending in the reign of ${esc(fullName(r))} “${ep}”, ${SEASONS[G.season]} ${G.year}. ${G.over==='won'?'A triumphant house.':G.over==='lost'?'A fallen house.':''}</div>
      <div style="max-height:52vh;overflow-y:auto;padding-right:6px">` +
      G.chron.map(e=>`<div class="chronEntry"><span class="yr">A.D. ${e.y}</span>${e.txt}</div>`).join('') +
      `</div><div class="choices" style="margin-top:12px">
        ${G.over?'<button class="primary" onclick="location.reload()">Begin a new chronicle</button>':'<button onclick="UI.renderAll()">Return to the realm</button>'}
      </div></div></div>`;
  },
  /* ---------- persistence ---------- */
  save(){
    if(!G){ return; }
    if(G.eventQueue.length){ UI.modal('Not Now','Settle the matter before you (the open event) before the scribes can copy the ledgers.',[{t:'Very well.',fx:()=>{}}]); return; }
    try{
      const s = JSON.stringify(Object.assign({}, G, {eventQueue:[], sel:null, moveMode:null, _cid}));
      localStorage.setItem('crownRealmSave', s);
      logIt('court','The scribes copy the ledgers. (Game saved.)');
      toast('📜 <b>Game saved</b>');
      UI.renderLog();
    }catch(e){ alert('Save failed: '+e); }
  },
  load(){
    const s = localStorage.getItem('crownRealmSave');
    if(!s){ alert('No saved chronicle found.'); return; }
    try{
      G = JSON.parse(s);
      G.eventQueue = []; G.sel=null; G.moveMode=null;
      if(!G.empire) empInit();   /* migrate older saves to the Empire system */
      if(!G.stats) G.stats = {warsWon:0};
      _cid = G._cid||900;
      srand((G.seed + G.year*4 + G.season)>>>0);
      document.getElementById('setup').style.display='none';
      UI.tab('dyn'); UI.renderAll();
      logIt('court','The chronicle resumes. (Game loaded.)'); UI.renderLog();
    }catch(e){ alert('Load failed: '+e); }
  },
  start(scenId, rid){
    newGame(rid, (Date.now() ^ (Math.random()*1e9))>>>0, scenId);
    document.getElementById('setup').style.display='none';
    try{ if(localStorage.getItem('crownMusic')==='on'){ MUSIC.start(); const b=document.getElementById('musBtn'); if(b) b.textContent='🎵'; } }catch(e){}
    fireEvents(true); /* opening turn: the briefing and scripted history only */
    const card = SCENARIOS[scenId].cards[rid];
    if(card && card.brief){
      G.eventQueue.unshift({ title:'A Crown Is Heavy',
        text:`<span class="dropcap">${card.brief}</span><br><br><em>Victory: win the Imperial crown (Empire tab) and be crowned at ${G.impThresh} provinces · keep the dynasty alive to ${G.endYear} · or amass 2500 ☀ prestige.<br>Space ends the season · F hurries quiet ones · Esc deselects · hover anything for detail. The Council Advises panel will point the way.</em>`,
        choices:[{t:'To the matter at hand.', fx:()=>{}}]});
    }
    Game.pickAmbition(true);   /* the new reign chooses its ambition */
    UI.tab('dyn');
    { const capId = rl(rid).cap;
      if(capId && PROVDATA[capId]){ const L=PROVDATA[capId].lbl, w=560, h=Math.round(w*747/1000);
        UI.view = { x:clamp(L[0]-w/2,0,1000-w), y:clamp(L[1]-h/2,0,747-h), w, h }; } }
    UI.renderAll();
    UI.applyView();
  },
};

/* ---------- map zoom & pan ---------- */
UI.view = {x:0, y:0, w:1000, h:747};
UI.applyView = function(){
  const s = document.getElementById('mapSvg');
  if(!s) return;
  s.setAttribute('viewBox', `${this.view.x} ${this.view.y} ${this.view.w} ${this.view.h}`);
  s.classList.toggle('zoomedOut', this.view.w > 620);
  s.style.setProperty('--pnfs', (9.5*Math.pow(this.view.w/1000, .55)).toFixed(2)+'px');
  s.style.setProperty('--bifs', (9*Math.pow(this.view.w/1000, .55)).toFixed(2)+'px');
};
UI.zoom = function(f, cx, cy){
  const v = this.view;
  const nw = clamp(v.w*f, 95, 1000), nh = nw*0.747;   /* a deeper floor so tight province clusters spread enough to click */
  if(cx===undefined){ cx = v.x+v.w/2; cy = v.y+v.h/2; }
  v.x = clamp(cx - (cx-v.x)*(nw/v.w), 0, 1000-nw);
  v.y = clamp(cy - (cy-v.y)*(nh/v.h), 0, 747-nh);
  v.w = nw; v.h = nh;
  this.applyView();
  this.rescaleTokens();
};
UI.rescaleTokens = function(){ if(this._tokRAF) cancelAnimationFrame(this._tokRAF);
  this._tokRAF = requestAnimationFrame(()=>{ if(G && !G.over && document.getElementById('armyLayer')) UI.renderMapDynamic(); }); };
UI.resetView = function(){ this.view = {x:0, y:0, w:1000, h:747}; this.applyView(); this.rescaleTokens(); };
(function(){
  const wrap = document.getElementById('mapWrap'), svgEl = document.getElementById('mapSvg');
  const toSvg = e => {
    const r = svgEl.getBoundingClientRect(), v = UI.view;
    const sc = Math.min(r.width/v.w, r.height/v.h);
    const ox = (r.width - v.w*sc)/2, oy = (r.height - v.h*sc)/2;
    return [v.x + (e.clientX-r.left-ox)/sc, v.y + (e.clientY-r.top-oy)/sc];
  };
  wrap.addEventListener('wheel', e => {
    if(!G) return;
    e.preventDefault();
    const [cx, cy] = toSvg(e);
    UI.zoom(e.deltaY>0 ? 1.22 : 0.82, cx, cy);
  }, {passive:false});
  let drag = null;
  wrap.addEventListener('pointerdown', e => {
    drag = {sx:e.clientX, sy:e.clientY, vx:UI.view.x, vy:UI.view.y, moved:false};
    UI._dragMoved = false;
  });
  window.addEventListener('pointermove', e => {
    if(!drag) return;
    const dx = e.clientX-drag.sx, dy = e.clientY-drag.sy;
    if(Math.abs(dx)+Math.abs(dy) > 6){ drag.moved = true; UI._dragMoved = true; }
    if(!drag.moved) return;
    const r = svgEl.getBoundingClientRect(), v = UI.view;
    const sc = Math.min(r.width/v.w, r.height/v.h);
    v.x = clamp(drag.vx - dx/sc, 0, 1000-v.w);
    v.y = clamp(drag.vy - dy/sc, 0, 747-v.h);
    UI.applyView();
  });
  window.addEventListener('pointerup', () => { drag = null; setTimeout(()=>{ UI._dragMoved = false; }, 0); });
})();

/* ---------- event window dragging ---------- */
(function(){
  let drag = null;
  document.addEventListener('pointerdown', e=>{
    const h2 = e.target.closest ? e.target.closest('.modal h2') : null;
    if(!h2) return;
    const modal = h2.closest('.modal');
    const cur = modal.style.transform.match(/translate\((-?\d+(?:\.\d+)?)px,\s*(-?\d+(?:\.\d+)?)px\)/);
    drag = { modal, sx:e.clientX, sy:e.clientY, ox: cur?parseFloat(cur[1]):0, oy: cur?parseFloat(cur[2]):0 };
    e.preventDefault();
  });
  document.addEventListener('pointermove', e=>{
    if(!drag) return;
    drag.modal.style.transform = `translate(${drag.ox + e.clientX-drag.sx}px, ${drag.oy + e.clientY-drag.sy}px)`;
  });
  document.addEventListener('pointerup', ()=>{ drag = null; });
})();

/* ---------- keyboard shortcuts ---------- */
document.addEventListener('keydown', e=>{
  if(!G || G.over) return;
  const modalOpen = G.eventQueue.length>0;
  if(e.key==='Escape' && !modalOpen){ G.sel=null; G.moveMode=null; UI.renderAll(); }
  if((e.key===' '||e.key==='Enter') && !modalOpen && !e.repeat){ e.preventDefault(); Game.endSeason(); }
  if((e.key==='f'||e.key==='F') && !modalOpen){ Game.fastForward(); }
});

/* ---------- tooltip engine ---------- */
(function(){
  const tip = document.createElement('div'); tip.id='tipBox'; document.body.appendChild(tip);
  document.addEventListener('mousemove', e=>{
    const el = e.target && e.target.closest ? e.target.closest('[data-tip]') : null;
    if(el && el.getAttribute('data-tip')){
      tip.innerHTML = el.getAttribute('data-tip');
      tip.style.display='block';
      const w = tip.offsetWidth, h2 = tip.offsetHeight;
      let x = e.clientX+14, y = e.clientY+16;
      if(x+w > innerWidth-8) x = e.clientX-w-10;
      if(y+h2 > innerHeight-8) y = e.clientY-h2-10;
      tip.style.left = x+'px'; tip.style.top = y+'px';
    } else tip.style.display='none';
  });
})();

/* ---------- setup screen ---------- */
function renderSetup(scenId){
  const S = SCENARIOS[scenId];
  document.getElementById('scenTabs').innerHTML = Object.entries(SCENARIOS).map(([sid,s])=>
    `<button class="scenBtn${sid===scenId?' on':''}" onclick="renderSetup('${sid}')">${s.n}</button>`).join('');
  document.getElementById('setupSub').textContent = S.sub;
  document.getElementById('realmCards').innerHTML = Object.entries(S.cards).map(([rid,card])=>{
    const r = REALMDATA[rid];
    return `
    <div class="realmCard" onclick="Game.start('${scenId}','${rid}')">
      <svg class="shield" viewBox="0 0 34 38"><path d="M3 3 h28 v18 q0 8 -14 14 q-14 -6 -14 -14 z" fill="${r.col}" stroke="#3a2c18" stroke-width="1.5"/>
      <text x="17" y="21" text-anchor="middle" font-size="13" fill="#f3e9cf" font-family="Georgia" font-weight="bold">${r.n[0]}</text></svg>
      <h2>${r.n}</h2><div class="diff">${card.diff}</div><p>${card.blurb}</p>
    </div>`;}).join('');
}
function renderAch(){
  const got = achGot();
  document.getElementById('achRow').innerHTML =
    `<div class="achTitle">— Deeds of Former Lives —</div>` +
    Object.entries(ACH).map(([id,a])=>
      `<span class="achBadge${got[id]?' got':''}" data-tip="<b>${a.n}</b><br>${a.d}${got[id]?'':'<br><i>Not yet earned</i>'}">🏅</span>`).join('');
}
renderSetup('y1066');
renderAch();
</script>
