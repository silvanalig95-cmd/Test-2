:root{
  --parch:#e9dcba; --parch2:#e0d1a6; --parch3:#d4c294; --panel:#efe4c8;
  --ink:#241a0e; --ink2:#5a4a33;
  --red:#7b2d26; --red2:#9c453b; --gold:#a8842c; --gold2:#d9b95c;
  --line:#a08c5f; --sea:#a9bdb1;
  --disp:'Cinzel', Georgia, serif;
  --body:'IM Fell English', Georgia, serif;
}
*{box-sizing:border-box; margin:0; padding:0}
html,body{height:100%}
body{
  font-family:var(--body); color:var(--ink); font-size:14px;
  background:var(--parch);
  background-image:radial-gradient(ellipse at 30% 20%, rgba(255,250,230,.5), transparent 60%),
    radial-gradient(ellipse at 80% 90%, rgba(120,90,40,.12), transparent 55%);
  display:flex; flex-direction:column; overflow:hidden;
}
::-webkit-scrollbar{width:10px} ::-webkit-scrollbar-thumb{background:linear-gradient(var(--line),#8a744a); border-radius:5px; border:2px solid transparent; background-clip:padding-box}
::-webkit-scrollbar-track{background:transparent}
@media (prefers-reduced-motion: reduce){ *,*::before,*::after{animation:none!important; transition:none!important} }

/* ---------- buttons ---------- */
button{
  font-family:var(--body); cursor:pointer; color:var(--ink); font-size:13px;
  background:linear-gradient(#f4ecd4,#dfd0a6); border:1px solid var(--line);
  border-radius:3px; padding:4px 11px; position:relative;
  box-shadow:inset 0 1px 0 rgba(255,252,240,.8), 0 1px 2px rgba(60,40,10,.25);
  transition:transform .08s, box-shadow .12s, background .12s;
}
button:hover{background:linear-gradient(#faf3de,#e8daB2); box-shadow:inset 0 1px 0 rgba(255,252,240,.9), 0 2px 5px rgba(60,40,10,.3)}
button:active{transform:translateY(1px); box-shadow:inset 0 1px 3px rgba(60,40,10,.3)}
button:focus-visible{outline:2px solid var(--gold2); outline-offset:1px}
button:disabled{opacity:.42; cursor:default; transform:none}
button.primary{
  background:linear-gradient(#9c453b,#6d251f); color:#f5e9cb; border-color:#4c1712;
  font-family:var(--disp); font-weight:700; letter-spacing:.6px; font-size:13px;
  box-shadow:inset 0 1px 0 rgba(255,220,180,.35), 0 2px 5px rgba(40,15,8,.45);
}
button.primary:hover{background:linear-gradient(#ad5347,#7b2d26)}
button.small{font-size:11.5px; padding:2px 8px}

/* ---------- headers & type ---------- */
h3{
  font-family:var(--disp); font-weight:700; letter-spacing:1.5px; color:var(--red);
  font-size:13.5px; margin-bottom:5px; text-transform:uppercase; display:flex; align-items:center; gap:8px;
}
h3::after{content:""; flex:1; height:3px; border-top:1px solid rgba(160,140,95,.75); border-bottom:1px solid rgba(160,140,95,.4)}
.eyebrow{font-size:10.5px; letter-spacing:2.5px; text-transform:uppercase; color:var(--ink2);
  font-family:var(--disp); margin-bottom:2px; opacity:.85}
.pos{color:#2e5e2e} .neg{color:#8c2f26}
.hint{font-size:12px; font-style:italic; color:var(--ink2); margin-top:5px; line-height:1.4}

/* ---------- top bar ---------- */
#topbar{
  display:flex; align-items:center; gap:13px; padding:6px 14px; flex:0 0 auto;
  background:linear-gradient(#43301a,#2b2013 55%, #241a0e);
  color:#e8dcbf; border-bottom:3px double var(--gold); font-size:14px; flex-wrap:wrap;
  box-shadow:0 3px 10px rgba(20,12,4,.4);
}
#topbar .title{font-family:var(--disp); font-weight:700; letter-spacing:3px; font-size:16px; color:var(--gold2);
  text-shadow:0 1px 4px rgba(0,0,0,.6)}
#topbar .res{display:flex; gap:8px; align-items:center}
#topbar .res > span{
  white-space:nowrap; background:rgba(0,0,0,.28); border:1px solid rgba(217,185,92,.35);
  border-radius:4px; padding:2px 10px; font-size:13px;
}
#topbar .res b{color:var(--gold2)}
#dateBox{font-style:italic; color:#f0e2b8; font-size:14.5px}
#realmBox{display:flex; align-items:center; gap:7px}
#realmBox .medal{width:20px; height:23px; flex:0 0 auto; filter:drop-shadow(0 1px 2px rgba(0,0,0,.5))}
#apBox{background:rgba(217,185,92,.13); border:1px solid #8a6d1f; border-radius:4px; padding:2px 10px}
#apBox .apLbl{font-family:var(--disp); font-size:11px; letter-spacing:2px; color:var(--gold2); margin-right:2px; text-transform:uppercase}
.apPip{font-size:17px; opacity:.2; filter:grayscale(1)}
.apPip.on{opacity:1; filter:none; color:#ffd968; text-shadow:0 0 7px rgba(255,217,104,.75)}
.apNone{font-size:11px; font-style:italic; color:#cbb98c}
#topbar .spacer{flex:1}

/* ---------- layout ---------- */
#main{flex:1; display:flex; min-height:0}
.panel{
  width:300px; flex:0 0 auto; overflow-y:auto; padding:10px 12px;
  background:linear-gradient(var(--panel),var(--parch2));
  font-size:13px; position:relative;
}
.panel::before{content:""; position:absolute; inset:4px; pointer-events:none;
  border:1px solid rgba(168,132,44,.35); border-radius:3px}
#leftPanel{border-right:2px solid var(--line); box-shadow:3px 0 9px rgba(60,40,10,.15)}
#rightPanel{border-left:2px solid var(--line); box-shadow:-3px 0 9px rgba(60,40,10,.15)}
#mapWrap{flex:1; min-width:0; position:relative;
  background:
    radial-gradient(ellipse at 50% 40%, rgba(224,228,204,.55), transparent 70%),
    repeating-linear-gradient(115deg, rgba(255,255,255,.05) 0 2px, transparent 2px 26px),
    linear-gradient(#adc0b2, #9db2a6 60%, #93a89d);
  box-shadow:inset 0 0 110px rgba(60,45,20,.4)}
#mapSvg{width:100%; height:100%; display:block}

/* ---------- log ---------- */
#log{
  flex:0 0 118px; overflow-y:auto; padding:7px 14px; font-size:12.5px;
  background:linear-gradient(var(--parch2),var(--parch3));
  border-top:2px solid var(--line); box-shadow:inset 0 6px 9px -6px rgba(60,40,10,.4);
}
#log .entry{margin-bottom:2px; line-height:1.4; animation:inkIn .5s ease}
@keyframes inkIn{from{opacity:0; transform:translateY(2px)} to{opacity:1}}
#log .stamp{color:var(--red); font-family:var(--disp); font-size:10px; letter-spacing:1px; margin-right:7px}
#log .war{color:#6d251f} #log .plot{color:#4a2a5a} #log .court{color:#3a4a2a}
#log .war::before{content:"⚔ "; opacity:.7} #log .plot::before{content:"🗡 "; opacity:.7} #log .court::before{content:"❧ "; opacity:.7}

/* ---------- tabs & rows ---------- */
.tabs{display:flex; flex-wrap:wrap; align-items:center; gap:3px; margin-bottom:9px}
.tabs button{position:relative; flex:1 1 auto; min-width:52px; font-size:10.5px; padding:4px 3px; font-family:var(--disp); letter-spacing:.4px; text-transform:uppercase}
.tabs button.on{background:linear-gradient(#8c3a31,#6d251f); color:#f3e6c8; border-color:#4c1712}
.tabDiv{flex:0 0 auto; width:1px; align-self:stretch; margin:2px 2px; background:linear-gradient(rgba(60,45,20,0), rgba(60,45,20,.35), rgba(60,45,20,0))}
.tabDot{display:none; position:absolute; top:3px; right:3px; width:7px; height:7px; border-radius:50%;
  background:radial-gradient(circle at 35% 35%, #ffe08a, #c99a2a); box-shadow:0 0 0 1px rgba(80,55,10,.6), 0 0 5px rgba(255,210,110,.9)}
.tabDot.has{display:block}
.tabs button.on .tabDot{display:none}
.statMeter{margin:3px 0 6px}
.statMeter .smTop{display:flex; justify-content:space-between; font-size:12px; margin-bottom:2px}
.statMeter .smBar{position:relative; height:9px; border-radius:5px; background:rgba(43,32,19,.2); overflow:hidden}
.statMeter .smFill{height:100%; border-radius:5px; transition:width .3s}
.statMeter .smMark{position:absolute; top:-1px; width:2px; height:11px; background:rgba(43,32,19,.55)}
.actGroupHd{font-family:var(--disp); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink2); margin:8px 0 3px; opacity:.8}
.ambCard{border:1px solid var(--gold2); border-radius:5px; padding:6px 9px; margin:4px 0 7px;
  background:radial-gradient(ellipse at 90% 0%, rgba(217,185,92,.20), transparent 62%), rgba(217,185,92,.08)}
.ambTop{display:flex; justify-content:space-between; align-items:center; gap:8px}
.ambTop b{font-family:var(--disp); color:var(--gold); font-size:13.5px}
.ambGoal{font-size:12px; margin-top:2px; font-variant-numeric:tabular-nums}
.stanceBtns{display:grid; grid-template-columns:1fr 1fr; gap:4px}
.stanceBtn{font-size:11.5px; padding:5px 4px; cursor:pointer}
.stanceBtn.on{background:linear-gradient(#8c3a31,#6d251f); color:#f3e6c8; border-color:#4c1712; font-weight:bold}
.charRow{display:flex; align-items:center; gap:8px; padding:5px 4px; border-bottom:1px dotted var(--line);
  cursor:pointer; border-radius:3px; transition:background .12s}
.charRow:hover{background:rgba(255,250,220,.6)}
.charRow .nm{flex:1; min-width:0}
.charRow .nm .sub{font-size:11.5px; color:var(--ink2); font-style:italic}
.medal{width:34px; height:38px; flex:0 0 auto; filter:drop-shadow(0 1px 2px rgba(60,40,10,.4))}
.medal.big{width:66px; height:74px}
.card{background:rgba(255,251,235,.65); border:1px solid var(--line); border-radius:4px; padding:9px; margin-bottom:9px;
  box-shadow:inset 0 1px 0 rgba(255,255,245,.7)}
.trait{display:inline-block; background:linear-gradient(#ece0b8,#dfd0a2); border:1px solid var(--line); border-radius:9px;
  padding:0 8px; font-size:11.5px; margin:1px 3px 2px 0; cursor:help}
.trait.bad{background:linear-gradient(#e6cabc,#d9b8a8); border-color:#a07a5f}
.kv{display:flex; justify-content:space-between; padding:1.5px 0; font-size:12.5px; border-bottom:1px dotted rgba(160,140,95,.35)}
.kv b{font-weight:bold}
.actBtns{display:flex; flex-wrap:wrap; gap:5px; margin-top:8px}
.warRow{border-left:3px solid var(--red); padding-left:8px; margin-bottom:8px}
.warSides{display:flex; gap:8px; margin:6px 0 5px}
.wsCol{flex:1 1 0; min-width:0; border:1px solid rgba(43,32,19,.18); border-radius:4px; padding:4px 6px; background:rgba(255,255,255,.03)}
.wsCol.wsMine{border-left:3px solid var(--green,#2e5e2e)}
.wsCol.wsFoe{border-left:3px solid var(--red)}
.wsHd{font-size:11px; font-weight:bold; letter-spacing:.3px; margin-bottom:3px; opacity:.85}
.wsPart{display:flex; justify-content:space-between; gap:6px; font-size:12px; line-height:1.5}
.wsPart b{font-variant-numeric:tabular-nums}
.wsYou{font-size:10px; color:var(--gold); font-weight:bold}
.wsAlly{font-size:10px; opacity:.6}
.plotRow{border-left:3px solid #4a2a5a; padding-left:8px; margin-bottom:8px}
.tidCard{background:linear-gradient(rgba(58,74,90,.1),rgba(58,74,90,.04)); border:1px solid #5a6d8c;
  border-radius:4px; padding:9px; margin-bottom:10px}
.tidCard h3{color:#3d5a76}
.tidRow{display:flex; gap:7px; padding:2.5px 0; font-size:12.5px; line-height:1.35; border-top:1px dotted rgba(90,109,140,.3)}
.tidRow:first-of-type{border-top:none}
.tidRow .ti{flex:0 0 16px; text-align:center}
.tidRow:hover{background:rgba(255,250,220,.4)}
.repLine{font-size:13px; padding:2.5px 0; border-bottom:1px dotted rgba(160,140,95,.35); line-height:1.4}
.advCard{background:linear-gradient(rgba(140,58,49,.1),rgba(140,58,49,.04)); border:1px solid #8c5a4a;
  border-radius:4px; padding:9px; margin-bottom:10px}
.advRow{display:flex; align-items:center; gap:8px; padding:5px 0; border-top:1px dotted var(--line)}
.advWho{color:var(--gold2); font-style:italic}
.econTbl{border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-top:4px}
.econHead,.econRow{display:grid; grid-template-columns:1fr 2.4em 2.4em 2.6em; gap:6px; padding:3px 9px; align-items:center; font-size:12.5px}
.econHead{background:rgba(90,109,140,.16); font-family:var(--disp); font-size:10.5px; letter-spacing:1px; text-transform:uppercase; color:var(--gold2)}
.econRow{border-top:1px dotted var(--line); cursor:pointer}
.econRow:hover{background:rgba(138,109,31,.10)}
.econRow.occ{opacity:.55}
.econHead span, .econRow span{text-align:right; font-variant-numeric:tabular-nums}
.econHead span:first-child, .econRow .en{text-align:left; white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.relCard{border:1px solid var(--line); border-left:3px solid var(--line); border-radius:4px; padding:6px 9px; margin:5px 0; cursor:pointer; transition:background .12s}
.relCard:hover{background:rgba(138,109,31,.10)}
.relCard.ally{border-left-color:#5b8a4e}
.relCard.rival{border-left-color:#8c3a31}
.relTop{display:flex; justify-content:space-between; align-items:baseline; gap:8px}
.relTop b{font-family:var(--disp); font-size:14px}
.relCard .tag{font-size:10.5px; text-transform:uppercase; letter-spacing:.5px; white-space:nowrap}
.relSub{font-size:12px; color:var(--ink2,#6b5a3c); margin-top:2px; line-height:1.35}
.relList{border:1px solid var(--line); border-radius:4px; overflow:hidden; margin-top:4px}
.relRow{display:grid; grid-template-columns:1fr 3em 3.4em; gap:6px; align-items:center; padding:3px 9px; border-top:1px dotted var(--line); cursor:pointer; font-size:12.5px}
.relRow:first-child{border-top:none}
.relRow:hover{background:rgba(138,109,31,.10)}
.relRow .rn{white-space:nowrap; overflow:hidden; text-overflow:ellipsis}
.relRow .ro{text-align:right; font-variant-numeric:tabular-nums; font-weight:bold}
.relRow .rtag{text-align:right; font-size:10.5px; text-transform:uppercase; letter-spacing:.5px}
.claimRow{display:flex; justify-content:space-between; align-items:center; gap:8px; font-size:12.5px; line-height:1.35; padding:4px 0; border-top:1px dotted var(--line)}
.claimRow button{flex:0 0 auto}
.focusCard{border:1px solid var(--gold2); border-radius:5px; padding:8px 11px; margin:2px 0 4px;
  background:radial-gradient(ellipse at 12% 0%, rgba(217,185,92,.18), transparent 60%), rgba(217,185,92,.07)}
.focusTop{display:flex; justify-content:space-between; align-items:center; gap:8px}
.focusTop b{font-family:var(--disp); color:var(--gold); font-size:14.5px}
.focusSub{font-size:12.5px; margin-top:2px; line-height:1.4}
.seatTop{display:flex; justify-content:space-between; align-items:center; gap:8px}
.seatWho{font-size:12.5px; margin-top:2px}
.card.seatFocus{border-color:var(--gold2); box-shadow:inset 0 0 0 1px rgba(217,185,92,.25)}
.pietyBar{position:relative; height:10px; border-radius:5px; background:rgba(43,32,19,.22); overflow:hidden; margin-top:5px}
.pietyFill{height:100%; background:linear-gradient(90deg, #7c6cc0, #b0a0e0); transition:width .3s}
.faithActs{display:flex; flex-direction:column; gap:5px}
.mandateRow{display:flex; justify-content:space-between; align-items:center; gap:8px; margin-top:6px;
  padding-top:6px; border-top:1px dashed rgba(217,185,92,.28); font-size:12px}
.mandateRow>div{flex:1 1 auto; line-height:1.35}
.mandateRow>button{flex:0 0 auto}
.mandateRow.on{color:var(--gold)}
.mandateRow.on b{color:var(--gold)}
.advRow:first-of-type{border-top:none}
.advRow .txt{flex:1; font-size:12.5px; line-height:1.4}
button.seasonal{border-color:#8a6d1f; background:linear-gradient(#f5ecd0,#e6d3a0); font-weight:bold}

/* skill bars */
.sklb{display:flex; align-items:center; gap:7px; padding:2px 0; font-size:12px}
.sklb label{width:82px; font-family:var(--disp); font-size:10px; letter-spacing:1.2px; text-transform:uppercase; color:var(--ink2)}
.sklb b{width:16px; text-align:right; color:var(--red)}
.sklTrack{flex:1; height:7px; background:rgba(90,74,51,.18); border:1px solid rgba(160,140,95,.5); border-radius:4px; overflow:hidden}
.sklFill{height:100%; background:linear-gradient(90deg,#a8842c,#d9b95c); box-shadow:inset 0 1px 0 rgba(255,240,200,.5)}

/* ---------- map ---------- */
.provPath{stroke:rgba(44,32,14,.58); stroke-width:.85; cursor:pointer; transition:filter .12s}
.provPath:hover{filter:brightness(1.13) saturate(1.08)}
.coastUnder path{fill:none; stroke:#2a2011; stroke-width:2.7; stroke-linejoin:round}
.rivers .river{fill:none; stroke:#5f8496; stroke-width:1.5; stroke-linecap:round; stroke-linejoin:round; opacity:.72; pointer-events:none}
.ledger{max-height:56vh; overflow-y:auto; font-size:12.5px}
.ledgerHead,.ledgerRow{display:grid; grid-template-columns:1.9fr 1.2fr .5fr .6fr .8fr .9fr; gap:6px; align-items:center; padding:3px 6px}
.ledgerHead{font-family:var(--disp); font-size:9.5px; letter-spacing:1px; text-transform:uppercase; color:var(--ink2); border-bottom:1px solid var(--line)}
.ledgerRow{border-bottom:1px dotted rgba(160,140,95,.4); cursor:pointer}
.ledgerRow:hover{background:rgba(255,250,220,.6)}
.ledgerRow.me{background:rgba(217,185,92,.16)}
.ledgerRow .lr{display:flex; align-items:center; gap:6px}
.ledgerRow span{font-variant-numeric:tabular-nums}
.provPath.sel{stroke:#fff8e0; stroke-width:2.8; animation:selPulse 1.6s ease-in-out infinite}
.provPath.hlRealm{stroke:#fff4d6; stroke-width:2.2; filter:brightness(1.1)}
.provPath.dimmed{opacity:.42; filter:saturate(.6)}
.provPath.waste{cursor:default; stroke:#7a7463; stroke-width:1}
.provPath.waste:hover{filter:none}
.provName.waste{opacity:.65; font-style:italic}
@keyframes selPulse{50%{stroke-opacity:.55}}
.zoomedOut .provName.small{display:none}
.zoomedOut .bldIco.small{display:none}
.bldIco{font-size:var(--bifs, 9px); fill:#f6eed6; text-anchor:middle; pointer-events:none;
  paint-order:stroke; stroke:rgba(30,20,8,.8); stroke-width:2px}
.fx .fxw{font-size:.85em}
.bigIco{font-size:15px; width:22px; display:inline-block; text-align:center}
.provName{font-size:var(--pnfs, 9.5px); fill:#f6eed6; text-anchor:middle; pointer-events:none;
  font-family:var(--body); paint-order:stroke; stroke:rgba(30,20,8,.8); stroke-width:2.8px; letter-spacing:.4px}
.armyTok{cursor:pointer; opacity:.84; transition:opacity .12s}
.armyTok:hover, .armyTok.seldTok{opacity:1}
.armyTok text{font-size:10px; fill:#fff; text-anchor:middle; font-weight:bold; pointer-events:none; font-family:Georgia,serif}
.moveTarget{stroke:#ffe98a; stroke-width:3; stroke-dasharray:6 4; animation:dash 1s linear infinite}
@keyframes dash{to{stroke-dashoffset:-20}}
.capStar{pointer-events:none}
.siegeIco{animation:flicker 1.1s ease-in-out infinite; pointer-events:none}
@keyframes flicker{50%{opacity:.55}}
.seaLbl{fill:rgba(55,72,66,.6); font-style:italic; font-size:16px; letter-spacing:4px;
  text-anchor:middle; font-family:var(--body)}
.rhumb{stroke:rgba(70,85,78,.16); stroke-width:1}
.compass circle{fill:none; stroke:rgba(55,72,66,.5); stroke-width:1.2}
.compass path{fill:rgba(55,72,66,.5)}
.compass path.thin{fill:none; stroke:rgba(55,72,66,.35); stroke-width:1.2}
.compass text{fill:rgba(55,72,66,.7); font-size:13px; text-anchor:middle; font-family:var(--disp)}
.cartouche rect{fill:rgba(238,227,196,.88); stroke:#8a6d1f; stroke-width:1.5}
.cartouche text{fill:#6b552e; font-size:15px; letter-spacing:3px; text-anchor:middle; font-family:var(--disp)}
.cartouche .cartSub{font-size:10px; letter-spacing:1px; font-style:italic; fill:#8a7448; font-family:var(--body)}
.tglyph{stroke:rgba(40,28,10,.4); fill:none; stroke-width:1.5; pointer-events:none}
#zoomCtl{position:absolute; right:12px; top:12px; display:flex; flex-direction:column; gap:5px; z-index:6}
#zoomCtl button{width:30px; height:30px; padding:0; font-size:16px; font-family:Georgia,serif}
#mapModes{position:absolute; left:12px; top:12px; display:flex; gap:0; z-index:6; box-shadow:0 1px 5px rgba(30,20,8,.35); border-radius:5px; overflow:hidden}
#mapModes button{padding:4px 10px; font-size:11.5px; font-family:var(--disp); letter-spacing:.5px; border:none; border-right:1px solid rgba(30,20,8,.25);
  background:linear-gradient(#efe6cd,#ddcca2); color:#3a2c14; cursor:pointer}
#mapModes button:last-child{border-right:none}
#mapModes button.on{background:linear-gradient(#c9b06a,#b2953f); color:#2b2013; font-weight:bold; text-shadow:0 1px 0 rgba(255,255,255,.25)}
#mapLegend{position:absolute; left:12px; top:44px; z-index:6; display:none; flex-direction:column; gap:2px;
  background:rgba(238,227,196,.92); border:1px solid #8a6d1f; border-radius:5px; padding:6px 9px; font-size:11px; color:#3a2c14; max-width:170px; box-shadow:0 1px 5px rgba(30,20,8,.3)}
#mapLegend.show{display:flex}
#mapLegend .lgRow{display:flex; align-items:center; gap:6px}
#mapLegend .lgSw{width:12px; height:12px; border-radius:2px; border:1px solid rgba(30,20,8,.4); flex:0 0 auto}
#mapLegend .lgHd{font-family:var(--disp); font-weight:bold; letter-spacing:.5px; margin-bottom:2px}
.provPath.mineOverlay{stroke:#2b2013; stroke-width:1.6}
#mapWrap{touch-action:none}
.tglyphF{fill:rgba(35,50,18,.35); stroke:none; pointer-events:none}

/* ---------- tooltip ---------- */
#tipBox{
  position:fixed; z-index:90; display:none; max-width:260px; pointer-events:none;
  background:linear-gradient(#f4ead0,#e8daae); color:var(--ink);
  border:1px solid #6b552e; border-radius:4px; padding:7px 10px; font-size:12px; line-height:1.45;
  box-shadow:0 4px 14px rgba(20,12,4,.45), inset 0 0 14px rgba(160,120,50,.12);
  font-family:var(--body);
}
#tipBox b{color:var(--red); font-family:var(--disp); font-size:12px; letter-spacing:.5px}

/* ---------- modals ---------- */
.modalBack{position:fixed; inset:0; background:rgba(23,15,6,.18); display:flex;
  align-items:flex-start; justify-content:center; padding-top:56px;
  z-index:50; animation:fadeIn .22s ease; pointer-events:none}
.modalBack .modal{pointer-events:auto}
.modal h2{cursor:grab}
.modal h2:active{cursor:grabbing}
@keyframes fadeIn{from{opacity:0}}
.modal{
  width:min(480px,88vw); max-height:80vh; overflow-y:auto; position:relative;
  background:
    radial-gradient(ellipse at 20% 8%, rgba(255,250,235,.65), transparent 55%),
    linear-gradient(#f4ead0,#e6d7ae);
  border:1px solid #6b552e; border-radius:5px;
  box-shadow:0 0 0 4px rgba(238,227,196,.95), 0 0 0 5px #8a6d1f, 0 14px 50px rgba(0,0,0,.55),
    inset 0 0 70px rgba(160,120,50,.14);
  padding:20px 26px; animation:scrollIn .28s ease;
}
@keyframes scrollIn{from{opacity:0; transform:translateY(10px) scale(.985)}}
.modal::before{content:"❧"; position:absolute; top:6px; left:10px; color:rgba(138,109,31,.5); font-size:15px}
.modal::after{content:"❧"; position:absolute; bottom:6px; right:10px; color:rgba(138,109,31,.5); font-size:15px; transform:rotate(180deg)}
.modal h2{
  font-family:var(--disp); font-weight:700; letter-spacing:2px; color:var(--red); font-size:19px;
  display:flex; align-items:center; gap:12px; text-align:center; margin-bottom:12px; text-transform:uppercase;
}
.modal h2::before,.modal h2::after{content:""; flex:1; height:3px;
  border-top:1px solid rgba(160,140,95,.8); border-bottom:1px solid rgba(160,140,95,.4)}
.modal .body{font-size:14.5px; line-height:1.55; margin-bottom:13px}
.modal .body em{color:var(--ink2)}
.modal .choices{display:flex; flex-direction:column; gap:7px}
.modal .choices button{text-align:left; padding:9px 13px 9px 30px; font-size:13.5px; line-height:1.4; position:relative}
.modal .choices button::before{content:"❯"; position:absolute; left:11px; top:9px; color:var(--gold); font-size:12px; transition:transform .12s}
.modal .choices button:hover::before{transform:translateX(3px)}
.modal .fine{font-size:11.5px; color:var(--ink2); font-style:italic; margin-top:3px}
.evWho{display:flex; gap:10px; align-items:center; margin-bottom:10px; line-height:1.5;
  background:rgba(255,251,235,.55); border:1px solid var(--line); border-radius:4px; padding:7px 9px}
.btMath{font-family:'Courier New',monospace; font-size:12px; background:rgba(255,255,255,.45);
  border:1px dashed var(--line); padding:7px 9px; margin:8px 0; white-space:pre-wrap}

/* battle scroll */
.btShields{display:flex; align-items:center; justify-content:center; gap:22px; margin:4px 0 10px}
.btShields .side{text-align:center; width:150px}
.btShields .btRealm{font-family:var(--disp); font-weight:700; font-size:13px; letter-spacing:1px; margin-top:3px}
.btShields .btCmdr{font-size:11.5px; font-style:italic; color:var(--ink2)}
.btVs{font-size:26px; color:var(--red); text-shadow:0 1px 3px rgba(60,20,10,.4)}
.btrow{display:flex; align-items:center; font-size:13px; padding:2.5px 6px; border-bottom:1px dotted rgba(160,140,95,.4)}
.btrow span{flex:1; text-align:center; font-variant-numeric:tabular-nums}
.btrow em{flex:1.15; text-align:center; font-style:normal; font-family:var(--disp); font-size:9.5px;
  letter-spacing:1.5px; text-transform:uppercase; color:var(--ink2)}
.btrow.strength span{font-weight:bold; font-size:15px}
.btOutcome{text-align:center; font-family:var(--disp); font-weight:700; letter-spacing:1.5px; font-size:14px;
  margin:10px 0 3px; padding:5px; border-top:1px solid var(--line); border-bottom:1px solid var(--line)}
.btOutcome.win{color:#2e5e2e} .btOutcome.lose{color:var(--red)}
.btCas{text-align:center; font-size:12.5px; font-style:italic; color:var(--ink2)}

/* ---------- setup ---------- */
#setup{position:fixed; inset:0; z-index:60; overflow:hidden auto;
  background:radial-gradient(ellipse at 50% 30%, #4a3823, #241a0d 75%);
  color:#e8dcbf; display:flex; flex-direction:column; align-items:center; padding:38px 16px}
#setup::before{content:""; position:absolute; inset:0; pointer-events:none;
  background-image:radial-gradient(1.2px 1.2px at 12% 18%, rgba(255,244,214,.8), transparent 60%),
    radial-gradient(1px 1px at 34% 8%, rgba(255,244,214,.6), transparent 60%),
    radial-gradient(1.4px 1.4px at 58% 14%, rgba(255,244,214,.7), transparent 60%),
    radial-gradient(1px 1px at 76% 6%, rgba(255,244,214,.55), transparent 60%),
    radial-gradient(1.2px 1.2px at 88% 22%, rgba(255,244,214,.7), transparent 60%),
    radial-gradient(1px 1px at 22% 30%, rgba(255,244,214,.5), transparent 60%),
    radial-gradient(1.3px 1.3px at 66% 28%, rgba(255,244,214,.6), transparent 60%);
  animation:twinkle 5s ease-in-out infinite alternate}
@keyframes twinkle{to{opacity:.45}}
#comet{position:absolute; top:10%; left:-15%; width:150px; height:2.5px; pointer-events:none;
  background:linear-gradient(90deg, transparent, rgba(255,240,200,.9)); border-radius:2px;
  transform:rotate(8deg); animation:cometFly 17s linear infinite; box-shadow:0 0 12px 2px rgba(255,240,200,.4)}
#comet::after{content:""; position:absolute; right:-3px; top:-2.5px; width:8px; height:8px; border-radius:50%;
  background:radial-gradient(circle, #fff8e0, rgba(255,240,200,.15) 70%)}
@keyframes cometFly{0%{transform:translate(0,0) rotate(8deg); opacity:0} 4%{opacity:1}
  55%{opacity:1} 62%{transform:translate(130vw,18vh) rotate(8deg); opacity:0} 100%{transform:translate(130vw,18vh) rotate(8deg); opacity:0}}
#setup h1{font-family:var(--disp); font-weight:700; letter-spacing:8px; font-size:46px; color:var(--gold2);
  text-shadow:0 3px 16px rgba(0,0,0,.75); animation:titleIn 1.1s ease; position:relative; text-transform:uppercase}
@keyframes titleIn{from{opacity:0; letter-spacing:16px}}
#setup .sub{font-style:italic; margin:8px 0 26px; color:#cbb98c; text-align:center; max-width:660px; line-height:1.55; font-size:15px}
.scenTabs{display:flex; gap:10px; margin:20px 0 6px; position:relative}
.scenBtn{background:transparent; color:#cbb98c; border:1px solid #8a6d1f; border-radius:4px;
  padding:7px 18px; font-size:13px; font-family:var(--disp); letter-spacing:1.5px; box-shadow:none}
.scenBtn.on{background:linear-gradient(#8c3a31,#6d251f); color:#f3e6c8; border-color:#4c1712}
.scenBtn:hover{color:#f3e6c8}
#setup .realms{display:flex; gap:20px; flex-wrap:wrap; justify-content:center; position:relative}
.realmCard{width:255px; background:linear-gradient(#efe4c8,#d9c89c); color:var(--ink);
  border:2px solid #8a6d1f; border-radius:6px; padding:15px; cursor:pointer;
  transition:transform .16s, box-shadow .16s; box-shadow:0 4px 14px rgba(0,0,0,.4)}
.realmCard:hover{transform:translateY(-6px); box-shadow:0 12px 26px rgba(0,0,0,.55), 0 0 0 1px var(--gold2)}
.realmCard h2{font-family:var(--disp); font-weight:700; color:var(--red); font-size:18px; letter-spacing:1px}
.realmCard .diff{font-size:11.5px; font-weight:bold; margin:3px 0 8px; color:var(--ink2)}
.realmCard p{font-size:12.5px; line-height:1.5}
.realmCard .shield{float:right; width:46px; height:54px; filter:drop-shadow(0 2px 4px rgba(0,0,0,.4))}
#setup .foot{margin-top:28px; font-size:12px; color:#9a8a68; font-style:italic; position:relative}
#setup .loadRow{margin-top:20px; position:relative}
#achRow{margin-top:22px; text-align:center; position:relative}
.achTitle{font-family:var(--disp); font-size:11px; letter-spacing:3px; color:#9a8a68; margin-bottom:7px; text-transform:uppercase}
.achBadge{font-size:21px; margin:0 3px; filter:grayscale(1); opacity:.3; cursor:help}
.achBadge.got{filter:none; opacity:1; text-shadow:0 0 8px rgba(217,185,92,.6)}

/* ---------- chronicle ---------- */
#chronicleModal .modal{width:min(700px,94vw)}
.chronEntry{margin-bottom:10px; line-height:1.55; font-size:14px}
.chronEntry .yr{font-family:var(--disp); color:var(--red); font-weight:700; font-size:11.5px; letter-spacing:1px; margin-right:8px}
.dropcap:first-letter{float:left; font-family:var(--disp); font-size:46px; line-height:.85; padding:3px 7px 0 0; color:var(--red)}
.seasonBadge{display:inline-block; border:1px solid var(--gold); border-radius:3px;
  padding:0 8px; background:rgba(217,185,92,.15)}
#toastHost{position:fixed; bottom:130px; left:50%; transform:translateX(-50%); z-index:80;
  display:flex; flex-direction:column; align-items:center; gap:6px; pointer-events:none}
.toast{background:linear-gradient(#3a2a18,#2b2013); color:#f0e2b8; border:1px solid var(--gold);
  border-radius:4px; padding:6px 16px; font-size:13px; box-shadow:0 4px 14px rgba(20,12,4,.5);
  animation:toastIn .25s ease, toastOut .5s ease 2.2s forwards}
.toast b{color:var(--gold2)}
@keyframes toastIn{from{opacity:0; transform:translateY(8px)}}
@keyframes toastOut{to{opacity:0; transform:translateY(-6px)}}
#seasonBanner{position:fixed; top:18%; left:50%; transform:translateX(-50%); z-index:45; pointer-events:none;
  font-family:var(--disp); font-weight:700; font-size:30px; letter-spacing:5px; color:#f5e9cb;
  text-shadow:0 2px 10px rgba(20,12,4,.8), 0 0 30px rgba(217,185,92,.4);
  padding:10px 34px; border-top:2px solid var(--gold2); border-bottom:2px solid var(--gold2);

  75%{opacity:1} 100%{opacity:0}}
.wsBar{position:relative; height:12px; background:linear-gradient(90deg, rgba(140,47,38,.45), rgba(160,140,95,.25) 50%, rgba(46,94,46,.45));
  border:1px solid var(--line); border-radius:6px; margin:5px 0 3px}
.wsBar .mk{position:absolute; top:-3px; width:4px; height:16px; background:#2b2013; border:1px solid var(--gold2); border-radius:2px}
.wsBar .zero{position:absolute; left:50%; top:0; width:1px; height:100%; background:rgba(43,32,19,.4)}
#log .entry.big{font-weight:bold}
.famLink{color:var(--red); cursor:pointer; text-decoration:underline dotted rgba(123,45,38,.5)}
.famLink:hover{color:var(--red2)}
.oddsGood{color:#2e5e2e; font-weight:bold} .oddsBad{color:#8c2f26; font-weight:bold} .oddsEven{color:#7a6218; font-weight:bold}
.resLbl{font-style:normal}
@media (max-width:1360px){ .resLbl{display:none} #topbar{gap:9px} #topbar .res > span{padding:2px 7px} #topbar .title{font-size:14px; letter-spacing:2px} }

"use strict";
/* ============ RNG & helpers ============ */
let _rs = 1;
function srand(s){ _rs = s>>>0 || 1; }
function R(){ _rs |= 0; _rs = _rs + 0x6D2B79F5 | 0; let t = Math.imul(_rs ^ _rs>>>15, 1|_rs);
  t = t + Math.imul(t ^ t>>>7, 61|t) ^ t; return ((t ^ t>>>14)>>>0)/4294967296; }
function ri(a,b){ return a + Math.floor(R()*(b-a+1)); }
function pick(arr){ return arr[Math.floor(R()*arr.length)]; }
function chance(p){ return R() < p; }
function clamp(v,a,b){ return v<a?a:(v>b?b:v); }
function cap(s){ return s.charAt(0).toUpperCase()+s.slice(1); }
function esc(s){ return String(s).replace(/[&<>"]/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function fmtN(n){ return n>=1000 ? (n/1000).toFixed(1).replace('.0','')+'k' : ''+n; }

function fmtFx(html){
  /* decorate stat changes with their symbols and colour */
  const ico = Object.assign({martial:SKILLICO.mar, diplomacy:SKILLICO.dip, intrigue:SKILLICO.int, stewardship:SKILLICO.ste}, STATICO);
  return html.replace(/([+\u2212\u2013-]\s?\d+(?:\.\d+)?)\s*(gold|prestige|legitimacy|opinion|martial|diplomacy|intrigue|stewardship)/gi,
    (m, num, stat) => {
      const neg = /^[\u2212\u2013-]/.test(num.trim());
      return `<b class="${neg?'neg':'pos'} fx">${num.replace(/\s/,'')}${ico[stat.toLowerCase()]}<span class="fxw"> ${stat}</span></b>`;
    });

const SCENARIOS = {
  y1066:{ n:'1066 · The Norman Gambit', year:1066, sub:'Edward the Confessor is dead, and dead men make no kings. Three houses now reach for the crown of England — and God alone knows which of them He favors.',
    cards:{
      england:{diff:'Difficulty: Normal', blurb:'Harold Godwinson wears a crown three men claim. Rich lands, loyal housecarls — and enemies gathering on two coasts, including his own exiled brother.',
        brief:'You are Harold, son of Godwin, crowned in January with unseemly haste. Your realm is the richest in the North — and William of Normandy and Harald of Norway both call it theirs. They will come this year or next, likely by sea, likely where you are not. Your brother Tostig guides the Norse. Keep your levies ready but remember they melt in winter; buy allies with marriages before the storm; and watch your legitimacy — a hasty crown sits loose.'},
      normandy:{diff:'Difficulty: Hard', blurb:'William the Bastard has the finest knights in Christendom, papal favor, and a claim across the sea. He needs only a fleet, a fair wind, and nerve.',
        brief:'You are William, Duke of Normandy, called the Bastard by men who check the distance first. Edward promised you England; Harold swore to uphold it on holy relics, then took the crown himself. Muster in spring, cross in summer — Rome will bless a declared war. England outnumbers you: let Hardrada land first and bleed them in the north, then strike the south while their levies limp home.'},
      norway:{diff:'Difficulty: Very Hard', blurb:'Harald Hardrada, the Thunderbolt of the North, is fifty-one and unbeaten. One last throne would crown a legend — or end one.',
        brief:'You are Harald Sigurdsson — Hardrada, the hard ruler — last of the great Northmen. Byzantium remembers you; England will learn. Your claim is thin, your host is not, and Tostig Godwinson sits at your table promising the north will rise for you. It will not, but York may fall anyway. Strike fast: your kingdom is poor and long wars favor the rich. Every season your army winters abroad, it shrinks.'},
      byzantium:{diff:'Difficulty: Hard', blurb:'The Empire is the richest realm in the world — ruled by a bookkeeper, advised by schemers, and watched from the East by a Sultan who does not read books.',
        brief:'You are Konstantinos Doukas, tenth of that name, Emperor of the Romans. The Empire is vast and rich and its armies have been left to rot to pay for it. Psellos flatters and plots; Romanos Diogenes despises you and can actually fight; and in the East the Seljuk Sultan gathers horsemen like a storm gathers clouds. History gives you until 1071. Rebuild the eastern themes, keep the schemers closer than the soldiers — or lose Anatolia in an afternoon.'},
      fatimid:{diff:'Difficulty: Hard', blurb:'The Fatimid Caliph rules the richest land in Islam from Cairo — Nile gold, the holy cities, and a court where real power belongs to whoever holds the vizier’s seal. The Turks are surging out of the east.',
        brief:'You are al-Mustansir, Fatimid Caliph in Cairo, Commander of the Faithful — and, in the plain truth of it, a jewel that viziers guard and quarrel over. Egypt is the wealthiest realm on the map: the Nile pays for everything. You hold the Levantine coast to Jerusalem and the Hejaz with Mecca and Medina. But the Seljuk Turks are pouring west and will reach for Syria and Palestine within the decade. Guard the holy cities, bind your generals to you before they bind themselves, and remember that in this court the knife comes from the next room, not the far horizon.'},
    },

  y1187:{ n:'1187 · The Devil’s Brood', year:1187, sub:'Henry II rules an empire from Scotland’s border to the Loire — and his own sons circle him like wolves, with the young King of France holding their leashes. Meanwhile, word comes from the East: Jerusalem is in peril.',
    cards:{
      england:{diff:'Difficulty: Normal (the empire), Nightmare (the family)', blurb:'Henry II holds England, Normandy, Anjou and Aquitaine — half of France. His son Richard demands the succession, his son John schemes for scraps, and Philip Augustus whispers to both.',
        brief:'You are Henry Plantagenet, second of that name, ruler of more of France than the King of France. Your enemies are not at the borders — they are at your table. Richard wants the succession named; John wants whatever Richard has; Eleanor has forgiven nothing; and young Philip of France feeds every grievance like a careful fire. Watch your spymaster’s reports. The empire is vast: it can lose provinces and endure. It cannot lose the family and endure.'},
      france:{diff:'Difficulty: Hard', blurb:'Philip Augustus is twenty-two, penniless beside the Angevins — and the most patient man in Europe. The empire encircling Paris is one family quarrel away from pieces.',
        brief:'You are Philip, called Augustus by flatterers who will one day be right. The Angevin empire surrounds Paris like a closing hand — but it is one family, and the family is at war with itself. You hold claims to Normandy, Caen and Maine: press them only when the brood turns on Henry. Until then: marriages, gifts, plots, patience. You are twenty-two. Henry is fifty-four. Arithmetic is your ally.'},
      scotland:{diff:'Difficulty: Very Hard', blurb:'William the Lion once knelt to Henry at knife-point. The humiliation is unpaid, the claim to Northumbria unforgotten, and the Angevins are busy hating each other.',
        brief:'You are William, King of Scots, called the Lion — though Henry of England once made you kneel like a lamb. The treaty that freed you expires with Henry’s life, and your claim to Northumbria has not aged a day. You cannot beat the Angevin empire in the field. You will not need to: it is eating itself. Grow your legitimacy, marry well, keep your host home in winter — and when the Devil’s Brood tears the south apart, the Lion hunts.'},
      byzantium:{diff:'Difficulty: Very Hard', blurb:'Isaac Angelos took the throne in a riot and rules like it. Bulgaria is in revolt, the Seljuks hold Anatolia, his own brother plots — and now a crusade wants passage.',
        brief:'You are Isaakios Angelos, Emperor because a mob liked you better than the last one. Bulgaria has risen under Asen; the Seljuks sit an arrow’s flight from Nicaea; your brother Alexios measures your throne with his eyes; and the treasury leaks like an old ship. The Empire has survived a thousand years by being richer, subtler, and more patient than its enemies. Be all three, quickly.'},
      ayyubid:{diff:'Difficulty: Hard', blurb:'Salah al-Din has forged Egypt and Syria into one realm and, this very year, taken Jerusalem back from the Franks after eighty-eight years. Now all Christendom takes the cross — and Richard of England is coming.',
        brief:'You are Salah al-Din Yusuf — Saladin — Sultan of Egypt and Syria, and this year the man who won Jerusalem back from the Franks. Your realm runs from the Nile to the Euphrates and your name is spoken with awe from Baghdad to Paris. But awe garrisons no walls: the fall of the Holy City has set every Christian king reaching for the cross, and the greatest of them, Richard of England, is worth an army alone. The Crusader coast — Antioch, Tripoli, Acre — is a dagger at your flank. Consolidate, keep your emirs loyal to you and not merely to victory, and meet the storm from the sea when it breaks.'},
    },

<script>
/* ============ Game state & world creation ============ */
let G = null;

function skill(c, s){
  let v = c.sk[s];
  for(const t of c.tr){ const T=TRAITS[t]; if(T && T[s]) v += T[s]; }
  return clamp(v, 0, 12);
}
function age(c){ return (G.year - c.by); }
function alive(c){ return c && !c.dead; }
function ch(id){ return G.chars[id]; }
function rl(id){ return G.realms[id]; }
function pv(id){ return G.provinces[id]; }
function ruler(rid){ return ch(rl(rid).ruler); }
function isPlayer(rid){ return rid === G.player; }
function fullName(c){ return c.nm + (c.num ? ' ' + c.num : '') + (c.epithet ? ' ' + c.epithet : ''); }
function title(c){
  const r = Object.values(G.realms).find(r=>!r.dead && r.ruler===c.id);
  if(r){
    const rt = REALMDATA[r.id] && REALMDATA[r.id].rtitle;
    if(rt){
      if(rt==='Pope') return 'Pope';
      const fem = {Emperor:'Empress', Basileus:'Basilissa', Sultan:'Sultana', Khan:'Khatun', Emir:'Emira', Doge:'Dogaressa'};
      return (c.sex==='f' ? (fem[rt]||rt) : rt) + ' of ' + r.n;
    }
    return (c.sex==='m'?(r.rank==='duchy'?'Duke':'King'):(r.rank==='duchy'?'Duchess':'Queen'))+' of '+r.n;
  }
  return c.sex==='m'?'Lord':'Lady';
}
function realmProvs(rid){ return Object.keys(G.provinces).filter(p=>G.provinces[p].r===rid); }
function realmStrength(rid){
  let s = 0;
  for(const p of realmProvs(rid)){ const pr=pv(p); if(pr.occ && pr.occ!==rid) continue; s += levyOf(p); }
  s += rl(rid).retinue||0;
  return s;
}
function legFactor(rid){ const r = rl(rid); return r ? Math.min(1, 0.7 + r.leg/150) : 1; } /* below ~45 legitimacy, vassals withhold spears */
function levyOf(p){ const pr=pv(p); return Math.round((200 + pr.dev*110 + (pr.bld==='castle'?150:0)) * legFactor(pr.r) * focusLevy(pr.r) * faithPenalty(p) * cultureLevy(pr.r)); }
function taxOf(p){ const pr=pv(p); return Math.round((pr.dev + (pr.bld==='market'?2:0)) * faithPenalty(p)); }
function realmFinances(rid){
  const R_ = rl(rid);
  let baseTax = 0, occLost = 0; const rows = [];
  for(const p of realmProvs(rid)){
    const t = taxOf(p), occ = !!pv(p).occ;
    if(occ) occLost += t; else baseTax += t;
    rows.push({p, tax:t, occ, dev:pv(p).dev, bld:pv(p).bld});
  }
  const stewPct = councilBonus(rid,'steward')*.04;
  const seasonMult = (G.season===2?2:1) * (G.plague?.65:1);
  const grossTax = baseTax*(1+stewPct)*seasonMult*focusTax(rid)*cultureTax(rid);
  const retUpkeep = R_.retinue/200;
  let armyUpkeep = 0; const hosts = [];
  for(const a of G.armies) if(a.realm===rid){
    const cost = Math.ceil(a.levies/350) + Math.ceil(a.mercs/160);
    armyUpkeep += cost; hosts.push({a, cost});
  }
  const net = Math.round((grossTax - retUpkeep - armyUpkeep)*10)/10;
  return {rows, baseTax, occLost, stewPct, seasonMult, grossTax, retUpkeep, armyUpkeep, hosts, net};
}

let _cid = 0;
function mkChar(o){
  const c = Object.assign({
    id:'c'+(++_cid), nm:'?', dyn:'', realm:'', cult:'saxon', sex:'m', by:1030, dead:0,
    tr:[], sk:{dip:ri(2,6),mar:ri(2,6),int:ri(2,6),ste:ri(2,6)}, sp:null, fa:null, mo:null,
    op:{}, claims:[], pclaims:[], seat:null,
  }, o);
  if(o.id) c.id = o.id;
  G.chars[c.id] = c;
  return c;
}
function randTraits(n){
  const out = [];
  const keys = Object.keys(TRAITS);
  while(out.length < n){
    const t = pick(keys);
    if(out.includes(t) || out.includes(TRAITS[t].opp)) continue;
    out.push(t);
  }
  return out;
}
function mkCourtier(rid, sex){
  const R_ = rl(rid);
  const cult = R_.cult;
  return mkChar({ nm:pick(NAMES[cult][sex||'m']), dyn:'', realm:rid, cult, sex:sex||'m',
    by: G.year - ri(20,52), tr:randTraits(2) });
}

function newGame(playerRealm, seed, scenId){
  srand(seed);
  _cid = 0;
  const S = SCENARIOS[scenId];
  G = {
    seed, scen:scenId, year:S.year, endYear:S.year+100, season:0, player:playerRealm,
    realms:{}, provinces:{}, chars:{}, armies:[], wars:[], plots:[], alliances:[], truces:[],
    log:[], chron:[], ordersMax:0, ordersLeft:0, ordersBonus:0, ordersTemp:[], sel:null, moveMode:null, aid:0, wid:0, pid:0, plague:0,
    flags:{}, over:false, regency:false, eventQueue:[], stats:{warsWon:0},
  };
  for(const [pid, pd] of Object.entries(PROVDATA)){
    G.provinces[pid] = { r:null, occ:null, dev:pd.d, bld:null };
  }
  for(const [rid, rd] of Object.entries(REALMDATA)){
    const provs = S.provs ? (S.provs[rid]||[]) : rd.provs;
    G.realms[rid] = { id:rid, n:rd.n, col:rd.col, cap:rd.cap, cult:rd.cult, rel:rd.rel||'catholic',
      gold:20+provs.length*8, prs:S.cards[rid]?100:60, leg:70, ruler:null, retinue:0, law:'primo', focus:defaultFocus(rid),
      excomm:false, council:{marshal:null,steward:null,spymaster:null,chaplain:null},
      rank: provs.length>=3 ? 'kingdom':'duchy', dead: provs.length?0:'unformed' };
    for(const p of provs) G.provinces[p].r = rid;
  }
  G.provinces.rouen.bld='castle'; G.provinces.idf.bld='castle';
  G.provinces.flanders.bld='market'; G.provinces.essex.bld='market';
  G.provinces.kent.bld='cathedral';

  if(scenId==='y1066'){
    G.realms.normandy.rank='duchy'; G.realms.flanders.rank='duchy'; G.realms.brittany.rank='duchy';
    G.realms.mercia.rank='duchy'; G.realms.northumbria.rank='duchy'; G.realms.wales.rank='kingdom';
    G.realms.anjou.rank='duchy'; G.realms.aquitaine.rank='duchy';
    G.realms.germany.rank='kingdom'; G.realms.sweden.rank='kingdom'; G.realms.munster.rank='kingdom';
    G.realms.ulaid.rank='kingdom'; G.realms.toulouse.rank='duchy'; G.realms.blois.rank='duchy'; G.realms.bourgogne.rank='duchy';
    G.realms.navarre.rank='kingdom'; G.realms.croatia.rank='kingdom'; G.realms.bohemia.rank='duchy';
    G.realms.apulia.rank='duchy'; G.realms.sicily.rank='duchy'; G.realms.venice.rank='duchy'; G.realms.papacy.rank='duchy';
    G.realms.germany.leg = 45; /* the Investiture quarrel smoulders */
    G.realms.germany.law = 'elective'; /* the princes elect the King of the Romans */
    G.realms.lithuania.rank='kingdom';
    G.realms.sicily.cult='arabic'; G.realms.sicily.rel='muslim'; G.realms.sicily.n='Emirate of Sicily';
    seedCast1066();
    /* standing forces of 1066: housecarls, knights, and Hardrada's veterans */
    G.realms.england.retinue = 400;
    G.realms.normandy.retinue = 500;
    G.realms.norway.retinue = 600;
    /* recent peaces hold a while: Sweyn made terms with both crowns */
    G.truces.push({a:'denmark', b:'norway', until:1069}, {a:'denmark', b:'england', until:1069});
    logIt('court', 'The chronicle of your house begins. Edward the Confessor is dead; the year of three kings has come.');
    chron(`In the year of Our Lord 1066 this chronicle was begun, when Edward the old king died childless at Westminster and the great of the earth began to circle England like ravens over a stricken hart.`);
  } else {
    G.realms.flanders.rank='duchy'; G.realms.brittany.rank='duchy'; G.realms.wales.rank='kingdom';
    G.realms.germany.rank='kingdom'; G.realms.sweden.rank='kingdom'; G.realms.munster.rank='kingdom';
    G.realms.ulaid.rank='kingdom'; G.realms.toulouse.rank='duchy'; G.realms.blois.rank='duchy'; G.realms.bourgogne.rank='duchy';
    G.realms.navarre.rank='kingdom'; G.realms.venice.rank='duchy'; G.realms.papacy.rank='duchy'; G.realms.bohemia.rank='duchy';
    G.realms.germany.law = 'elective';
    G.provinces.essex.dev=5; G.provinces.rouen.dev=4; G.provinces.idf.dev=5;
    G.provinces.york.bld='cathedral'; G.provinces.sjaelland.bld='market';
    G.realms.england.cult='norman'; /* a century of Norman kings has renamed the court */
    seedCast1187();
    /* Angevin knights and the French royal demesne guard */
    G.realms.england.retinue = 600;
    G.realms.france.retinue = 300;
    G.realms.scotland.retinue = 200;
    /* the humiliation of Falaise still binds Scotland's hands, barely */
    G.truces.push({a:'scotland', b:'england', until:1189});
    logIt('court', 'The chronicle of your house begins. The Angevin empire sprawls from Northumbria to Maine — and its heirs sharpen their knives at their father’s table.');
    chron(`In the year of Our Lord 1187 this chronicle was begun, when Henry the second of that name ruled more of France than the French king did, and his sons loved him as wolves love a wounded stag.`);
  }
  /* any realm holding land but lacking a scripted ruler gets a generated one (the Muslim powers, minor courts) */
  for(const rid of Object.keys(G.realms)){
    const R_ = G.realms[rid];
    if(R_.dead || R_.ruler) continue;
    const pool = (NAMES[R_.cult] || NAMES.arabic).m;
    const c = mkChar({ nm:pick(pool), dyn:(REALMDATA[rid]&&REALMDATA[rid].adj)||cap(rid), realm:rid, cult:R_.cult, sex:'m',
      by:G.year - ri(26,52), tr:randTraits(2), sk:{dip:ri(3,7),mar:ri(3,7),int:ri(3,7),ste:ri(3,7)} });
    R_.ruler = c.id;
  }
  ensureMarriageMarket();
  /* the player's imperial threshold scales with their inheritance */
  G.impThresh = Math.max(15, realmProvs(playerRealm).length+5);
  G.reignStart = S.year;
  for(const rid of Object.keys(G.realms)){
    if(G.realms[rid].dead) continue;
    for(let i=0;i<3;i++) mkCourtier(rid);
    aiFillCouncil(rid);
  }
  /* ---- Religion: seed each province's faith from its founding owner; give each realm its piety ---- */
  for(const [pid, pr] of Object.entries(G.provinces)){
    pr.rel = pr.r ? (rl(pr.r).rel || 'catholic') : (REALMDATA[pid]&&REALMDATA[pid].rel) || 'catholic';
    pr.cult = pr.r ? (rl(pr.r).cult) : (REALMDATA[pid]&&REALMDATA[pid].cult) || 'norman';
    pr.conv = 0;   /* progress converting this province toward its current owner's faith */
    pr.asm = 0;    /* progress assimilating this province toward its owner's culture */
  }
  for(const R_ of Object.values(G.realms)){
    if(R_.dead){ R_.piety = 25; continue; }
    const rul = ruler(R_.id);
    let p = 30;
    if(rul){ if(rul.tr.includes('pious')) p += 18; if(rul.tr.includes('cynical')) p -= 8; }
    if(R_.focus==='altar') p += 12;
    if(R_.id==='papacy') p = 95;
    R_.piety = clamp(p, 0, 100);
  }
  empInit();
  G.realms[playerRealm].gold += 10;
  resetOrders();
}

function seedCast1066(){
  const mk = mkChar;

  mk({id:'harold', nm:'Harold', num:'II', dyn:'Godwin', realm:'england', cult:'saxon', sex:'m', by:1022,

  wed('harold','ealdgyth', true);
  mk({id:'godwinson1', nm:'Godwin', dyn:'Godwin', realm:'england', cult:'saxon', sex:'m', by:1049, fa:'harold',

  mk({id:'godwinson2', nm:'Edmund', dyn:'Godwin', realm:'england', cult:'saxon', sex:'m', by:1051, fa:'harold',

  mk({id:'godwinson3', nm:'Magnus', dyn:'Godwin', realm:'england', cult:'saxon', sex:'m', by:1052, fa:'harold',

  mk({id:'gythagirl', nm:'Gytha', dyn:'Godwin', realm:'england', cult:'saxon', sex:'f', by:1053, fa:'harold',
    tr:['kind','robust'], sk:{dip:5,mar:0,int:3,ste:4}});

function wed(a, b, silent){
  const A = ch(a), B = ch(b);
  A.sp = B.id; B.sp = A.id;
  if(!silent) logIt('court', `${fullName(A)} and ${fullName(B)} are wed.`);
}
function addOp(c, tgt, d){
  const id = typeof tgt==='string' ? tgt : tgt.id;
  c.op[id] = clamp((c.op[id]||0) + d, -100, 100);
}
function opinion(a, b){
  if(!a || !b) return 0;
  let v = a.op[b.id] || 0;
  for(const t of b.tr) v += (TRAITS[t].opn||0);
  for(const t of a.tr) if(b.tr.includes(t)) v += 8; else if(b.tr.includes(TRAITS[t].opp)) v -= 10;
  if(a.dyn && a.dyn === b.dyn) v += 15;
  if(a.sp === b.id) v += 20;
  if(a.seat && rl(a.realm) && rl(a.realm).ruler === b.id) v += 15;
  /* an excommunicate is shunned by all Christendom */
  const bR = Object.values(G.realms).find(r=>!r.dead && r.ruler===b.id);
  if(bR && bR.excomm) v -= 25;
  if(relOf(a) !== relOf(b)) v -= 20; /* the infidel across the border */
  return clamp(Math.round(v), -100, 100);
}
function addAlliance(ra, rb, via){
  if(allianceBetween(ra,rb)) return;
  G.alliances.push({a:ra, b:rb, via});
}
function allianceBetween(ra, rb){
  return G.alliances.find(x=>(x.a===ra&&x.b===rb)||(x.a===rb&&x.b===ra));
}
function breakAlliance(ra, rb){
  G.alliances = G.alliances.filter(x=>!((x.a===ra&&x.b===rb)||(x.a===rb&&x.b===ra)));
}
function relationReasons(rid){
  const R_ = rl(rid), rul = ruler(rid), me = PR();
  const op = rul ? opinion(rul, me) : 0;
  const al = allianceBetween(rid, G.player);
  const w = warBetween(rid, G.player);
  const tr = truceBetween(rid, G.player);
  const sameF = R_.rel === PRL().rel;
  const theirChars = Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid);
  const crownClaim = theirChars.some(c=>c.claims.includes(G.player));
  const landClaims = [];
  for(const c of theirChars) for(const p of c.pclaims) if(pv(p)&&pv(p).r===G.player) landClaims.push(p);
  const myClaims = [];
  for(const c of myCourt()){ if(!alive(c)) continue;
    if(c.claims.includes(rid)) myClaims.push('throne');
    for(const p of c.pclaims) if(pv(p)&&pv(p).r===rid) myClaims.push(p); }
  const factors = [];
  if(w) factors.push({ico:'⚔', txt:'at war with you', good:false});
  else if(al) factors.push({ico:'⚭', txt:'bound to you by marriage', good:true});
  else if(tr) factors.push({ico:'🕊', txt:'under truce until '+tr.until, good:true});
  factors.push(sameF ? {ico:RELICO[R_.rel], txt:'shares your faith', good:true} : {ico:RELICO[R_.rel], txt:'of another faith', good:false});
  if(crownClaim) factors.push({ico:'👑', txt:'claims your crown', good:false});
  if(landClaims.length) factors.push({ico:'📜', txt:'claims '+landClaims.map(p=>PROVDATA[p].n).join(', '), good:false});
  if(R_.excomm) factors.push({ico:'☩', txt:'lies excommunicate', good:false});
  const rival = !al && !!(w || crownClaim || landClaims.length || op <= -35);
  const threat = realmStrength(rid)/Math.max(1, realmStrength(G.player));
  return {realm:R_, rul, op, al, w, tr, sameF, crownClaim, landClaims, myClaims, factors, rival, threat};
}
function isRival(rid){ return relationReasons(rid).rival; }
function sharedEnemy(rid){ return Object.values(G.realms).some(x=>!x.dead && x.id!==rid && x.id!==G.player && warBetween(x.id,G.player) && warBetween(x.id,rid)); }
function allianceMargin(rid){
  const R_=rl(rid), rul=ruler(rid), me=PR(); if(!rul||!me) return -100;
  if(allianceBetween(rid,G.player)) return -100;
  let m = opinion(rul, me);
  if(R_.rel!==PRL().rel) m -= 25;
  if(sharedEnemy(rid)) m += 30;                       /* a common foe binds courts fast */
  m += Math.round((PRL().prs - R_.prs)/12);           /* the weak seek to shelter under the renowned */
  m += skill(me,'dip')*2 + Math.round(focusOpinion(G.player)/2);
  if(rul.tr.includes('content')) m += 6; if(rul.tr.includes('ambitious')) m -= 4; if(rul.tr.includes('honest')) m += 4;
  if(atWar(G.player).length) m -= 12;                 /* wary of being dragged into your war */
  return Math.round(m - 15);                           /* a standing pact is a real commitment */
}
function tributeSum(rid){ return clamp(Math.round(12 + realmStrength(rid)/300), 8, 45); }
function tributeMargin(rid){
  const R_=rl(rid), rul=ruler(rid); if(!rul) return -100;
  const ratio = realmStrength(G.player)/Math.max(1, realmStrength(rid));
  let m = (ratio-1)*45;                                /* your dominance over them */
  if(G.armies.some(a=>a.realm===G.player && (PROVDATA[a.prov].adj||[]).some(q=>pv(q).r===rid))) m += 18; /* a host on their border */
  m += Math.round(PRL().prs/50) - Math.round(R_.prs/40);
  if(rul.tr.includes('craven')) m += 18; if(rul.tr.includes('content')) m += 8;
  if(rul.tr.includes('brave')||rul.tr.includes('wrathful')) m -= 18;
  if(R_.excomm) m += 10;
  if(atWar(rid).length) m += 12;                       /* already fighting — cannot afford you too */
  return Math.round(m - 12);
}
function aiFillCouncil(rid){
  const R_ = rl(rid);
  const court = Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&c.id!==R_.ruler&&age(c)>=16);
  const seats = [['marshal','mar'],['steward','ste'],['spymaster','int'],['chaplain','dip']];
  for(const [seat, sk] of seats){
    if(R_.council[seat] && alive(ch(R_.council[seat]))) continue;
    let best=null, bv=-1;
    for(const c of court){ if(c.seat) continue; const v=skill(c,sk); if(v>bv){bv=v;best=c;} }
    if(best){ best.seat = seat; R_.council[seat] = best.id; }
  }
}
function councilBonus(rid, seat){
  const cid = rl(rid).council[seat];
  const c = cid && ch(cid);
  if(!c || !alive(c)) return 0;
  if(c.mandate) return 0;   /* away on a mandate: an advisor cannot also tend their office */
  return skill(c, {marshal:'mar',steward:'ste',spymaster:'int',chaplain:'dip'}[seat]);
}
/* ---- Crown's Focus: a standing doctrine that rewards specialising, amplified by the matching seat ---- */
const FOCI = {
  sword:  {n:'The Sword',        ico:'⚔',  seat:'marshal',   d:'War — larger levies, swifter sieges, and prestige from every victory.'},
  purse:  {n:'The Purse',        ico:'🪙', seat:'steward',   d:'Wealth — richer taxes and cheaper building.'},
  whisper:{n:'The Whisper',      ico:'🗡', seat:'spymaster', d:'Intrigue — deadlier plots and sharper counter-intelligence.'},
  altar:  {n:'The Altar',        ico:'✝',  seat:'chaplain',  d:'Faith — steady legitimacy and fervour in holy war.'},
  olive:  {n:'The Olive Branch', ico:'🕊', seat:'chaplain',  d:'Diplomacy — warmer courts, easier alliances and marriages.'},
};
const FOCUS_OVERRIDE = { normandy:'sword', norway:'sword', england:'sword', france:'olive', scotland:'sword',
  byzantium:'whisper', venice:'purse', papacy:'altar', germany:'sword', hungary:'sword', poland:'sword',
  denmark:'sword', sweden:'purse', kiev:'olive', sicily:'purse', aquitaine:'olive', toulouse:'olive',
  andalus:'purse', castile:'sword', seljuk:'sword', fatimid:'purse', abbasid:'altar',
  ayyubid:'sword', almohad:'altar', almoravid:'altar', lithuania:'sword', cumania:'sword' };
function defaultFocus(rid){
  if(FOCUS_OVERRIDE[rid]) return FOCUS_OVERRIDE[rid];
  const keys = ['sword','purse','whisper','altar','olive'];
  let h=0; for(let i=0;i<rid.length;i++) h=(h*31+rid.charCodeAt(i))>>>0;
  return keys[h%5];
}
function realmFocus(rid){ const r=rl(rid); return (r && r.focus) || null; }
function hasFocus(rid, f){ return realmFocus(rid)===f; }
/* the matching councillor amplifies the doctrine: a great Marshal makes the Sword bite harder */
function focusPow(rid, f){ return hasFocus(rid,f) ? 1 + councilBonus(rid, FOCI[f].seat)*0.06 : 0; } /* 0, or ~1.0–1.6 */
function focusLevy(rid){ return 1 + 0.22*focusPow(rid,'sword'); }
function focusTax(rid){ return 1 + 0.26*focusPow(rid,'purse'); }

function pietyChange(rid){
  const R_=rl(rid); if(!R_||R_.dead) return 0; const rul=ruler(rid);
  let d = -1.5;                                        /* devotion fades without tending */
  d += councilBonus(rid,'chaplain')*0.5;              /* a diligent chaplain keeps the realm devout */

  d += realmProvs(rid).filter(p=>pv(p).bld==='cathedral').length*0.6;
  d += realmProvs(rid).filter(p=>pv(p).bld==='monastery').length*0.8;   /* houses of prayer keep the realm devout */

/* ---- The Holy Roman Empire: an elective crown and the authority it confers ---- */
const ELECTORS = [
  {id:'mainz',       n:'Archbishop of Mainz',            seat:'spiritual'},
  {id:'koln',        n:'Archbishop of Köln',             seat:'spiritual'},
  {id:'trier',       n:'Archbishop of Trier',            seat:'spiritual'},

  {id:'bohemia',     n:'King of Bohemia',                seat:'secular'},

const IMPERIAL_MEMBERS = ['germany','bohemia','bourgogne'];
function empInit(){
  const holder = (rl('germany')&&!rl('germany').dead) ? 'germany' : null;
  G.empire = { holder, members:IMPERIAL_MEMBERS.filter(m=>rl(m)), pretender:null, lastVote:G.year, _contested:false,
    electors: ELECTORS.map(e=>({ ...e, favor: holder||'germany', op:0 })) };
}
function isEmperor(rid){ return !!(G.empire && G.empire.holder===rid); }
function empHolder(){ return G.empire ? G.empire.holder : null; }
function empMember(rid){ return !!(G.empire && (G.empire.members.includes(rid) || G.empire.holder===rid)); }
function empEligible(rid){ const r=rl(rid); return !!(r && !r.dead && r.rel==='catholic' && ruler(rid)); }
function empIsCandidatePlayer(){ return G.empire && (empMember(G.player) || G.empire.pretender===G.player); }
function empCandidates(){
  if(!G.empire) return [];
  const set=new Set();
  for(const m of G.empire.members) if(empEligible(m)) set.add(m);
  if(G.empire.holder && empEligible(G.empire.holder)) set.add(G.empire.holder);
  if(G.empire.pretender && empEligible(G.empire.pretender)) set.add(G.empire.pretender);
  return [...set];
}
function candStrength(rid){ const r=rl(rid); return (r?r.prs:0) + realmProvs(rid).length*10 + (isEmperor(rid)?40:0); }
function electorVote(e, cands){
  /* a strongly-courted elector will cast for the player, if the player is in the running */
  if(empIsCandidatePlayer() && e.op>=55 && cands.includes(G.player)) return G.player;
  if(cands.includes(e.favor)) return e.favor;
  return cands.slice().sort((a,b)=>candStrength(b)-candStrength(a))[0];
}
function electorTally(){
  const cands = empCandidates(); const tally={}; for(const c of cands) tally[c]=0;
  for(const e of G.empire.electors){ const v=electorVote(e,cands); if(v) tally[v]=(tally[v]||0)+1; }
  return tally;
}
function imperialElection(reason){
  if(!G.empire) return;
  const cands = empCandidates();
  if(!cands.length){ G.empire.holder=null; return; }
  const tally = electorTally();
  let winner = cands[0];
  for(const c of cands) if((tally[c]||0)>(tally[winner]||0) || ((tally[c]||0)===(tally[winner]||0) && candStrength(c)>candStrength(winner))) winner=c;
  const prev = G.empire.holder;
  const playerRan = empIsCandidatePlayer() && cands.includes(G.player);
  G.empire.holder = winner; G.empire.pretender=null; G.empire.lastVote=G.year;
  for(const e of G.empire.electors){ if(!cands.includes(e.favor)) e.favor=winner; e.op=Math.round(e.op*0.7); }
  const emp = ruler(winner);
  logIt('court', `⚜ The prince-electors raise ${emp?fullName(emp):rl(winner).n} of ${rl(winner).n} to the Imperial throne.`);
  chron(`In this year the prince-electors met${reason==='death'?' upon the death of the Emperor':''} and chose ${emp?fullName(emp):'a new lord'} of ${rl(winner).n} as Emperor of the Romans${prev&&prev!==winner&&rl(prev)?`, and the dignity passed from the house of ${rl(prev).n}`:''}.`);
  if(isPlayer(winner)){
    queueEvent({ title:'⚜ You Are Elected Emperor',
      text:`<span class="dropcap">In the great cathedral the seven electors cast their votes, and the majority falls to you. ${fullName(PR())}, by the grace of God and the choice of the princes, Emperor of the Romans.</span><br><br>The imperial dignity is yours — and with it authority over the Empire and the road to a crowning victory. <em>Forge a true Empire — hold the title, hold ${G.impThresh} provinces, and 200 ☀ prestige — to be crowned and win the age.</em>`,
      choices:[{t:'Long live the Emperor.', fx:()=>{}}] });
    if(!G._ff) toast('⚜ <b>You are elected Emperor of the Romans!</b>');
  } else if(playerRan){
    queueEvent({ title:'The Imperial Election', text:`The electors have met and chosen ${emp?fullName(emp):'another'} of ${rl(winner).n}. The crown is not yours — this time. The princes remember who courts them.`, choices:[{t:'Bought, or blind. Both can be mended.', fx:()=>{}}] });
  } else if(prev!==winner && isPlayer(prev)){
    queueEvent({ title:'The Crown Passes', text:`The electors have raised ${emp?fullName(emp):'a rival'} of ${rl(winner).n} to the Imperial throne. The dignity your house held is another's now.`, choices:[{t:'Crowns are lent, never given.', fx:()=>{}}] });
  }
  G.empire._contested=false;
  if(typeof UI!=='undefined' && UI.renderAll) UI.renderAll();
}
function empOnRulerDeath(rid){ if(G.empire && G.empire.holder===rid) imperialElection('death'); }
function empOnRealmFall(rid){ if(G.empire){ if(G.empire.holder===rid) G.empire.holder=null; G.empire.members=G.empire.members.filter(m=>m!==rid); if(G.empire.pretender===rid) G.empire.pretender=null; if(!G.empire.holder) imperialElection('interregnum'); } }

/* ---- flexible order pool: base ~3, plus council, high legitimacy, and temporary event boons ---- */
function ordersMaxNow(){
  const R_ = PRL(); if(!R_) return 2;
  let n = (G.regency ? 1 : 2);                    /* the crown and its household */
  if(councilSize(G.player) >= 2) n += 1;          /* a functioning council frees the crown to do more */
  n += (G.ordersBonus||0);                        /* lasting unlocks */
  for(const t of (G.ordersTemp||[])) if(t.until > G.year + G.season/4) n += t.n;  /* temporary boons */
  if(R_.leg >= 85) n += 1;                         /* a beloved, secure crown commands readily */
  return Math.max(1, n);
}
function grantOrders(n, seasons, why){
  G.ordersTemp = G.ordersTemp || [];
  if(seasons) G.ordersTemp.push({ n, until: G.year + (G.season + seasons)/4 });
  G.ordersMax = (G.ordersMax||0) + n; G.ordersLeft = (G.ordersLeft||0) + n;
  if(why && !G._ff) toast(`⚡ ${why} — <b>+${n} order${n>1?'s':''}</b>`);
}

function tickMandates(){
  const R_ = PRL(); if(!R_) return;
  /* marshal — bank trained retinue */
  const mar = mandateOf('marshal');
  if(mar){ const men = 20 + skill(mar.c,'mar')*4;
    const mine = G.armies.filter(a=>a.realm===G.player);
    if(mine.length){ mine.sort((a,b)=>armySize(b)-armySize(a)); mine[0].retinue += men; }
    else { R_.retinue = Math.min(600, (R_.retinue||0) + men); }   /* waits in the standing retinue, applied when you next raise */
  }
  /* steward — gradual, free development of one owned province */
  const ste = mandateOf('steward');
  if(ste){ const t=ste.target, p=t?pv(t):null;
    if(p && p.r===G.player && p.dev<5){ p._dev=(p._dev||0)+1;
      if(p._dev>=4){ p._dev=0; p.dev++; logIt('court',`Steady works raise ${PROVDATA[t].n}: roads, mills, and fuller granaries.`);

  if(chp){ const fr=chp.target?rl(chp.target):null; const fru=fr&&!fr.dead?ruler(fr.id):null;
    if(fru&&alive(fru)) addOp(fru, PR().id, 2 + Math.round(skill(chp.c,'dip')/4));

const MUSIC = {

  timbre:{ western:{lead:'triangle', bass:'sine', pluck:0}, slav:{lead:'triangle', bass:'sine', pluck:0},
    norse:{lead:'sawtooth', bass:'triangle', pluck:1}, greek:{lead:'sawtooth', bass:'triangle', pluck:1}, arabic:{lead:'sawtooth', bass:'triangle', pluck:1} },
  prog:[0,5,3,4], /* the harmonic root cycles: i – vi – iv – v, one chord per bar */

  mood(){
    const m = {tension:0, sparse:0, dark:0, joy:0};
    if(!G || !rl(G.player)) return m;

  stop(){
    if(this.timer) clearInterval(this.timer); this.timer=null;
    const c=this.ctx;

  },

  if(got[id]) return;
  got[id] = 1;
  try{ localStorage.setItem('crownAch', JSON.stringify(got)); }catch(e){}
  toast(`🏅 <b>Achievement — ${ACH[id].n}</b>`);
}
function toast(html){

<script>
/* ============ Life, death & succession ============ */
function deathRisk(c){
  const a = age(c);
  let p = a<2 ? .04 : a<16 ? .006 : a<50 ? .008 : a<60 ? .035 : a<70 ? .09 : a<80 ? .18 : .32;
  if(c.tr.includes('sickly')) p *= 2.2;
  if(c.tr.includes('robust')) p *= 0.45;
  if(G.plague) p *= 2.4; /* the Great Mortality spares no rank */
  return p/4; /* checked each season */
}
function inheritedTraits(fa, mo){
  const pool = [...(fa?fa.tr:[]), ...(mo?mo.tr:[])];
  const out = [];
  if(pool.length && chance(.55)){
    const t = pick(pool);
    out.push(t);
  }
  while(out.length < 2){
    const t = pick(Object.keys(TRAITS));
    if(!out.includes(t) && !out.includes(TRAITS[t].opp)) out.push(t);
  }
  return out;
}
function tryBirths(){
  for(const c of Object.values(G.chars)){
    if(!alive(c) || c.sex!=='f') continue;
    /* carry to term */
    if(c.preg){
      c.preg--;
      if(c.preg > 0) continue;
      c.preg = 0;
      const h = ch(c.pregBy);
      c.pregBy = null;
      const fCult = (h && h.cult) || c.cult, fDyn = (h && h.dyn) || c.dyn;
      const homeRealm = (h && alive(h)) ? h.realm : c.realm;
      const births = chance(.05) ? 2 : 1;
      for(let i=0; i<births; i++){
        const sex = chance(.51)?'m':'f';
        const kid = mkChar({ nm:pick(NAMES[fCult][sex]), dyn:fDyn, realm:homeRealm, cult:fCult, sex,
          by:G.year, fa:h?h.id:null, mo:c.id, tr:inheritedTraits(h,c),
          sk:{dip:ri(1,5),mar:ri(1,5),int:ri(1,5),ste:ri(1,5)} });
        const rel = h && rl(h.realm) && rl(h.realm).ruler===h.id;
        if(rel || isPlayer(homeRealm) || isPlayer(c.realm)){
          const post = h && !alive(h) ? ', a child of a dead father' : '';
          logIt('court', `${births===2&&i===1 ? 'Twins! A second child' : `A ${sex==='m'?'son':'daughter'}`}, ${kid.nm}, is born to ${fullName(c)}${post}.`);
        }
        if(rel && isPlayer(h.realm)) chron(`In this year a ${sex==='m'?'son':'daughter'} was born to the royal house and given the name ${kid.nm}, and there was feasting.`);
      }
      if(chance(.04) && alive(c)) killChar(c, 'died in childbed');
      continue;
    }
    /* conception */
    if(!c.sp) continue;
    const h = ch(c.sp);
    if(!alive(h)) continue;
    const a = age(c);
    if(a<16 || a>45 || age(h)<16) continue;
    let p = .055;
    if(c.tr.includes('lustful')||h.tr.includes('lustful')) p += .025;
    if(c.tr.includes('chaste')||h.tr.includes('chaste')) p -= .03;
    const kidsOf = Object.values(G.chars).filter(k=>k.mo===c.id);
    if(kidsOf.some(k=>G.year - k.by < 2)) continue; /* nursing years */
    p = (p+.03) * Math.max(.25, 1 - kidsOf.length*.13);
    if(!chance(p)) continue;
    c.preg = 3; c.pregBy = h.id;
    if(isPlayer(c.realm) || isPlayer(h.realm))
      logIt('court', `${fullName(c)} is with child.`);
  }
}
function heirLine(c, seen){
  /* recursive primogeniture: sons (eldest first) then their lines, then daughters */
  const out = [];
  const kids = Object.values(G.chars).filter(k=>k.fa===c.id||k.mo===c.id);
  kids.sort((a,b)=> (a.sex===b.sex? a.by-b.by : (a.sex==='m'?-1:1)));
  for(const k of kids){
    if(seen.has(k.id)) continue;
    seen.add(k.id);
    if(alive(k)) out.push(k);
    out.push(...heirLine(k, seen));
  }
  return out;
}
function heirOf(rid){
  const r = ruler(rid);
  if(!r) return null;
  /* elective law: the magnates choose the ablest adult of the blood */
  if(rl(rid).law==='elective'){
    const cands = Object.values(G.chars).filter(c=>alive(c)&&c.dyn&&c.dyn===r.dyn&&c.id!==r.id&&c.sex==='m'&&age(c)>=16);
    if(cands.length){
      const court = Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&c.id!==r.id);
      const score = c => skill(c,'dip')+skill(c,'mar')+skill(c,'ste')+skill(c,'int')
        + (court.length ? court.reduce((s,x)=>s+opinion(x,c),0)/court.length/4 : 0);
      return cands.sort((a,b)=>score(b)-score(a))[0];
    }
  }
  const seen = new Set([r.id]);
  let line = heirLine(r, seen);
  let anc = r;
  for(let up=0; up<3 && !line.length; up++){
    if(!anc.fa || !ch(anc.fa)) break;
    anc = ch(anc.fa);
    if(!seen.has(anc.id)){ seen.add(anc.id); if(alive(anc)) line.push(anc); }
    line.push(...heirLine(anc, seen));
  }
  if(!line.length){
    line = Object.values(G.chars).filter(c=>alive(c)&&c.dyn&&c.dyn===r.dyn&&c.id!==r.id)
      .sort((a,b)=>a.by-b.by);
  }
  return line[0] || null;
}
function killChar(c, causeTxt){
  if(c.dead) return;
  c.dead = G.year;
  const spouse = c.sp ? ch(c.sp) : null;
  if(spouse){ spouse.sp = null; c.sp = null; }
  /* personal alliances die with the person */
  const lapsed = G.alliances.filter(al=>al.via===c.id);
  for(const al of lapsed){
    logIt('court', `The alliance of ${rl(al.a).n} and ${rl(al.b).n} dies with ${fullName(c)}.`);
  }
  G.alliances = G.alliances.filter(al=>al.via!==c.id);
  if(c.seat){
    const R_ = rl(c.realm);
    if(R_ && R_.council[c.seat]===c.id) R_.council[c.seat]=null;
    c.seat = null; c.mandate = null;
  }
  const R_ = Object.values(G.realms).find(r=>!r.dead && r.ruler===c.id);
  const important = R_ || isPlayer(c.realm) || c.claims.length;
  if(important) logIt('court', `${title(c)} ${fullName(c)} ${causeTxt||'has died'}, aged ${age(c)}.`);
  if(R_){ rulerDied(R_, c, causeTxt); empOnRulerDeath(R_.id); }
  else if(isPlayer(c.realm) && ruler(G.player) && c.dyn===ruler(G.player).dyn)
    chron(`In this year died ${fullName(c)} of the royal house, aged ${age(c)}, ${causeTxt||'of a sickness'}.`);
  /* a war whose claimant lies dead (and unreplaced) has no cause left */
  for(const w of [...G.wars])
    if(w.cb.type==='throne' && (!ch(w.claimant) || ch(w.claimant).dead))
      endWar(w, 'white', `The claim died with ${fullName(c)}; the armies go home.`);
  if(G.sel && G.sel.t==='char' && G.sel.id===c.id) G.sel=null;
}
function rulerDied(R_, c, causeTxt){
  chron(`In this year ${causeTxt&&causeTxt.includes('battle')?'fell':'died'} ${title(c)} ${fullName(c)} of ${R_.n}, aged ${age(c)}, ${causeTxt||'in his bed'} — ${c.tr.includes('cruel')?'and few wept':c.tr.includes('kind')?'and the poor wept in the streets':'and the realm held its breath'}.`);
  /* levy desertion: the war was his, not yet his heir's */
  for(const a of G.armies){ if(a.realm===R_.id){ a.levies = Math.floor(a.levies*.8); } }
  /* claims are personal: each passes to the heir only imperfectly */
  const h = heirOf(R_.id);
  const inherited = h ? c.claims.filter(()=>chance(.6)) : [];
  for(const w of [...G.wars]){
    if(w.cb.type==='throne' && w.claimant===c.id){
      if(h && inherited.includes(w.cb.target)){
        w.claimant = h.id;
        logIt('war', `${fullName(h)} takes up the dead ${c.sex==='m'?'king':'queen'}'s claim, and the war goes on.`);
      } else {
        endWar(w, 'white', `The claim died with ${fullName(c)}; the armies go home.`);
      }
    }
  }
  if(h) h.claims = [...new Set([...h.claims, ...inherited])];
  if(!h){
    if(isPlayer(R_.id)){ gameOver(false, `The line of ${c.dyn} is ended. ${fullName(c)} died without an heir, and strangers now sit in your halls.`); return; }
    const court = Object.values(G.chars).filter(x=>alive(x)&&x.realm===R_.id&&x.sex==='m'&&age(x)>=16);
    const nr = court.sort((a,b)=>skill(b,'dip')+skill(b,'mar')-skill(a,'dip')-skill(a,'mar'))[0] || mkCourtier(R_.id);
    nr.dyn = nr.dyn || nr.nm;
    R_.ruler = nr.id; R_.leg = clamp(R_.leg-25, 0, 100);
    logIt('court', `The house of ${c.dyn} is extinct in ${R_.n}; the magnates raise ${fullName(nr)} in its place.`);
    return;
  }
  R_.ruler = h.id;
  h.realm = R_.id;
  if(isPlayer(R_.id)) G.reignStart = G.year;
  R_.leg = clamp(R_.leg - 15, 0, 100);
  const minor = age(h) < 16;
  if(isPlayer(R_.id)){
    G.regency = minor;
    queueEvent({
      who:h.id, title:'The King is Dead',
      text:`<span class="dropcap">${fullName(c)} is dead — ${causeTxt||'the fever took him in the night'}. The crown passes to ${fullName(h)}, ${age(h)} years of age.` +
        (minor?` A child cannot rule alone: a regency council will govern until the ${h.sex==='m'?'young king':'young queen'} comes of age. The realm's enemies know this.`:
        ` The magnates swear their oaths — some more slowly than others.`) +
        `</span><br><br><em>You now play as ${fullName(h)}. Legitimacy has fallen; disappointed kin may press their own claims.</em>`,
      choices:[{t:'The '+(h.sex==='m'?'king':'queen')+' is dead. Long live the '+(h.sex==='m'?'king':'queen')+'.', fx:()=>{ R_.ambition=null; if(!G.regency && typeof Game!=='undefined') Game.pickAmbition(true); }}]
    });
  } else if(minor){
    logIt('court', `A child of ${age(h)} now wears the crown of ${R_.n}. Wolves take note.`);
  }
  /* alliances of the old ruler's realm are tested by the succession */
  for(const al of [...G.alliances]){
    if(al.a!==R_.id && al.b!==R_.id) continue;
    const other = al.a===R_.id ? al.b : al.a;
    const or = ruler(other);
    if(or && opinion(or, h) < 10 && chance(.5)){
      breakAlliance(al.a, al.b);
      logIt('court', `${rl(other).n} does not renew its oaths to the new ruler of ${R_.n}; the alliance lapses.`);
    }
  }
  /* a passed-over ambitious kinsman may take up a claim */
  const rivals = Object.values(G.chars).filter(x=>alive(x)&&x.dyn===h.dyn&&x.id!==h.id&&x.sex==='m'&&age(x)>=16&&x.tr.includes('ambitious'));
  for(const rv of rivals){
    if(chance(.35)){
      rv.claims = [...new Set([...rv.claims, R_.id])];
      addOp(rv, h.id, -40);
      logIt('plot', `${fullName(rv)} lets it be known that the succession in ${R_.n} was… irregular.`);
    }
  }
  aiFillCouncil(R_.id);
}
function seasonDeaths(){
  for(const c of Object.values(G.chars)){
    if(!alive(c)) continue;
    if(chance(deathRisk(c))){
      const cause = age(c)>60 ? 'died of old age' : pick(['died of a fever','died of the flux','died of a sudden sickness','was thrown from a horse and died']);
      killChar(c, cause);
    }
  }
}

/* ============ Diplomacy ============ */
function marriageCandidates(rid){
  /* age 13+ may be betrothed; the marriage is politics first, biology later */
  return Object.values(G.chars).filter(c=>alive(c)&&c.realm===rid&&!c.sp&&age(c)>=13&&age(c)<=(c.sex==='f'?42:60)&&c.dyn);
}
function ensureMarriageMarket(){
  /* every ruling house keeps some marriageable kin — history always found a cousin */
  for(const R_ of Object.values(G.realms)){
    if(R_.dead) continue;
    const rul = ruler(R_.id);
    if(!rul || !rul.dyn) continue;
    const kin = marriageCandidates(R_.id);
    if(!kin.some(c=>c.sex==='m')){
      mkChar({ nm:pick(NAMES[R_.cult].m), dyn:rul.dyn, realm:R_.id, cult:R_.cult, sex:'m',
        by:G.year - ri(16,30), tr:randTraits(2) });
    }
    if(!kin.some(c=>c.sex==='f')){
      mkChar({ nm:pick(NAMES[R_.cult].f), dyn:rul.dyn, realm:R_.id, cult:R_.cult, sex:'f',
        by:G.year - ri(14,26), tr:randTraits(2) });
    }
  }
}
function proposeMarriage(myChar, theirChar){
  if(relOf(myChar) !== relOf(theirChar)) return false; /* no priest will read these banns */
  const myR = rl(G.player), tR = rl(theirChar.realm);
  const tr = ruler(theirChar.realm);
  let acc = opinion(tr, ruler(G.player)) + (myR.prs - tR.prs)/8 + (myR.rank==='kingdom'?15:0);
  if(theirChar.id===tr.id) acc -= 20;
  acc += skill(ruler(G.player),'dip')*3;
  if(acc > ri(-10, 40)){
    doMarriage(myChar, theirChar);
    return true;
  }
  addOp(tr, ruler(G.player).id, -5);
  return false;
}
function isDynastic(c, realmId){ const rul=ruler(realmId); return !!(rul && (c.id===rul.id || (c.dyn && c.dyn===rul.dyn))); }
function doMarriage(a, b){
  const ra = a.realm, rb = b.realm;
  /* an alliance is sworn only when the marriage binds two ruling houses — a courtier's match does not commit realms */
  const dynastic = ra!==rb && isDynastic(a, ra) && isDynastic(b, rb);
  wed(a.id, b.id);
  /* the bride joins the groom's court */
  const groom = a.sex==='m'?a:b, bride = a.sex==='m'?b:a;
  bride.realm = groom.realm;
  if(ra!==rb){
    if(dynastic){
      addAlliance(ra, rb, bride.id);
      addOp(ruler(ra), ruler(rb).id, 15); addOp(ruler(rb), ruler(ra).id, 15);
      logIt('court', `The houses of ${rl(ra).n} and ${rl(rb).n} are bound by the marriage of ${fullName(groom)} and ${fullName(bride)}, and an alliance sworn.`);
      if(isPlayer(ra)||isPlayer(rb)) chron(`In this year was made a marriage between the houses of ${rl(ra).n} and ${rl(rb).n}, and with it an alliance sworn on holy relics.`);
    } else {
      addOp(ruler(ra), ruler(rb).id, 5); addOp(ruler(rb), ruler(ra).id, 5);
      logIt('court', `${fullName(groom)} and ${fullName(bride)} are wed, a small courtesy between ${rl(ra).n} and ${rl(rb).n} — but no realms are pledged by it.`);
    }
  }
}
